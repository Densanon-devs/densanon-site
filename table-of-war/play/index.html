      musicGain = ctx.createGain(); musicFilter.connect(musicGain); musicGain.connect(master);
      applyGains();
      loadManifest();
    } catch (e) { return false; }
    return true;
  }
  function applyGains() {
    if (!ctx) return;
    const t = ctx.currentTime;
    sfxGain.gain.setTargetAtTime(muted ? 0 : 0.34 * sfxVol, t, 0.04);
    musicGain.gain.setTargetAtTime(muted ? 0 : 0.16 * musicVol, t, 0.15);
  }
  function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }

  // ── recorded clips (optional) ──────────────────────────────────────────────────────────────────
  // A manifest rather than probing for files: 40+ speculative 404s on boot is its own bug, and the
  // build script already knows exactly which files shipped.
  let manifestDone = false;
  async function loadManifest() {
    if (manifestDone) return; manifestDone = true;
    let man = null;
    try {
      const r = await fetch('assets/audio/manifest.json', { cache: 'no-cache' });
      if (!r.ok) return;                       // no clips yet — synth carries everything
      man = await r.json();
    } catch (e) { return; }
    // Metadata FIRST, before a single byte is decoded: what shipped, how loud it should be and which
    // layers a bed carries do not depend on decoding, and the debug lab and the layer wiring need them
    // immediately. Registering them inside the decode loop meant a bed's own layers were unknown until
    // every file before it had finished.
    manSfx = (man && man.sfx) || {};
    sampleGain = (man && man.gain) || {};
    for (const [mode, m] of Object.entries((man && man.music) || {})) musicMeta[mode] = m;

    // Decode in PARALLEL. Awaiting each file in turn was ~69 serial decodes with every music bed stuck
    // behind all 62 sound effects -- on a slow device that is seconds of silence at boot.
    // Cache by FILENAME: several songs can legitimately share one layer file, and decoding the same
    // 11 MB of PCM once per song would put three copies of it in memory for no reason.
    const decoded = {};
    const grab = (file) => (decoded[file] = decoded[file] ||
      fetch('assets/audio/' + file).then(x => x.arrayBuffer()).then(a => ctx.decodeAudioData(a)));
    const jobs = [];
    for (const [cue, files] of Object.entries(manSfx)) {
      for (const f of (Array.isArray(files) ? files : [files])) {
        jobs.push(grab(f).then(b => { (samples[cue] = samples[cue] || []).push(b); })
                         .catch(() => { /* keep the synth voice for this cue */ }));
      }
    }
    for (const [mode, m] of Object.entries((man && man.music) || {})) {
      (m.variants || []).forEach((v, i) => {
        const key = 'mus_' + mode + '#' + i;
        if (v.file) jobs.push(grab(v.file).then(b => {
          samples[key] = [b];
          if (musicMode === mode && musicVariant === i) { const x = musicMode; musicMode = null; music(x); }
        }).catch(() => { /* drone stays */ }));
        for (const [layer, file] of Object.entries(v.layers || {})) {
          jobs.push(grab(file).then(b => { samples[key + '::' + layer] = [b]; })
                              .catch(() => { /* that layer just stays silent */ }));
        }
      });
    }
    await Promise.all(jobs);
    // A bed that started before its layers had decoded is playing without them. Restart it now they are
    // in -- it resumes at the same point in the loop, so this does not read as a restart.
    if (musicMode) {
      const wantsLayers = Object.keys((musicMeta[musicMode] || {}).layers || {}).length > 0;
      if (!musicSample || (wantsLayers && !Object.keys(layerGains).length)) {
        const m = musicMode; musicMode = null; music(m);
      }
    }
  }

  // ── synth primitives ──────────────────────────────────────────────────────────────────────────
  function tone(freq, dur, type, gain, slideTo, delay, rate) {
    if (muted || !ensure()) return;
    const r = rate || 1;
    const t0 = ctx.currentTime + (delay || 0) / r;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq * r, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo * r), t0 + dur / r);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain || 0.3), t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur / r);
    o.connect(g); g.connect(sfxGain); o.start(t0); o.stop(t0 + dur / r + 0.03);
  }
  function noise(dur, gain, filterFreq, delay, rate, type) {
    if (muted || !ensure()) return;
    const r = rate || 1;
    const t0 = ctx.currentTime + (delay || 0) / r;
    const n = Math.max(1, Math.floor(ctx.sampleRate * dur / r));
    const buf = ctx.createBuffer(1, n, ctx.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 1.4);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = (filterFreq || 1200) * r;
    const g = ctx.createGain(); g.gain.value = gain || 0.3;
    src.connect(f); f.connect(g); g.connect(sfxGain); src.start(t0);
  }
  // a struck body: short pitched thump through a bandpass — wood, brass, drum skin
  function knock(freq, dur, gain, q, delay, rate) {
    if (muted || !ensure()) return;
    const r = rate || 1;
    const t0 = ctx.currentTime + (delay || 0) / r;
    const n = Math.max(1, Math.floor(ctx.sampleRate * dur / r));
    const buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq * r; f.Q.value = q || 6;
    const g = ctx.createGain(); g.gain.value = gain || 0.3;
    src.connect(f); f.connect(g); g.connect(sfxGain); src.start(t0);
  }
  // a struck bell: fundamental + inharmonic partials, long decay
  function bell(freq, dur, gain, delay, rate) {
    const r = rate || 1;
    [[1, 1], [2.76, 0.5], [5.4, 0.25]].forEach(([m, a]) =>
      tone(freq * m, dur * (1 - (m > 1 ? 0.35 : 0)), 'sine', (gain || 0.2) * a, null, delay, r));
  }

  // ── the bank: one voice per cue in the taxonomy ────────────────────────────────────────────────
  // `r` is the runtime pitch/rate multiplier so repeated one-shots never machine-gun.
  const bank = {
    // interface
    ui_tap:        r => knock(720, 0.045, 0.22, 7, 0, r),                                     // piece on felt
    ui_back:       r => knock(430, 0.055, 0.18, 5, 0, r),
    ui_open:       r => { knock(520, 0.06, 0.16, 5, 0, r); noise(0.20, 0.10, 2400, 0.03, r); },
    ui_close:      r => { noise(0.13, 0.09, 1600, 0, r); knock(360, 0.05, 0.14, 5, 0.05, r); },
    ui_error:      r => { knock(150, 0.10, 0.26, 2, 0, r); tone(96, 0.11, 'square', 0.07, 84, 0.01, r); },
    ui_coin:       r => [0, 0.055, 0.115].forEach((d, i) => tone(2100 - i * 180, 0.07, 'triangle', 0.11, 1500, d, r)),
    // cards
    card_draw:     r => noise(0.14, 0.16, 3600, 0, r, 'highpass'),
    card_play:     r => { knock(300, 0.07, 0.30, 3, 0, r); noise(0.09, 0.16, 3000, 0, r, 'highpass');
                          tone(146.83, 0.30, 'triangle', 0.10, null, 0.02, r); },
    card_shuffle:  r => { for (let i = 0; i < 9; i++) noise(0.05, 0.10, 3800, i * 0.045, r, 'highpass'); },
    card_upgrade:  r => { [0, 0.13, 0.27].forEach(d => noise(0.09, 0.22, 3000, d, r, 'bandpass'));
                          bell(1174.66, 0.7, 0.12, 0.36, r); },
    card_remove:   r => noise(0.26, 0.20, 2600, 0, r, 'highpass'),
    card_curse:    r => { tone(174.61, 0.5, 'sawtooth', 0.14, 116, 0, r); tone(184, 0.5, 'sine', 0.07, null, 0, r);
                          noise(0.35, 0.07, 900, 0.05, r); },
    // units — silhouettes, not the 32 classes
    move_infantry: r => noise(0.13, 0.21, 1500, 0, r),
    move_vehicle:  r => { tone(88, 0.20, 'sawtooth', 0.10, 132, 0, r); noise(0.18, 0.09, 700, 0, r); },
    // 0.68s, doubled along with the glide it is timed against — the slide is meant to last exactly as
    // long as the engine note, so lengthening one without the other would break the pairing. Stretched
    // by DURATION, not by rate: rate would have dropped a 52Hz sawtooth to 26Hz and made it inaudible.
    move_heavy:    r => { tone(52, 0.68, 'sawtooth', 0.16, 44, 0, r); noise(0.60, 0.11, 420, 0, r);
                          knock(190, 0.10, 0.10, 4, 0.14, r); knock(190, 0.10, 0.07, 4, 0.42, r); },
    unit_deploy:   r => { knock(280, 0.07, 0.20, 4, 0, r); tone(330, 0.09, 'square', 0.12, 550, 0.03, r);
                          tone(560, 0.08, 'square', 0.08, 680, 0.08, r); },
    fire_light:    r => { noise(0.07, 0.34, 4200, 0, r, 'highpass'); knock(240, 0.05, 0.22, 3, 0, r); },
    fire_heavy:    r => { noise(0.30, 0.42, 1100, 0, r); tone(74, 0.28, 'sawtooth', 0.24, 44, 0, r);
                          noise(0.42, 0.10, 700, 0.12, r); },
    fire_energy:   r => { tone(420, 0.22, 'sine', 0.10, 1500, 0, r); tone(1500, 0.16, 'sawtooth', 0.14, 300, 0.20, r); },
    fire_launch:   r => { knock(120, 0.09, 0.26, 3, 0, r); noise(0.42, 0.18, 2600, 0.03, r, 'bandpass'); },
    impact_flesh:  r => { knock(180, 0.11, 0.81, 2, 0, r); noise(0.10, 0.43, 900, 0, r); },
    impact_metal:  r => { knock(1400, 0.09, 0.22, 9, 0, r); knock(430, 0.13, 0.20, 6, 0, r);
                          noise(0.16, 0.12, 5200, 0.02, r, 'highpass'); },
    explode_small: r => { noise(0.22, 0.44, 1700, 0, r); tone(110, 0.18, 'sawtooth', 0.20, 55, 0, r); },
    explode_large: r => { noise(0.50, 0.55, 800, 0, r); tone(64, 0.46, 'sawtooth', 0.28, 32, 0, r);
                          noise(0.70, 0.14, 1400, 0.16, r); },
    death_unit:    r => { knock(230, 0.13, 1.34, 3, 0, r); knock(150, 0.16, 1.01, 3, 0.09, r);
                          noise(0.30, 0.50, 1100, 0.10, r); },                                // a piece toppling
    death_structure: r => { noise(0.70, 0.34, 900, 0, r); tone(70, 0.55, 'sawtooth', 0.18, 38, 0, r);
                            [0.16, 0.30, 0.46].forEach(d => knock(280, 0.10, 0.13, 3, d, r)); },
    // structures, orders, healing
    build_place:   r => { knock(210, 0.10, 0.26, 3, 0, r); knock(320, 0.08, 0.18, 5, 0.09, r);
                          tone(392, 0.14, 'triangle', 0.10, null, 0.16, r); },
    power_charge:  r => { tone(180, 0.50, 'sawtooth', 0.22, 880, 0, r); noise(0.42, 0.13, 2200, 0, r);
                          bell(880, 0.5, 0.14, 0.46, r); },
    heal_repair:   r => { bell(783.99, 0.55, 0.13, 0, r); noise(0.20, 0.05, 1400, 0, r); },
    buff_apply:    r => { knock(260, 0.07, 0.18, 4, 0, r); bell(1318.51, 0.34, 0.09, 0.03, r); },
    // battle flow
    turn_player:   r => { knock(150, 0.30, 0.34, 2.2, 0, r); tone(196, 0.42, 'sine', 0.13, null, 0, r); },
    turn_enemy:    r => { knock(104, 0.36, 0.32, 2.0, 0, r); tone(130.81, 0.50, 'sine', 0.12, 123, 0, r); },
    objective_tick: r => { knock(1500, 0.035, 0.20, 10, 0, r); knock(1500, 0.035, 0.14, 10, 0.055, r); },
    objective_lost: r => { tone(311.13, 0.28, 'triangle', 0.16, null, 0, r);
                           tone(233.08, 0.42, 'triangle', 0.14, null, 0.20, r); },
    alert:         r => { tone(880, 0.11, 'square', 0.18, null, 0, r); tone(659.25, 0.15, 'square', 0.16, null, 0.12, r); },
    reveal:        r => { noise(0.34, 0.13, 3400, 0, r, 'highpass'); bell(1567.98, 0.45, 0.09, 0.16, r); },
    // progression — one unlock for everything, weighted by an optional tail
    unlock:        r => { bell(659.25, 0.8, 0.16, 0, r); tone(987.77, 0.5, 'triangle', 0.10, null, 0.10, r); },
    unlock_tail:   r => { bell(1318.51, 1.6, 0.10, 0, r); tone(164.81, 1.4, 'sine', 0.09, null, 0, r); },
    acquire:       r => { tone(523.25, 0.16, 'triangle', 0.16, null, 0, r);
                          tone(783.99, 0.26, 'triangle', 0.14, null, 0.09, r); },
    rank_up:       r => { [0, 0.05, 0.10].forEach(d => noise(0.05, 0.20, 4000, d, r, 'highpass'));
                          tone(392, 0.30, 'square', 0.14, null, 0.16, r);
                          tone(587.33, 0.42, 'triangle', 0.15, null, 0.26, r); },
    run_win:       r => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.35, 'triangle', 0.20, null, i * 0.12, r)),
    run_lose:      r => [392, 329.63, 261.63, 196].forEach((f, i) => tone(f, 0.42, 'sawtooth', 0.18, null, i * 0.14, r)),
  };
  // Cues that repeat many times a turn get pitch variance; ceremony cues must stay identical.
  const VARY = new Set(['ui_tap', 'ui_back', 'card_draw', 'card_play', 'move_infantry', 'move_vehicle',
    'move_heavy', 'fire_light', 'fire_heavy', 'fire_energy', 'fire_launch', 'impact_flesh', 'impact_metal',
    'explode_small', 'explode_large', 'death_unit', 'unit_deploy', 'objective_tick', 'buff_apply']);

  function playSample(buf, rate, gain) {
    const src = ctx.createBufferSource(); src.buffer = buf;
    src.playbackRate.value = rate;
    const g = ctx.createGain(); g.gain.value = gain;
    src.connect(g); g.connect(sfxGain); src.start();
  }
  function play(name, opts) {
    if (muted || !ensure()) return;
    resume();
    const o = opts || {};
    const vary = o.vary !== undefined ? o.vary : VARY.has(name);
    // ±2 semitones and ±10% level. Without this a six-unit turn is the same sample six times.
    const rate = (o.rate || 1) * (vary ? Math.pow(2, (Math.random() * 4 - 2) / 12) : 1);
    const gain = (o.gain || 1) * (vary ? 0.9 + Math.random() * 0.2 : 1);
    const takes = samples[name];
    if (takes && takes.length) return playSample(takes[(Math.random() * takes.length) | 0], rate, gain * (sampleGain[name] || 1));
    const voice = bank[name];
    if (!voice) { if (window.__DEV_AUDIO) console.warn('[sfx] no such cue:', name); return; }
    voice(rate, gain);
  }

  // ── music ─────────────────────────────────────────────────────────────────────────────────────
  // Five beds. A recorded bed replaces the drone for the same mode when one is present.
  //
  // A bed may also ship LAYERS: extra files that are the same music scored for different weight, e.g.
  // mus_battle.m4a (percussion and low strings) plus mus_battle_desperate.m4a (brass over the top).
  // They are not alternates to switch between -- every layer starts at the SAME instant as the base
  // and loops with it, silent until the game fades it up. That is what lets the score follow a fight
  // without ever restarting: crossfading two finished mixes collides two arrangements, layers sum.
  const MODES = {
    main:     { freqs: [110, 164.81, 220, 293.66], type: 'sine',     gain: 0.06, cut: 1200, trem: 0.09 },
    campaign: { freqs: [110, 146.83, 220, 329.63], type: 'sine',     gain: 0.05, cut: 950,  trem: 0.07 },
    battle:   { freqs: [55, 82.41, 110, 164.81],   type: 'sawtooth', gain: 0.05, cut: 480,  trem: 0.16 },
    boss:     { freqs: [55, 110, 138.59, 207.65],  type: 'sawtooth', gain: 0.08, cut: 720,  trem: 0.22 },
    safe:     { freqs: [130.81, 196, 261.63, 392], type: 'triangle', gain: 0.05, cut: 1700, trem: 0.05 },
  };
  let layerGains = {};   // layer name -> GainNode, for the bed playing right now
  let layerWant = {};    // layer name -> level the game last asked for; survives a bed change
  let bedPos = {};       // song key -> where in its loop it was when we left, so returning does not restart
  let musicVariant = 0;  // which song of the current mode is playing
  let lastVariant = {};  // mode -> the song we played last time, so we do not repeat it back to back

  // Equal-power crossfade. The old transition ramped the incoming bed exponentially from 0.0001, i.e.
  // from -80 dB, so it was still inaudible a second in while the outgoing bed had already dropped
  // 14 dB -- a hole in the middle of every transition. sin/cos curves keep total power flat instead.
  const XFADE = 1.4;
  const _curve = (rise) => {
    const n = 48, a = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = i / (n - 1);
      a[i] = Math.max(0.0001, rise ? Math.sin(x * Math.PI / 2) : Math.cos(x * Math.PI / 2));
    }
    return a;
  };
  const FADE_IN = _curve(true), FADE_OUT = _curve(false);

  function stopMusic() {
    if (!ctx) { musicVoices = []; return; }
    const t = ctx.currentTime;
    for (const v of musicVoices) {
      try { v.g.gain.cancelScheduledValues(t); v.g.gain.setTargetAtTime(0.0001, t, 0.5);
            v.o.stop(t + 1.8); if (v.lfo) v.lfo.stop(t + 1.8); } catch (e) {}
    }
    musicVoices = [];
    if (musicSample) {
      const ms = musicSample;
      // remember how far into the loop we were, so coming back does not restart the track at 0:00
      if (ms.loopLen > 0) bedPos[ms.key] = (ms.offset - ms.loopStart + Math.max(0, t - ms.startedAt)) % ms.loopLen;
      try {
        ms.bed.gain.cancelScheduledValues(t);
        ms.bed.gain.setValueCurveAtTime(FADE_OUT, t, XFADE);
      } catch (e) { try { ms.bed.gain.setTargetAtTime(0.0001, t, 0.4); } catch (e2) {} }
      for (const n of ms.nodes) { try { n.src.stop(t + XFADE + 0.08); } catch (e) {} }
      musicSample = null;
    }
    layerGains = {};
  }

  /** Fade one layer of the current bed. Silently does nothing if that layer was never delivered.
   *  `instant` cuts rather than ramps — the 0.8s time constant takes ~2.4s to arrive, which is right
   *  in play and useless for A/B, where you need to hear the layer appear. */
  function setLayer(name, level, instant) {
    const want = Math.max(0, Math.min(1, isFinite(level) ? level : 0));
    if (layerWant[name] === want && layerGains[name] && !instant) return;
    layerWant[name] = want;
    const g = layerGains[name];
    if (!g || !ctx) return;                      // no such layer in this bed — harmless
    const v = Math.max(0.0001, want);
    g.gain.cancelScheduledValues(ctx.currentTime);
    if (instant) g.gain.setValueAtTime(v, ctx.currentTime);
    else g.gain.setTargetAtTime(v, ctx.currentTime, 0.8);
  }
  /** Pick a song for this mode: random, but never the same one twice running when there is a choice. */
  function pickVariant(mode) {
    const n = ((musicMeta[mode] || {}).variants || []).length;
    if (n <= 1) return 0;
    let i = Math.floor(Math.random() * n);
    if (i === lastVariant[mode]) i = (i + 1 + Math.floor(Math.random() * (n - 1))) % n;
    lastVariant[mode] = i;
    return i;
  }

  function startRecordedBed(mode, vi, base, meta) {
    // ONE start instant shared by every layer. Starting them separately, or letting each ramp from
    // its own `currentTime`, drifts them apart and the layers phase against each other.
    const t0 = ctx.currentTime + 0.05;
    const key = mode + '#' + vi;
    const loopStart = (meta && meta.loopStart != null) ? meta.loopStart : 0;
    const loopEnd = (meta && meta.loopEnd) ? meta.loopEnd : base.duration;
    const loopLen = Math.max(0, loopEnd - loopStart);
    const offset = loopStart + (loopLen > 0 ? ((bedPos[key] || 0) % loopLen) : 0);
    // The whole bed rides one gain so the crossfade cannot fight the per-layer levels underneath it.
    const bed = ctx.createGain();
    bed.gain.setValueAtTime(0.0001, t0);
    try { bed.gain.setValueCurveAtTime(FADE_IN, t0, XFADE); }
    catch (e) { bed.gain.exponentialRampToValueAtTime(1, t0 + XFADE); }
    bed.connect(musicGain);
    const mk = (buf, from) => {
      const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      if (meta && meta.loopStart != null) { src.loopStart = meta.loopStart; src.loopEnd = meta.loopEnd || buf.duration; }
      const g = ctx.createGain(); g.gain.setValueAtTime(from, t0);
      src.connect(g); g.connect(bed); src.start(t0, Math.min(offset, buf.duration - 0.01));
      return { src, g };
    };
    const nodes = [mk(base, 1)];
    layerGains = {};
    for (const name of Object.keys((meta && meta.layers) || {})) {
      const buf = (samples['mus_' + mode + '#' + vi + '::' + name] || [])[0];
      if (!buf) continue;
      const n = mk(buf, 0.0001);
      layerGains[name] = n.g;
      nodes.push(n);
    }
    musicSample = { mode, key, bed, nodes, startedAt: t0, offset, loopStart, loopLen };
    // re-apply whatever the game had asked for before this bed started
    for (const [name, want] of Object.entries(layerWant)) {
      if (layerGains[name]) layerGains[name].gain.setTargetAtTime(Math.max(0.0001, want), t0, 0.8);
    }
  }

  function music(mode) {
    if (!ensure()) { musicMode = mode; return; }   // deferred until the first gesture unlocks audio
    resume();
    if (musicMode === mode) return;
    musicMode = mode;
    stopMusic();
    // A fresh visit to a mode picks a song. Re-entering the SAME mode returns early above, so a
    // battle keeps one song from start to finish rather than reshuffling on every render.
    musicVariant = pickVariant(mode);
    const v = ((musicMeta[mode] || {}).variants || [])[musicVariant];
    const rec = (samples['mus_' + mode + '#' + musicVariant] || [])[0];
    if (rec) { startRecordedBed(mode, musicVariant, rec, v); return; }
    const spec = MODES[mode]; if (!spec) return;
    musicFilter.frequency.setTargetAtTime(spec.cut, ctx.currentTime, 0.7);
    const t0 = ctx.currentTime;
    spec.freqs.forEach((f, i) => {
      const o = ctx.createOscillator(); o.type = spec.type; o.frequency.value = f;
      o.detune.value = (i % 2 ? 1 : -1) * (4 + i * 2);              // gentle chorus

function toggleUpdateCheck() { setUpdateOptOut(!updateOptedOut()); showSettings(); }
async function checkNow() {
  // Belt and braces alongside hiding the panel: this is the ONLY remaining path that can put a request
  // on the wire in a Steam build, and the store copy promises there isn't one.
  if (window.__WT_STEAM__) return;
  if (S.demo) { toast('the demo does not self-update — grab the full game for that'); return; }
  if (updateOptedOut()) { toast('auto-check is off — enable it first'); return; }
  toast('checking for updates…');
  const url = _isAndroid() ? UPDATE_URL_MOBILE : (_isMac() ? UPDATE_URL_MAC : UPDATE_URL_DESKTOP);
  try {
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 5000);
    const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store' }); clearTimeout(t);
    const d = await r.json();
    if (d && d.version && verNewer(d.version, APP_VERSION)) { closeOv('ovSettings'); showUpdateBanner(d); }
    else toast(`you're on the latest (v${APP_VERSION})`);
  } catch (e) { toast('update check failed — try again later'); }
}

// ── who may see the cheat panel ────────────────────────────────────────────────────────────────
// "Unlock everything" and "Instant-win this battle" exist for the art/audio review passes — they hand
// out every achievement, ascension, unlock and collection card in one tap. On the PAID STEAM build that
// is not a debug affordance, it is a cheat menu sitting in Settings that voids the entire progression
// the game is built around. It was gated on `S.demo` alone, so the demo was clean and the paid product
// shipped it. Gated on the same build flag the updater uses, which scripts/build-tauri.mjs already
// verifies survived into the bundle — so this cannot silently regress on a Steam cut either.
// Beta exe/APK still get the tools: those go to our own testers, and that is what they are for.
function _debugToolsAllowed() { return !S.demo && !window.__WT_STEAM__; }
async function debugUnlockAll() {
  if (!_debugToolsAllowed()) return;   // the panel is the only caller, but never leave a cheat callable
  const r = await api('/api/debug_unlock_all', {});
  render(r); toast('DEBUG — everything unlocked'); haptic(40);
}

// The label for the currently selected unit, so the promote button names its target rather than saying
// "the selected unit" and leaving you to remember which one that was.
function _cmdLabel() {
  const u = _cmdTarget();
  if (!u) return 'unit';
  const info = CLASS_INFO[u.cls] || { n: u.cls };
  return `${u.name || info.n}${u.lvl > 1 ? ` (rank ${u.lvl})` : ''}`;
}
// DEBUG: rank the selected unit up one step. It goes through the same promotion path a kill takes, so
// the gain persists into the roster exactly as an earned rank does — which is what makes it permanent
// rather than a stat edit that evaporates at the end of the battle.
async function debugPromote() {
  const u = _cmdTarget();
  if (!_debugToolsAllowed() || !u) return;
  const r = await api('/api/debug_promote', { unit_id: u.id });
  if (r.ok === false) { toast(r.msg); Sfx.play('ui_error'); return; }
  closeOv('ovSettings');
  Sfx.play('acquire'); haptic(40);
  await afterAction(r);            // the promote event animates like any other
}
// ── DEBUG: run forecast ─────────────────────────────────────────────────────────────────────────
// The whole run laid out — which boss waits at the top of each act, which elite variant sits on which
// node, and where you are now. Every row jumps you straight there; each act can also be skipped outright.
const _NODE_ICON = { skirmish: '⚔', elite: '☠', boss: '👑', event: '❓', shop: '🛒', camp: '⛺', cache: '📦' };
async function showRunForecast() {
  if (!_debugToolsAllowed()) return;
  const r = await api('/api/debug_forecast', {});
  if (!r || !r.ok) { toast(r && r.msg ? r.msg : 'no run in progress'); return; }
  const f = r.forecast;
  const acts = f.acts.map(a => {
    const rows = {};
    for (const n of a.nodes) (rows[n.row] ??= []).push(n);
    const grid = Object.keys(rows).sort((x, y) => y - x).map(rk => {
      const cells = rows[rk].map(n => {
        const mark = n.here ? 'dbg-here' : n.visited ? 'dbg-done' : '';
        const icon = n.spire ? '🌳' : (_NODE_ICON[n.kind] || '·');
        const label = n.variant_name ? `${icon} ${n.variant_name}` : (_NODE_ICON[n.kind] || n.kind);
        return `<button class="dbgnode ${mark}${n.spire ? ' dbg-spire' : ''}" onclick="debugGoto(${a.act},'${n.id}')" title="${n.id} — ${n.kind}${n.variant_name ? ' — ' + n.variant_name : ''}">${label}</button>`;
      }).join('');
      return `<div class="dbgrow"><span class="dbgrk">${rk}</span>${cells}</div>`;
    }).join('');
    const b = a.boss;
    return `<div class="choice" style="margin-top:8px">
      <b class="${a.current ? 'gold' : ''}">Act ${a.act + 1} — ${a.title}${a.current ? ' (here)' : ''}</b>
      ${b ? `<div class="d" style="margin:3px 0 6px;line-height:1.45"><b style="color:${a.spire ? '#8fd98f' : '#ff8a6a'}">${a.spire ? '🌳' : '👑'} ${b.name}</b> · ${b.mech} · ${b.bias}${b.perk_name ? ` · <b class="gold">${b.perk_name}</b>` : ''}${a.spire ? ' <b class="gold">— replaces the act boss on this seed</b>' : ''}</div>` : ''}
      ${grid}
      <button class="setbtn dbg" style="margin-top:6px" onclick="debugCompleteAct()">Complete Act ${a.act + 1} ▸</button>
    </div>`;
  }).join('');
  $('#ovInspect').innerHTML = oframe(`<div class="d" style="margin-bottom:6px">Seed <b>${f.seed}</b> — elite variants on branches you haven't taken are a forecast: a different route can spend a once-per-run variant elsewhere.</div>${acts}`, 'settings');
  $('#ovInspect').classList.add('show');
}

function render(state) {
  if (state.state) state = state.state;   // unwrap play/end responses
  animGen++;                              // invalidate any in-flight replay
  S = state;

  if (S.new_achievements && S.new_achievements.length) {   // 🏆 earned this action
    S.new_achievements.forEach(a => _achQueue.push(a));
    _runAchQueue();
    const newAch = S.new_achievements.map(a => a.id);
    _checkFogUnlocks(newAch);      // a gating achievement may have unlocked a fog style
    _checkMarkerUnlocks(newAch);   // …or a battle move/target marker style
  }
  if (S.new_unlocks && S.new_unlocks.length) {   // general Merit/Ascension rewards
    S.new_unlocks.forEach(u => _achQueue.push({ _unlock: true, kind: u.kind, name: u.name, flavor: u.desc }));
    _runAchQueue();
    const u0 = S.new_unlocks[0];   // teach the progression-unlock system on the very first one; rest stay quick toasts
    queueUnlock({ kindLabel: u0.kind === 'medal' ? 'Permanent Unlock — Relic' : 'Permanent Unlock — Card', name: u0.name,
      seenKey: 'dc_ulk_progression',
      hint: 'You earned permanent content for this commander. Merit — your lifetime score — and Ascensions unlock more; track it all on the Generals screen.' });
  }
  _checkPlaqueUnlocks();   // a cleared Ascension may have raised a commander's plaque tier
  _checkAscUnlocks();      // …and may have opened a new Ascension difficulty tier
  const mode = S.mode || (S.started ? 'battle' : 'picker');
  if (mode !== 'battle') {
    // leaving a fight → tear down all battle-only + transient UI so nothing floats on the map/menu
    ['unitinfo', 'prompt'].forEach(id => { const el = $('#' + id); if (el) el.innerHTML = ''; });
    if (_inBattlePrev) { const t = $('#toast'); if (t) { clearTimeout(t._h); t.classList.remove('show'); } }   // kill any leftover battle toast — but only ON exit, so map toasts still show
    cmd = null; sel = null; legal = null; _prevCpHold = null; aimModes.clear();   // next battle opens in Move too
  }
  if (!S.result) _resultCue = null;      // a cleared result re-arms the stinger for the next one
  const wasInBattle = _inBattlePrev;      // captured BEFORE the flag is updated, for the entry cue below
  _inBattlePrev = (mode === 'battle');
  // leaving the picker → tear down the run-setup overlays so the map/battle isn't hidden behind them
  // (START RUN from the Deploy popup used to leave #ovDeploy open, covering the map).
  if (mode !== 'picker') { closeOv('ovGeneral'); closeOv('ovDeploy'); }
  if (mode === 'picker') { Sfx.music('main'); setScreen(false); $('#app').style.display='flex'; showGenerals(); warmAssets(); return; }
  if (mode === 'map') {
    // Decided HERE and nowhere else. A shop or a camp is a breather, and so is the run-end summary.
    const pk = S.pending && S.pending.kind;
    Sfx.music((pk === 'shop' || pk === 'camp' || S.result) ? 'safe' : 'campaign');
    setScreen(true); renderMapScreen(); coach('map'); _playCardFx(); return;
  }

  if (!wasInBattle) Sfx.play('card_shuffle');
  setScreen(false);
  $('#ovGeneral').classList.remove('show');
  if (!S.board) return;
  // fresh-battle signature (seed+level+dims) — more reliable than width alone (two same-width battles
  // in a row would otherwise skip the refit/recentre and inherit the previous battle's zoom + scroll)
  const bsig = S.seed + ':' + (S.level ? S.level.index : '?') + ':' + S.board.width + 'x' + S.board.height;
  const freshBattle = bsig !== _lastBattleSig;

    _lastBattleSig = bsig;

    fitCell();

  }
  // control-point feedback: holding a battlefield ◆ point grants +1 max CP — call it out when it flips.
  // Skip it entirely once the battle is decided (S.result) — you don't need a "point dropped" toast as the fight ends.
  if (S.cp_total > 0 && S.cp_hold != null && !S.result) {

    // before renderHud(), which is what writes --pillh and therefore decides the top bar's height. So
    // that first fit measures a #boardwrap roughly a bar too tall and picks a cell the grid does not
    // actually fit into: measured 43px where 40px was needed, leaving the bottom row of the
    // battlefield behind the hand with nothing to correct it, since the board only refits on resize.
    // One frame later the bar and hand are laid out and the measurement is real.
    // refitBoard(), not fitCell(): it recomputes the floor from the settled layout but keeps the
    // current zoom as a RATIO of it. On a fresh battle that ratio is 1, so the result is identical —
    // except it cannot stomp a zoom that arrived first, which fitCell() here did (it resets to the
    // floor unconditionally, and the resize test caught it turning a deliberate 2x back into 1x).
    const settle = () => { refitBoard(); centerOnHQ(); };
    if (window.requestAnimationFrame) requestAnimationFrame(settle); else settle();

  if (dangerOn || intentOn) refreshDanger();   // keep whichever danger layers are on current
  if (S.result && !_deferResult) showBattleResult();   // held until enemy anim finishes
  else if (S.pending_workshop) showWorkshop();   // boss maps carry Workshops
  else {
    ['ovResult','ovUpgrade'].forEach(closeOv); maybeShowIntro();
    // The boss briefing is its own overlay, so this queues behind it rather than fighting it.
    if (S.boss) coach('boss'); else coach('battle');
  }
  if (S.power && S.power.ready) coach('power');   // teach the Command Power when it first charges
}

// is also what stops the map sprawling, since the two share the row. Pure CSS can't do this: the scale
// has to come from a measurement, so it is written to --legzoom and the CSS media queries consume it.
function fitLegend() {
  const leg = document.getElementById('maplegend');
  const row = document.getElementById('maprow');
  if (!leg || !row || _isPortrait()) { document.documentElement.style.removeProperty('--legzoom'); return; }

  const natural = leg.offsetHeight;                       // layout height at zoom 1
  if (!natural || !row.clientHeight) { document.documentElement.style.removeProperty('--legzoom'); return; }
  const z = Math.max(1, Math.min(3.2, (row.clientHeight - 24) / natural));

}

// Keep the whole map bar on ONE row. 66px is the target, but the row carries up to twelve items and the
// widest case — four-digit salvage plus the compass plus an ascension tag — needs about 1987px against
// the 1878 a 1920 screen actually gives it. Rather than pick a height that is too small for the common
// case or let the buttons wrap in the rare one, measure and step down only when it is needed. Same
// approach setPillH() uses for the battle bar and fitLegend() for the legend.
function fitMapBar() {
  const hud = document.getElementById('maphud');
  const row = hud && hud.querySelector('.maprow');
  if (!row || !row.clientWidth || row.children.length < 2) return;
  hud.style.removeProperty('--pillh');                 // back to the stylesheet's target for this width
  // Plate widths come from their IMAGES. Measuring before those load reports a bar far narrower than it
  // will end up, so the fit concludes everything fits and never steps down. Re-run once they are in.
  for (const im of row.querySelectorAll('img')) {
    if (!im.complete) {
      im.addEventListener('load', fitMapBar, { once: true });
      im.addEventListener('error', fitMapBar, { once: true });   // a broken plate must not stall the fit
      return;
    }
  }
  // Ask the layout whether it wrapped rather than re-deriving it from widths + gaps. Summing
  // getBoundingClientRect().width and adding an assumed gap disagreed with the real columnGap by
  // enough to read an overflowing bar as fitting.
  // Flatten .mapbtns: it is itself a flex container, so How to Play / Menu can drop to a second line
  // while .mapbtns' own top stays put. Comparing only .maprow's direct children misses that entirely.
  const pills = () => [...row.children].flatMap(k => k.children.length && k.classList.contains('mapbtns')
                                                     ? [...k.children] : [k]);
  const rowCount = () => new Set(pills().map(k => Math.round(k.getBoundingClientRect().top / 12))).size;
  // Desktop packs the bar onto ONE line. A phone screen cannot hold 12 plates on one line at any
  // legible size, so chasing a single row there just drove every pill to the 32px floor and still
  // wrapped. Phones get a two-row budget instead.
  const maxRows = (window.matchMedia && window.matchMedia('(pointer: fine)').matches) ? 1 : 2;
  let h = parseFloat(getComputedStyle(hud).getPropertyValue('--pillh')) || 34;
  // Floor is 24 on DESKTOP, 32 on touch. Measured on a windowed Mac: at 1000px the row needs 28px to
  // make one line and at 900px it needs 24 — so a 32px floor could not reach one row at either, the
  // bail-out below then restored the stylesheet's 44px, and the bar wrapped to two FULL-HEIGHT rows.
  // Snapping back to the largest size precisely when nothing fits is backwards; 24px on one line beats
  // 44px on two. Touch keeps 32: a phone already budgets two rows, its plates are thumb targets, and
  // nothing in the report was about phones.
  const floor = maxRows === 1 ? 24 : 32;
  for (let i = 0; i < 24 && rowCount() > maxRows; i++) {
    h = Math.max(floor, h - 2);
    hud.style.setProperty('--pillh', h + 'px');
    if (h <= floor) break;                             // below this it wraps rather than shrink further
  }
  // Only pay for the shrink if it actually bought the row. A narrow phone at max salvage + ascension
  // + compass cannot reach the budget at any size; without this it bottomed out at the floor and
  // stayed on the same number of rows -- smaller plates for nothing.
  if (rowCount() > maxRows) hud.style.removeProperty('--pillh');
  // Plate text is measured with whatever font is active RIGHT NOW. Fitting against fallback metrics
  // and never re-checking left the bar shrunk to a size the real font did not need.
  try {
    if (document.fonts && document.fonts.status !== 'loaded' && !window._mapBarFontHook) {
      window._mapBarFontHook = 1;
      document.fonts.ready.then(() => { window._mapBarFontHook = 0; fitMapBar(); });
    }
  } catch (e) {}
}

function renderMapGraph() {
  const rows = S.rows, W = S.width || 4;
  const rowGap = 92, padY = 34;
  // spread columns to fill the width; landscape uses W+1 equal gaps so the edge margin
  // matches the inter-column gap (padX = colGap). Portrait stays compact.
  const scW = ($('#mapscroll') ? $('#mapscroll').clientWidth : 0) || window.innerWidth || 360;
  let colGap, padX;
  if (scW > 720) { colGap = Math.min(240, (scW - 8) / (W + 1)); padX = colGap; }
  else { colGap = Math.max(78, Math.min(240, (scW - 100) / Math.max(1, W - 1))); padX = 42; }
  const innerW = padX*2 + (W-1)*colGap, innerH = padY*2 + (rows-1)*rowGap;
  const el = $('#mapinner');
  el.style.width = innerW+'px'; el.style.height = innerH+'px';
  const byId = {}; S.nodes.forEach(n=>byId[n.id]=n);
  const pos = n => ({x: padX + n.col*colGap, y: innerH - padY - n.row*rowGap});  // row 0 at bottom
  let html = '';
  S.nodes.forEach(n=>{
    const a = pos(n);
    n.edges.forEach(eid=>{
      const m = byId[eid]; if(!m) return;
      const b = pos(m), dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy), ang=Math.atan2(dy,dx)*180/Math.PI;
      const open = (n.id===S.pos && m.avail);
      html += `<div class="medge ${open?'open':''}" style="left:${a.x}px;top:${a.y}px;width:${len}px;transform:rotate(${ang}deg)"></div>`;
    });
  });
  S.nodes.forEach(n=>{
    const p = pos(n);
    let cls = 'mnode';
    if (n.kind==='boss') cls+=' boss';
    if (n.id===S.pos) cls+=' here';
    else if (n.done) cls+=' done';
    else if (n.avail) cls+=' avail';
    if (n.jump) cls+=' jump';                 // Field Compass parallel-path target

function _updateMusicLayers() {

function playForgeFx(cards){
  // takes a LIST — one event choice can upgrade two cards ("Perfect two cards"), and showing only the
  // last of them was the reported bug
  const list = Array.isArray(cards) ? cards : [cards];
  list.forEach((_, i) => Sfx.play('card_upgrade', { rate: 1 + i * 0.06 })); haptic([30,40,30,40,70]);
  const sparks = Array.from({length:24},(_,i)=>{
    const a = (i/24)*6.283 + Math.random()*0.6, dist = 70+Math.random()*100;
    const delay = (0.05 + (i%3)*0.15 + Math.random()*0.1).toFixed(2);
    return `<span class="spark" style="--dx:${(Math.cos(a)*dist)|0}px;--dy:${(Math.sin(a)*dist)|0}px;animation-delay:${delay}s"></span>`;
  }).join('');
  const one = c => {
    // Draw the actual UPGRADED card face, the same way the collection does — cardDetailHTML renders a
    // text panel (name, cost, keywords, targets), which is a description of the card rather than the
    // card. You just earned the upgrade; you should see the thing you earned.
    const view = Object.assign({}, c, { upgraded: true,
      name: /\+$/.test(c.name) ? c.name : c.name + '+',
      cost: c.up_cost != null ? c.up_cost : c.cost,
      text: c.up_text || c.text });
    // No ✦ UPGRADED ✦ bar: the card now shows its own upgraded name and text, so the badge was
    // labelling something the art already says.
    const up = c.up_desc?`<div class="d" style="margin-top:8px;color:#f0c94a;text-align:center"><b>⤴ ${c.up_desc}</b></div>`:'';
    return `<div class="forgecard">${frameCardHTML(view, 210)}${up}</div>`;
  };
  $('#ovForge').innerHTML = `<div class="forgewrap">
      <div class="forgeglow"></div>
      <div class="forgehammer">${si('forge',44)}</div>
      <div class="forgecards">${list.map(one).join('')}</div>
      <div class="sparks">${sparks}</div>
      <div style="margin-top:12px;text-align:center">${ibtn('continue', "closeOv('ovForge')")}</div>
    </div>`;
  $('#ovForge').classList.add('show');
  // Deliberately NOT auto-closed. It used to dismiss itself after 2.8s, which is long enough to see
  // that SOMETHING happened and far too short to read which card changed or what it became.
  clearTimeout(_forgeT);
}

// ── board + table layout (shared by renderBoard AND live pinch-zoom so the table always scales with
// the grid — pieces printed on the table). Sizes #board padding + the table background from cellPx. ──
function layoutBoard() {
  const b = S && S.board; if (!b) return;
  const board = $('#board'), wrap = $('#boardwrap'); if (!board || !wrap) return;
  // Everything this function writes (grid size, --cell, #board padding, the wood-table background size
  // + position) is a pure function of the grid dims, the zoom (cellPx/minCellPx) and the viewport. NONE
  // of those change when a unit merely moves — so on a large, fully-revealed map, re-setting the giant
  // table backgroundSize/Position every single action forced a full background re-rasterize each move,
  // which is what glitched the screen. Skip the DOM writes entirely when the inputs are unchanged.
  const sig = b.width + 'x' + b.height + '@' + cellPx + '/' + minCellPx + ':' + wrap.clientWidth + 'x' + wrap.clientHeight;
  if (layoutBoard._sig === sig) return;
  layoutBoard._sig = sig;
  // Past this line the grid really is being rewritten, so the camera's cached measurements are stale.
  // This signature is built from every input that can change the board's size (grid dims, cellPx,
  // minCellPx, and the wrap's own box), which makes it exactly the right trigger — anything that would
  // move those numbers has already been folded into it above.
  camInvalidate();
  // Rows are declared EXPLICITLY, not left implicit. `.cell` uses `content-visibility: auto`, so an
  // off-screen cell is culled and contributes its `contain-intrinsic-size` placeholder rather than its
  // real box. With implicit rows the grid's height is derived from that content, and WebKit sizes the
  // culled rows short — so #boardwrap under-reported its scrollable height and you could not pan to the
  // bottom of the board. Measured on macOS at cell 99: #board was 1752px tall while the wrap claimed
  // 1213px of content, leaving 539px of the required 1078px reachable — panning hit a wall halfway with
  // the anchor and the zoom both working correctly. Chrome sizes the culled rows correctly, which is why
  // it never showed there. Definite rows make the height h x --cell regardless of what is culled.
  board.style.gridTemplateColumns = `repeat(${b.width}, var(--cell))`;
  board.style.gridTemplateRows = `repeat(${b.height}, var(--cell))`;
  document.documentElement.style.setProperty('--cell', cellPx + 'px');
  // pad #board so the wood fills the viewport at min zoom (table edge = screen edge) and grows past it
  // when zoomed in (pan). At min zoom the grid fits (fitCell), so padding centres it and fills the edges.
  const gridW = b.width * cellPx, gridH = b.height * cellPx;   // grid gap is 0 → this is the exact rectangle
  const m = Math.round(cellPx * 1.2);
  const cw = wrap.clientWidth, ch = wrap.clientHeight;
  const availH = ch - HAND_CLEAR;   // board area above the hand fan
  // ── table locked to the pieces (PURE lockstep) ──────────────────────────────────────────────
  // The table is STRICTLY proportional to the grid: table = (min-zoom cover) × (cellPx / minCellPx).
  // Both the grid (cols·cellPx) and the table are linear in cellPx, so their ratio is constant at every
  // zoom — the wood and the pieces magnify at the exact same rate, as if the pieces sit ON the table.
  const zoomF = cellPx / (minCellPx || cellPx);
  const tblAR = 1200 / 900;   // table image is horizontal (w/h) in BOTH orientations — a wide table covers the portrait viewport edge-to-edge
  const covW = cw, covH = ch + HAND_CLEAR;   // min-zoom table covers the viewport (a hand taller so no gap by the cards)
  let vW, vH;
  if (covW / covH > tblAR) { vW = covW; vH = covW / tblAR; } else { vH = covH; vW = covH * tblAR; }
  // Table = the lockstep viewport-cover, but NEVER smaller than the grid plus a full wood border. A tall
  // map (grid nearly as tall as the viewport) used to leave only HAND_CLEAR/2 of wood, which the padding
  // math then spent entirely on hand-clearance — padTop fell to 0 and the grid's top row sat flush on the
  // table edge, so scrolling up broke the board free of the wood. Forcing tblH ≥ gridH + 2·m + HAND_CLEAR
  // (and tblW ≥ gridW + 2·m) guarantees woodY ≥ m + HAND_CLEAR/2, so there's always an m-wide wood frame
  // on every side and the box can never exceed the table.
  const tblW = Math.max(vW * zoomF, gridW + 2 * m);
  const tblH = Math.max(vH * zoomF, gridH + 2 * m + HAND_CLEAR);
  // #board padding: centre the grid on the table (so it sits in the wood with an even border), and CAP
  // the pan margin to that wood border so you can never scroll past the table edge — no dark surround,
  // without inflating the table (which would break lockstep). Bias the grid up by the hand's height so
  // it clears the cards at min zoom.
  const woodX = Math.max(0, (tblW - gridW) / 2);            // wood border on each side of the grid
  const woodY = Math.max(0, (tblH - gridH) / 2);
  const padX = gridW >= cw ? Math.min(m, woodX) : Math.round((cw - gridW) / 2);
  let padTop, padBot;
  if (gridH >= availH) { padTop = Math.min(m, Math.max(0, woodY - HAND_CLEAR / 2)); padBot = Math.min(m + HAND_CLEAR, woodY + HAND_CLEAR / 2); }
  else { padTop = Math.round((availH - gridH) / 2); padBot = Math.max(HAND_CLEAR, ch - gridH - padTop); }
  board.style.padding = padTop + 'px ' + padX + 'px ' + padBot + 'px';
  // Centre the table on the GRID, not on the #board box.
  //
  // The box is deliberately asymmetric: padTop and padBot differ so the grid is biased upward and
  // clears the hand. Centring the wood on the box therefore parked the pieces off-centre on the table
  // by (padBot - padTop)/2 — and that gap is a function of the zoom, so the wood visibly slid around
  // underneath the board while pinching. "The pieces sit ON the table" only holds if the two are
  // concentric at every zoom, which is what this does.
  //
  // It never showed before because the fit used to be COVER: the grid always overran the viewport, so
  // the symmetric `gridH >= availH` branch was the only one that ran. A CONTAIN fit makes the other
  // branch reachable at floor zoom, which is what exposed it.
  //
  // The table is then grown to still cover the whole box from its new centre, so no pannable position
  // can show dark surround — the property the old box-centred version was there to guarantee.
  const cx = padX + gridW / 2, cy = padTop + gridH / 2;         // grid centre inside the box
  const tW = Math.max(tblW, gridW + 2 * padX);                  // padX is equal on both sides
  const tH = Math.max(tblH, gridH + 2 * Math.max(padTop, padBot));
  board.style.backgroundSize = tW.toFixed(1) + 'px ' + tH.toFixed(1) + 'px';
  board.style.backgroundPosition = (cx - tW / 2).toFixed(1) + 'px ' + (cy - tH / 2).toFixed(1) + 'px';
  if (typeof applyCam === 'function') applyCam();   // the box just changed size → re-clamp and re-apply
}

function renderBoard() {
  const b = S.board, board = $('#board'), wrap = $('#boardwrap');
  applyChips();

  layoutBoard();                                     // size the grid + table (shared with pinch-zoom)
  const nodeMap = new Map((S.nodes || []).map(n => [n.pos[0] + ',' + n.pos[1], n]));
  // fog of war: the WHOLE grid is fogged (so the map shape is hidden until revealed) — every
  // unrevealed play cell AND every off-map/void cell renders solid fog fill, EXCEPT the outer
  // 1-tile ring of the grid which stays empty (shows the table) and lets the fog feather into it.
  // Revealed play cells clear; fog edge pieces (varying) spill onto any non-fog cell that borders fog.
  const cellAt = new Map(b.cells.map(c => [c.x + ',' + c.y, c]));
  // stable per-cell hash (never flickers between renders); mod picks a fill tile / edge variant
  // Full avalanche so the LOW bits are well-mixed: `% n` reads the low bits, and without this final
  // mix a power-of-2 n (e.g. billow's 4) exposes the hash's spatial correlation and the sections stage
  // into repeating columns/rows instead of randomizing.
  const fogHash = (x, y) => { let h = (Math.imul(x, 374761393) ^ Math.imul(y, 668265263)) >>> 0; h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0; h ^= h >>> 16; h = Math.imul(h, 2246822507) >>> 0; h ^= h >>> 13; return h >>> 0; };
  const FCNT = fogCount();                       // whole-image tiles in the active fog set (varies per set)
  const fogVar = (x, y) => fogHash(x, y) % FCNT;   // randomly assign one whole tile per cell
  const isFog = (x, y) => { const c = cellAt.get(x + ',' + y); return !!c && (c.t == null || c.t === 'void'); };   // fogged = every unrevealed play cell OR off-map void (whole board is fogged)
  const OFF = (x, y) => !cellAt.get(x + ',' + y);       // off-grid (no cell at all)
  const FSUF = fogSuffix();
  const FWIN = fogWin();
  const fp = (name, deg) => `<img class="fp" src="assets/ui/fogedge${FSUF}/${name}.png"${deg ? ` style="transform:rotate(${deg}deg)"` : ''} alt="">`;
  // macro-windowing: each 4×4 section picks one of the set's sheets; a cell shows its window into it.
  const blkSheet = (x, y) => `assets/ui/fog${FSUF}/sheet${fogHash(Math.floor(x / 4), Math.floor(y / 4)) % FCNT}.jpg`;
  const winPos = (x, y) => { const wx = ((x % 4) + 4) % 4, wy = ((y % 4) + 4) % 4; return (wx / 3 * 100).toFixed(2) + '% ' + (wy / 3 * 100).toFixed(2) + '%'; };
  // feathered edge: for windowed sets it's RUNTIME-BAKED and CONTEXT-AWARE. The fog field is a pure
  // function of position — every fogged cell shows blkSheet(x,y) windowed at winPos(x,y) — so the ONE
  // correct texture for the feather on cell c is c's OWN would-be fog: blkSheet(c)@winPos(c). Pulling the
  // neighbour's sheet (src) instead shows a DIFFERENT part of the set whenever c and the neighbour fall in
  // different 4×4 sections, breaking continuity; using c's own sheet makes the spill match the surrounding
  // fog exactly (and the seam at a section boundary is the same seam the fog field already has there). The
  // mask is PRE-ROTATED (deg) so only the feather shape turns; the texture stays world-aligned. src is now
  // vestigial for windowed sets (kept for the non-win PNG signature).
  const edge = (c, shape, deg, src) => {
    if (!FWIN) return fp(shape, deg);
    return `<div class="fpw" style="background-image:url(${blkSheet(c.x, c.y)});background-position:${winPos(c.x, c.y)};-webkit-mask-image:url(assets/ui/fogmask/${shape}_${deg}.png);mask-image:url(assets/ui/fogmask/${shape}_${deg}.png)"></div>`;
  };
  const nb = (c, d) => ({ x: c.x + (d === 'E' ? 1 : d === 'W' ? -1 : 0), y: c.y + (d === 'S' ? 1 : d === 'N' ? -1 : 0) });
  const EDG = { N: 270, E: 0, S: 90, W: 180 };          // edge asset opaque=RIGHT → rotate opaque toward this side
  const COR = { NE: 0, SE: 90, SW: 180, NW: 270 };      // corner asset fog=TR (wisp toward this diagonal)
  const SIDE2 = { NE: 0, SE: 90, SW: 180, NW: 270 };    // side2 asset fog=N+E (fog on this corner's two sides)
  const SIDE3 = { S: 0, W: 90, N: 180, E: 270 };        // side3 asset open=S (open toward the clear side)

  // this card, and the gesture was stranded: #hand kept its `lifting`/`dragging` classes and the card
  // kept its inline transform, which is the stuck, glitched hand.

async function tapCell(x, y) {
  const cell = S.board.cells.find(c => c.x===x && c.y===y);
  if (!cell || cell.t === 'void') return;   // off-battlefield void is inert
  // (0) a POWER is armed → fire it on the chosen own-unit, else cancel
  if (powerArm) {
    if (cell.u && legal && legal.set.has(cell.u.id)) { await firePower(cell.u.id); return; }

  // (1) a CARD is selected → card targeting
  if (sel !== null) {
    if (!legal) return;
    const card = S.hand[sel];
    const step = card.needs[picked.length];
    let val = null;
    if (step === 'tile') { if (!legal.set.has(x+','+y)) return; val = [x, y]; }
    else { if (!cell.u || !legal.set.has(cell.u.id)) return; val = cell.u.id; }

    if (hasAim && isAiming()) {   // deviating ordnance in aim mode — tap any highlighted tile to fire
      if (cmdOpts.aim.has(x+','+y) && !isMine(cell.u)) { await doAim(x, y); return; }
      if (isMine(cell.u)) { await selectUnit(cell.u.id); return; }
      deselectCmd(); renderBoard(); renderPrompt();
      return;
    }
    if (cmdOpts.moves.has(x+','+y)) { await doMove(x, y); return; }
    if (cell.u && cmdOpts.attacks.has(cell.u.id)) { await doAttack(cell.u.id); return; }
    if (isMine(cell.u)) { await selectUnit(cell.u.id); return; }   // tap another own unit → switch
    deselectCmd(); renderBoard(); renderPrompt();
    return;
  }

  if (isMine(cell.u)) { await selectUnit(cell.u.id); return; }

  // precedence here. The objective goes first: it is the thing the whole battle is being scored on.

  // on screen at the same time as the thing — it centres over the panel rather than covering it.

// _endBusy, not just turnBusy: turnBusy is not raised until afterAction() runs, i.e. AFTER the confirm
// prompt and after /api/end has already resolved. A second tap inside that window ended the turn twice.
let _endBusy = false;
async function endTurn() {
  if (turnBusy || _endBusy) return;         // enemy is still acting, or this end is already in flight
  _endBusy = true;
  try {
    _dropCmd();                               // clear any live unit selection
    const idle = idleUnits();
    if (idle.length) {                        // units can STILL move/act → stop, highlight them, require a clear yes
      idleWarn = new Set(idle.map(c => c.u.id));
      $('#end').classList.add('armed');
      renderBoard();                          // light up the units that still have actions behind the prompt
      const n = idle.length;
      const ok = await gameConfirm(`<b>${n}</b> of your unit${n > 1 ? 's' : ''} can still move or act this turn. End the turn anyway?`, 'End turn');
      if (!ok) { disarmEnd(); return; }       // "keep playing" → drop the highlight, don't end
    }
    // Teach the keep-a-card ★ once, on an actual end — and WAIT for it to be read before ending, because
    // the end discards the hand this tip is about. Fired and forgotten it landed as the cards were being
    // swept away and the enemy replay started under it: advice about a chance the player had just lost.
    await coachWait('retain');
    disarmEnd();
    cancelSelState();
    aimModes.clear();                         // next turn every gun opens in Move again
    toast('enemy moving… tap to skip');
    Sfx.play('turn_enemy');
    const r = await api('/api/end', {retain: [...retain]});
    retain.clear();
    // no end-of-turn recap card — you watch the enemy act live, and the win/defeat
    // overlay is held until those blows finish.
    await afterAction(r);
    coach('endturn');            // after the enemy has actually played, so the tip describes what happened
  } catch (e) {
    // An unhandled throw here is invisible: endTurn() is an onclick handler, so the rejection is
    // swallowed and the game just sits there on the enemy turn. Surface it and resync instead.
    console.error('[end turn] failed', e);
    turnBusy = false; _deferResult = false; enemySkipOff();
    toast('end turn failed — resyncing');
    refresh();
  } finally {
    _endBusy = false;
  }
}

function enemyRecap(events) {
  const ev = events || [];
  const n = (c, s, p) => c ? [`${s}<b>${c}</b>${p||''}`] : [];
  const deploys = ev.filter(e => e.t==='spawn' && e.side==='enemy').length;
  const moves   = ev.filter(e => e.t==='move'  && e.side==='enemy').length;
  const hits    = ev.filter(e => e.t==='hit'   && e.tgt_you);
  const dmg     = hits.reduce((a,e)=>a+(e.dmg||0), 0);
  const kills   = hits.filter(e => e.dead).length;
  const caps    = ev.filter(e => e.t==='capture' && e.side==='enemy').length;
  return [].concat(
    n(deploys, 'Deployed ', deploys>1?' reinforcements':' reinforcement'),
    n(moves,   'Maneuvered ', moves>1?' times':' time'),
    dmg   ? [`Dealt <b class="red">${dmg}</b> damage to your forces`] : [],
    kills ? [`Destroyed <b class="red">${kills}</b> of your unit${kills>1?'s':''}`] : [],
    caps  ? [`Captured <b class="red">${caps}</b> outpost${caps>1?'s':''}`] : [],
  );
}

function openOv(id) { const e = $('#' + id); if (e && !e.classList.contains('show')) Sfx.play('ui_open'); if (e) { e.classList.add('show'); _liftOv(e); } }
function closeOv(id) { const e = $('#' + id); if (e && e.classList.contains('show')) Sfx.play('ui_close'); if (e) e.classList.remove('show'); }
// Overlay stacking. Every .overlay shares `z-index: 10`, so which one wins was decided purely by
// DOCUMENT ORDER — and #ovSettings is declared before #ovProg. Opening Settings from the Generals
// page therefore drew it BEHIND Generals, which reads as the button doing nothing. The one opened
// LAST is the one the player asked for, so it belongs on top.
//
// This watches the class attribute rather than living inside openOv(), because most overlays are put
// up by a bare `classList.add('show')` at twenty-odd call sites — Settings among them — so lifting
// inside openOv() would fix only the few that route through it.
let _ovZ = 10;
// Put `el` on top of every other open overlay. Idempotent when it is already the highest.
function _liftOv(el) {
  if (!el || !el.classList || !el.classList.contains('overlay')) return;
  const others = [...document.querySelectorAll('.overlay.show')].filter(o => o !== el);
  // Wind the counter back whenever nothing else is stacked, so it cannot climb over a long session
  // into #coachveil's z-index (44). Closing cannot be relied on to reset it: several overlays close
  // via an inline classList.remove('show') that never reaches closeOv().
  if (!others.length) _ovZ = 10;
  else if (others.every(o => (+o.style.zIndex || 10) < (+el.style.zIndex || 10))) return;   // already top
  // …and CAP it as well as winding it back. The wind-back only fires when the stack fully empties, so
  // a session that always keeps one overlay up can still climb — 34 nested opens would reach 44 and
  // start covering #coachveil, and 30 would reach #setBtn (40). Capped, the worst case degrades to two
  // overlays tying and document order deciding, which is where this started rather than something worse.
  _ovZ = Math.min(_ovZ + 1, 39);
  el.style.zIndex = String(_ovZ);
  el.dataset.ovlift = '1';
}
(function () {
  if (typeof MutationObserver !== 'function') return;
  const obs = new MutationObserver(ms => {
    for (const m of ms) {
      const el = m.target;
      if (!el.classList || !el.classList.contains('overlay')) continue;
      if (el.classList.contains('show')) _liftOv(el);
      else if (el.dataset.ovlift === '1') {
        el.style.removeProperty('z-index');
        delete el.dataset.ovlift;
      }
    }
  });
  const start = () => document.querySelectorAll('.overlay')
    .forEach(o => obs.observe(o, { attributes: true, attributeFilter: ['class'] }));
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

// This is the zoom-OUT floor (minCellPx): you can't pinch out past the rectangle, only a hair of
// table shows around it. Big battle maps (up to ~36x26) therefore scale DOWN to fit a phone; there
// is no fixed minimum cell size (the old Math.max(16,..) clamp was why large maps overflowed).
// The zoom-OUT FLOOR *is* the board-FILLS-the-table view — that's the most-zoomed-out state, and it's
// where the table is scaled from. You can only zoom IN from here (never out to a tiny whole-map view).
// Cover the viewport: fill the tighter dimension exactly, let the other overflow (pan/zoom in to explore).
function computeMinCell() {
  const w = S.board.width, h = S.board.height;
  const wrap = $('#boardwrap');
  const margin = 6;
  const availW = wrap.clientWidth - margin * 2;
  const availH = wrap.clientHeight - HAND_CLEAR - margin * 2;
  // CONTAIN, not cover. `Math.max` here fitted the board to whichever axis needed the LARGER cell, so
  // the floor always overran the other axis and the battlefield could be panned around at default
  // zoom — scrolling out to empty space with no way back except more scrolling. `Math.min` fits the
  // whole board inside the window, which is what the floor is described as everywhere else: fitCell()
  // says "board fills the table; zoom IN only" and setCellPx() clamps to "the board-fills-the-table
  // view". Scrolling now appears only once you actually zoom in, which is the point of a floor.
  const byW = availW / w, byH = availH / h;
  const contain = Math.min(byW, byH);
  // …but CONTAIN alone is not enough on a short, wide screen. A 22x14 board height-binds, and on a
  // phone in landscape that lands at 15px per tile with 62% of the width left empty — measured, and
  // exactly what the board looked like: a small rectangle marooned in the middle of the table.
  //
  // So the floor is also allowed to grow until a tile is at least readable, capped by the WIDTH so the
  // board can never overflow horizontally — you only ever pan vertically, which is the axis a hand of
  // cards already trains you to expect. This is safe now in a way it was not before: the camera clamps
  // to camBounds, so overflowing an axis can no longer strand you in empty space, and the one-finger
  // drag is back.
  //
  // Deliberately a FLOOR, not a rescale: where contain already gives a readable tile it wins untouched.
  // Measured effect — desktop 39px (unchanged), tablet 28 -> 30, phone 15 -> 30.
  const MIN_READABLE_CELL = 30;   // below this a tile is neither readable nor reliably tappable

        if (i >= urls.length) return;
        // hand the thread back the moment the browser wants it
        if (deadline && typeof deadline.timeRemaining === 'function' && deadline.timeRemaining() <= 0) idle(pump);
        else pump(deadline);
      };
      img.onload = () => { (img.decode ? img.decode().catch(() => {}) : Promise.resolve()).then(fin); };
      img.onerror = fin;            // an upgraded variant that was never baked is not an error
      img.src = urls[i++]; inFlight++;
    }
  };
  idle(pump);
}

// ── frame-time meter ─────────────────────────────────────────────────────────────────────────────
//
// The reason this exists rather than a profiler: the machines this has to run well on are old Intel
// Macs driving Retina panels off integrated graphics, and what costs them is COMPOSITING — 3200x1800
// of it per frame — which a JS profiler cannot see at all. Measured in headless Chrome the whole game
// is sub-3ms per operation and holds 60fps, while the same build on the real display is visibly
// sluggish. Frame time is the only number that describes what a player actually feels.
//
// Off unless asked for: `?perf=1` on the URL, or the toggle in Settings > Debug.
let _perfOn = false, _perfEl = null, _perfGaps = [];
function perfMeter(on) {
  _perfOn = on === undefined ? !_perfOn : !!on;
  if (!_perfOn) { if (_perfEl) { _perfEl.remove(); _perfEl = null; } return _perfOn; }
  if (_perfEl) return _perfOn;
  _perfEl = document.createElement('div');
  _perfEl.id = 'perfmeter';
  _perfEl.style.cssText = 'position:fixed;left:6px;top:6px;z-index:60;pointer-events:none;'
    + 'background:rgba(10,10,8,.82);color:#8fd08f;font:11px/1.45 ui-monospace,monospace;'
    + 'padding:5px 8px;border-radius:4px;white-space:pre;min-width:150px';
  document.body.appendChild(_perfEl);
  let last = performance.now(), shown = last;
  const tick = () => {
    if (!_perfOn || !_perfEl) return;
    const n = performance.now();
    _perfGaps.push(n - last); last = n;
    if (_perfGaps.length > 240) _perfGaps.shift();
    if (n - shown > 400 && _perfGaps.length > 8) {
      shown = n;
      const g = [..._perfGaps].sort((a, b) => a - b);
      const med = g[g.length >> 1], p95 = g[(g.length * 0.95) | 0], worst = g[g.length - 1];
      const bad = _perfGaps.filter(x => x > 20).length;
      _perfEl.style.color = med > 20 ? '#ff7a5a' : bad > _perfGaps.length * 0.1 ? '#e8c65a' : '#8fd08f';
      _perfEl.textContent =
        'fps    ' + (1000 / med).toFixed(0).padStart(5) + '\n' +
        'median ' + med.toFixed(1).padStart(5) + 'ms\n' +
        'p95    ' + p95.toFixed(1).padStart(5) + 'ms\n' +
        'worst  ' + worst.toFixed(1).padStart(5) + 'ms\n' +
        '>20ms  ' + String(bad).padStart(3) + '/' + _perfGaps.length;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  return _perfOn;
}
try { if (/[?&]perf=1/.test(location.search)) addEventListener('load', () => perfMeter(true)); } catch (_) {}

function initHotkeys() {
  if (window._hotkeys) return;
  window._hotkeys = true;
  window.addEventListener('keydown', e => {
    if (_typingInto(e.target) || e.ctrlKey || e.altKey || e.metaKey) return;

    // Escape and Space are the only keys that reach through an open panel: Escape is the No, Space is
    // the Yes. Every panel in the game already has both — a Return/Close and a Confirm/Take/Continue —
    // but only one of them was reachable from the keyboard, so a keyboard player could back out of a
    // card draft and could not accept one.
    const ov = _topOverlay();
    if (e.key === 'Escape') {
      e.preventDefault();
      if (ov) { closeOv(ov.id); return; }
      if (sel !== null || cmd !== null || powerArm) { cancelSel(); return; }
      toggleSettings();
      return;
    }
    if (e.key === ' ' || e.key === 'Spacebar') {
      // Always swallow it. Space is the browser's page-scroll key and #boardwrap is scrollable; letting
      // it through would jog the battlefield out from under the camera.
      e.preventDefault();
      if (affirm(ov)) return;
      if (ov) return;                       // a panel with nothing to accept just stays put
    }
    if (ov) return;
    if (typeof S === 'undefined' || !S || !S.board) return;   // battle keys only, on the battlefield

    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const hand = S.hand || [];
    const step = d => {
      if (!hand.length) return;
      handFocus = Math.max(0, Math.min(hand.length - 1, handFocus + d));
      layoutHand();
      Sfx.play('ui_tap');
    };

    switch (k) {
      case 'arrowleft': case 'ArrowLeft': case 'a': e.preventDefault(); step(-1); return;
      case 'arrowright': case 'ArrowRight': case 'd': e.preventDefault(); step(1); return;
      case 'ArrowDown': case 's': {
        e.preventDefault();
        // Down looks at the card; down again puts it away. The overlay check above already returned,
        // so reaching here means nothing is open and this can only be the opening move.
        const c = hand[handFocus];
        if (c) peekCard(c, 'Play', () => { closeOv('ovInspect'); void tapCard(handFocus); }, !c.aff || c.curse, { noDetail: false });
        return;
      }
      case 'ArrowUp': case 'w':
        e.preventDefault();
        if (hand[handFocus]) void tapCard(handFocus);
        return;
      case 'Tab': {
        e.preventDefault();
        // One key for "show me the threat", not two. Either layer on counts as on, so the first press
        // always turns the whole thing off rather than half of it.
        const on = dangerOn || intentOn;
        if (dangerOn === on) toggleDanger();
        if (intentOn === on) toggleIntent();
        return;
      }
      case 'q':
        e.preventDefault();
        // Only means anything for a unit that HAS the switch; toggleAim already no-ops otherwise.
        if (cmd !== null) toggleAim();
        return;
      case 'f': e.preventDefault(); if (S.power && S.power.ready) void usePower(); return;
      case 'e': e.preventDefault(); if (!turnBusy) void endTurn(); return;
      case 't': e.preventDefault(); showArmy(); return;
      case 'r': e.preventDefault(); showDeck(); return;
      case 'g': e.preventDefault(); showMedals(); return;
    }
    // 1-9 jump straight to a card, which beats tapping right four times on a full hand.
    if (k >= '1' && k <= '9') {
      const i = Number(k) - 1;
      if (i < hand.length) { e.preventDefault(); handFocus = i; layoutHand(); Sfx.play('ui_tap'); }
    }
  });
}
// Keyboard fallback — a gesture nobody is told about is not discoverable, and a mouse without a wheel
// had no way in at all. +/- step, 0 returns to the floor (the whole-board view).
function initZoomKeys() {
  if (window._zoomKeys) return;
  window._zoomKeys = true;
  window.addEventListener('keydown', e => {
    if (typeof S === 'undefined' || !S || !S.board) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (e.metaKey || e.altKey) return;
    if (e.key === '+' || e.key === '=') { e.preventDefault(); camZoomAt(camZ * 1.25); }
    else if (e.key === '-' || e.key === '_') { e.preventDefault(); camZoomAt(camZ / 1.25); }
    else if (e.key === '0') { e.preventDefault(); camZoomAt(1); }           // back to the whole board
  });
}

$('#end').onclick = endTurn;
initPinch();
initWheelZoom();
initDragPan();
initZoomKeys();
initHotkeys();
window.__boot = () => { _applyOrient(); const p = refresh(); setTimeout(checkForUpdate, 2500); return p; };   // src/main.ts wires the local API, then calls this; returns the refresh promise so callers/tests can await first paint; update check runs once, non-blocking
</script>
