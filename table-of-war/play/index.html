<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#23271b">
<title>Table of War</title>
<style>
  /* ── native app feel (desktop Tauri + mobile Capacitor) ── */
  html, body {
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
    touch-action: manipulation; position: fixed; inset: 0; overflow: hidden;
  }
  /* honor notches / rounded corners — edge-to-edge but keep UI clear of cutouts */
  /* top bars keep clear of the status bar AND a landscape notch (iOS/Android edge-to-edge) */
  #ctrl, #mapctrl { padding-bottom: max(4px, env(safe-area-inset-bottom)); }
  #setBtn { top: max(6px, env(safe-area-inset-top)); right: max(6px, env(safe-area-inset-right)); }
  input, textarea { user-select: text; -webkit-user-select: text; }
  :root {
    --cell: 22px;
    --felt: #23271b;          /* table surround (dark olive) */
    --panel: #1c1f16;         /* HUD / control panels */
    --edge: #46422e;          /* sepia panel borders */
    --ink: #241d10;           /* map grid ink */
    --paper: #d9d3bf;         /* parchment text */
    --f-you: #5f8bc0;         /* faction counter fills */
    --f-enemy: #c0503f;
    --f-tribe: #83924a;
    --f-neutral: #928c7e;
    --gold: #cda94e;
    --f-ui: system-ui, "Segoe UI", Roboto, sans-serif;
    --f-head: "Arial Narrow", "Roboto Condensed", "Oswald Local", system-ui, sans-serif;
    --f-num: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--felt); color: var(--paper);
    font-family: var(--f-ui); overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; position: relative; --hand-h: 120px; }
  /* #fxlayer lives INSIDE #board (see fxLayer()), in board-local pixels, so the camera carries the
     attack arrows with the grid. It used to be viewport-fixed with coordinates snapshotted from
     getBoundingClientRect() — a record of where the tile was ON SCREEN at the instant the arrow was
     created. Pan or zoom during the ~500ms it is in flight and the board slid out from under it, so
     the arrow visibly detached from both pieces. Sits above #intentfx (z 6). */
  #fxlayer { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 7; overflow: visible; }

  /* HUD */
  /* the whole HUD is ONE horizontal bar (scrolls if it can't fit); medals live below it */
  /* battle top wrapper — same menu-container bar treatment as the map (rust texture + barbed-wire edge) */
  #hudwrap { position: relative; padding-bottom: 7px; box-shadow: 0 2px 6px rgba(0,0,0,.5);
    background: url(assets/ui/ornate/hbarB.png) center bottom/auto 14px repeat-x,
                url(assets/ui/ornate/p05_mirror.png) center/300px 290px repeat; }
  #hud { padding: max(4px, env(safe-area-inset-top)) calc(42px + max(8px, env(safe-area-inset-right))) 4px max(8px, env(safe-area-inset-left));
    background: none; border-bottom: none; font-size: 12px;
    display: flex; flex-wrap: nowrap; align-items: center; gap: 6px; overflow: hidden; }   /* one bar, never scrolls */
  #hud .statline { flex: 1 1 auto; min-width: 0; flex-wrap: nowrap; overflow: hidden; gap: 1px 7px; }
  /* Legend + Menu. These used to carry an inline height:32px and were enlarged by #hud's zoom; with
     the zoom gone they need to scale on their own or they read as postage stamps on a wide monitor.
     Deliberately sized off the VIEWPORT rather than off --pillh: setPillH() measures this group's
     width to work out how much room the plates get, so making it depend on --pillh would make the
     fit solve for its own input and oscillate between two sizes on every resize. */
  #hud .hudbtns .ibtn img { height: clamp(30px, 2.4vw, 50px); width: auto; }
  /* the run label (general · act · node · turn) is the least critical bit — it shrinks
     and ellipsises first so the resources, gauge and ⋯ menu always stay visible */
  .hudmeta { flex: 1 1 auto; min-width: 16px; overflow: hidden; text-overflow: ellipsis; }
  #hud .statline > *:not(.hudmeta) { flex: 0 0 auto; }   /* resources / gauge / chips keep their size */
  /* relics — earned medals in their own row just UNDER the top bar (StS-style), acquisition order */
  /* medals float as a fully transparent overlay over the TOP of the board (no felt band, no row of
     its own) — pinned just under the top bar via --medaltop (measured = hudwrap height). */
  #medalbar { position: absolute; left: 0; right: 0; top: var(--medaltop, 44px); z-index: 6;
    display: flex; flex-wrap: wrap; gap: 3px; margin: 0; pointer-events: none;
    padding: 3px max(8px, env(safe-area-inset-right)) 3px max(8px, env(safe-area-inset-left));
    background: none; border: none; }
  #medalbar:empty { display: none; }
  /* Army tab */
  .armylist { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .armyrow { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border: 1px solid #3d3a29;
    border-radius: 5px; background: rgba(30,34,22,.5); cursor: pointer; }
  .armyrow:hover { border-color: var(--gold); }
  .retbtn { flex: 0 0 auto; width: 34px; height: 34px; border: 1px solid #4a4630; border-radius: 5px;
    background: rgba(0,0,0,.3); color: #8c8770; font-size: 18px; line-height: 1; cursor: pointer; }
  .retbtn.on { color: var(--gold); border-color: var(--gold); background: rgba(216,180,90,.12); }
  .armystats { font-family: var(--f-num); font-size: 12px; margin-top: 2px; display: flex; flex-wrap: wrap; gap: 2px 8px; }
  .medalpip { cursor: pointer; line-height: 0; display: inline-flex; position: relative; pointer-events: auto; }
  .medalpip:active { transform: scale(.9); }
  /* portrait: let the top bar wrap to a second line instead of squishing everything onto one */
  
    /* two rows: pills fill row 1, then power (left) + menu buttons (right) share row 2.
       flattening the statline lets its children + the .hudbtns wrap together in #hud. */
    :where(body.o-portrait) #hud { flex-wrap: wrap; overflow: visible; row-gap: 2px; align-items: center;
      padding-top: max(2px, env(safe-area-inset-top)); padding-bottom: 2px; }
     /* --pillh set in JS (setPillH) so row-1 pills + objective always fit one line */
    :where(body.o-portrait) #hud .statline { display: contents; }
  .medalx { position: absolute; right: -3px; bottom: -2px; font: 700 9px var(--f-num); color: #f1ead2;
    background: rgba(0,0,0,.75); border-radius: 4px; padding: 0 2px; line-height: 1.25; }
  /* menu icons live on the top bar — each opens its own panel */
  .hudbtns { flex: 0 0 auto; display: flex; flex-wrap: nowrap; gap: 3px; margin-left: auto; }   /* pushed to the right of the bar */
  .hbtn { padding: 3px 6px; font-size: 15px; line-height: 1; border-radius: 6px; text-transform: none;
    border: 1px solid #3a3a29; background: rgba(30,34,22,.7); color: #ddd6bf; }
  .hbtn:active { transform: scale(.94); }
  #hud .row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .pill { background: #2a2c1f; border: 1px solid #4a4630; border-radius: 4px;
    padding: 1px 7px; letter-spacing: .2px; box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
  .pill b { color: #f2ecd6; font-family: var(--f-num); }
  .cyan { color: #74b4d8; } .red { color: #d76b5d; } .gold { color: var(--gold); }
  .mag { color: #b78fd0; } .grn { color: #96ba6c; } .dim { color: #8c8770; }
  /* compact StS-style single stat line — no boxes, just icons + values */
  .statline { display: flex; flex-wrap: wrap; gap: 2px 11px; align-items: center; line-height: 1.35; }
  .statline .stat { white-space: nowrap; }
  .statline .stat b { color: #f2ecd6; font-family: var(--f-num); }
  .statline .info { cursor: pointer; width: 16px; height: 16px; border: 1px solid #4a4630; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: #b8b299; }
  .foechip { font-size: 11px; padding: 1px 7px; border-radius: 4px; cursor: pointer; white-space: nowrap;
    background: rgba(200,150,60,.14); border: 1px solid rgba(200,150,60,.4); color: var(--gold); }
  /* boss name rides in a mini TOAST pill (the ornate bronze-riveted bar) */
  .foechip.boss { border: none; border-radius: 0; color: #f4eed8; font-weight: 700; letter-spacing: .3px;
    padding: 3px 34px; min-height: 30px; display: inline-flex; align-items: center; gap: 4px;
    background:
      url(assets/ui/toast/toast_l.png) left center / auto 100% no-repeat,
      url(assets/ui/toast/toast_r.png) right center / auto 100% no-repeat,
      url(assets/ui/toast/toast_m.png) center center / auto 100% repeat-x;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,.5)); }
  .foechip.obj { background: rgba(120,150,90,.14); border-color: rgba(120,150,90,.4); color: #a9c98a; }
  /* HOLD objective — ornate plate with the X/Y progress in gold-glyph characters on the plaque */
  .objhold { position: relative; display: inline-block; height: var(--pillh, 34px); flex: 0 0 auto; cursor: pointer;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .objhold > img { height: 100%; width: auto; display: block; }
  .objhold .pl-p { display: none; }
  .objhold .objval { position: absolute; top: 50%; right: 9%; width: 36%; height: 44%; transform: translateY(-50%);
    display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .objhold .objval .gtext { height: 100%; }
  /* Engineer's Overcharge power — ornate plate; gauge value in gold glyphs, glows when ready */
  .powplate { position: relative; display: inline-block; height: var(--pillh, 34px); flex: 0 0 auto; cursor: pointer; padding: 0;
    background: none; border: none; -webkit-tap-highlight-color: transparent;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); transition: filter .15s, transform .1s;
    /* Isolated for the same reason as .counter: this element carries a `::before { z-index: -1 }`
       glow, and a filter is not a safe thing to hang that on — anything that later animates the
       filter to none drops the glow behind the nearest isolated ancestor. */
    isolation: isolate; }
  .powplate > img { height: 100%; width: auto; display: block; }
  .powplate .pl-p { display: none; }
  .powplate .powval { position: absolute; top: 50%; right: 8%; width: 30%; height: 44%; transform: translateY(-50%);
    display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .powplate .powval .gtext { height: 100%; }
  /* Progress toward the power, read along the foot of the plate. Momentum has no ceiling, so the
     number alone cannot show how close the next Break Camp is — this can. */
  .powplate .plgauge { position: absolute; left: 12%; right: 6%; bottom: 12%; height: 3px; border-radius: 2px;
    background: rgba(10,10,7,.72); overflow: hidden; pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.5); }
  .powplate .plgauge i { display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, #b8862f, var(--gold)); transition: width .28s ease; }
  .powplate.ready .plgauge i { background: linear-gradient(90deg, var(--gold), #fff3c4); }
  /* banked past the threshold — a second, dimmer bar shows the surplus toward the NEXT one */
  .powplate .plgauge.over { background: rgba(120,90,20,.55); }
  /* DRIVE METER (Nomad). The bank and the trajectory are different quantities: the plate shows what
     you have, this shows what the column is BUILDING. Sits on the same empty holder plate the
     nsplaque holder uses, with silver digits and the caret from the glyph set. One pip per unit that
     still owes a move this turn — fill them all and the trajectory climbs; stall one and it halves. */
  .drivemeter { position: relative; display: inline-block; height: var(--pillh, 34px); flex: 0 0 auto;
    margin-right: 4px; cursor: help; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .drivemeter > img { height: 100%; width: auto; display: block; }
  .drivemeter .dm-in { position: absolute; inset: 11% 9%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; pointer-events: none; }
  .drivemeter .dm-top { display: flex; align-items: center; justify-content: center; gap: 1px; height: 54%; }
  /* nsplaque is near-square, so two-digit values on both sides run to the rim — step the row down
     rather than letting the glyphs touch the frame. */
  .drivemeter.wide .dm-top { height: 44%; }
  .drivemeter.wider .dm-top { height: 37%; }
  .drivemeter .dm-top .mn { display: inline-flex; align-items: center; height: 100%; }
  .drivemeter .dm-top .mn img.md { height: 100%; width: auto; display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
  .drivemeter .dm-caret { height: 62%; width: auto; display: block; }
  .drivemeter.up   .dm-caret { filter: drop-shadow(0 0 2px rgba(127,217,127,.9)); }
  .drivemeter.down .dm-caret { transform: rotate(180deg); filter: grayscale(.4) drop-shadow(0 0 2px rgba(232,112,92,.9)); }
  .drivemeter .dm-pips { display: flex; gap: 2px; height: 3px; }
  /* An unfilled pip still has to be countable — it says how many units owe a move. Dark-on-bronze
     vanished, so give it a lit rim. */
  .drivemeter .dm-pips i { width: 3px; height: 3px; border-radius: 1px; background: rgba(10,9,6,.85);
    box-shadow: inset 0 0 0 1px rgba(214,190,120,.85), 0 0 0 1px rgba(0,0,0,.45); }
  .drivemeter .dm-pips i.on { background: var(--gold); box-shadow: none; }
  .drivemeter.up .dm-pips i.on { background: #7fd97f; }
  .drivemeter.idle { opacity: .55; }
  .powplate:active { transform: scale(.97); }
  /* ── PULSING GLOWS: the glow is its own element, never a filter on the thing that glows ─────────
     These four used to be `filter: drop-shadow(...)` plus `animation: pulse`, on the piece itself.
     That is the most expensive shape a web animation can take: `drop-shadow` is a blur derived from
     the element's RASTERISED CONTENT, so animating anything on that element makes the browser
     re-derive the blur every single frame, forever, for as long as the thing is on screen.
     `opacity` and `transform` are the only two properties the compositor can animate without touching
     the element again.
     So the glow moved OUT into a pseudo-element behind the piece — a radial gradient, which is a plain
     texture uploaded once — and the animation now touches nothing but that texture's opacity. The
     piece keeps only its static depth shadow, which rasterises once and never again.
     The glow element is SHAPED LIKE THE PIECE — inset to its silhouette with a matching corner radius —
     and the light comes from `box-shadow`, which spreads outward from that shape. A radial gradient was
     tried first and was visibly wrong: a circle around a square chip, washing over its edge. box-shadow
     is still a blur, but it is blurred from a KNOWN RECTANGLE rather than derived from rasterised
     content, and because nothing about this element changes but its opacity it is blurred exactly once
     and then composited for free forever after. */
  .powplate.ready { filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .powplate.ready::before {
    content: ''; position: absolute; inset: 8% 4%; z-index: -1; pointer-events: none; border-radius: 8px;
    box-shadow: 0 0 8px 2px rgba(240,201,63,.9), 0 0 14px 4px rgba(240,201,63,.45);
    animation: pulse 1.2s infinite; }
  /* portrait: swap the power/hold plates to their compact label-less versions + widen the value plaque */
  
    :where(body.o-portrait) .objhold .pl-l,
    :where(body.o-portrait) .powplate .pl-l { display: none; }
  
    :where(body.o-portrait) .objhold .pl-p,
    :where(body.o-portrait) .powplate .pl-p { display: block; }
  
    :where(body.o-portrait) .objhold .objval,
    :where(body.o-portrait) .powplate .powval { top: 50%; right: 12%; width: 40%; height: 47%; }
  .powchip { display: inline-flex; align-items: center; gap: 5px; font: 700 11px var(--f-head); letter-spacing: .3px;
    padding: 2px 9px; border-radius: 12px; background: #2a2c1f; border: 1px solid #4a4630; color: #d8d2b8; cursor: pointer; }
  .powchip b { font-family: var(--f-num); color: #efe7cf; }
  .powchip.ready { background: linear-gradient(#4a3d18, #3a2f10); border-color: var(--gold); color: var(--gold);
    box-shadow: 0 0 9px rgba(205,169,78,.55); animation: pulse 1.4s infinite; }
  .powchip .pgtrack { width: 30px; height: 5px; background: #14160d; border-radius: 3px; overflow: hidden; display: inline-block; }
  .powchip .pgtrack i { display: block; height: 100%; background: var(--gold); }
  /* battle stat nameplates — HQ / BASES / TROOPS; value engraved on the right plaque in dark gold-glyphs */
  .bpill { position: relative; display: inline-block; height: var(--pillh, 34px); flex: 0 0 auto; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5));
    isolation: isolate; }   /* holds its own `::before { z-index: -1 }` glow — see .counter */
  .bpill > img { height: 100%; width: auto; display: block; }
  .bpill .pl-p { display: none; }                          /* landscape: wide labeled plate */
  .bpill .bpv { position: absolute; top: 47%; right: 12.5%; width: 25%; height: 44%; transform: translateY(-50%);
    display: flex; align-items: center; justify-content: center; pointer-events: none; }
                           /* portrait: compact icon-only plate + wider plaque */
    :where(body.o-portrait) .bpill .pl-l { display: none; }
  
    :where(body.o-portrait) .bpill .pl-p { display: block; }
  
    :where(body.o-portrait) .bpill .bpv { top: 50%; right: 12%; width: 40%; height: 47%; }
  .pillbar { display: contents; }                          /* landscape: the 4 stat pills flow inline in the statline */
                           /* portrait: all 4 pills alone on one line, uniform 34px height (height-driven so differing aspects stay the same height) */
    :where(body.o-portrait) #hud .statline > .pillbar { display: flex; flex: 1 1 100%; flex-wrap: nowrap; gap: 4px; min-width: 0; justify-content: flex-start; align-items: center; }
  
    :where(body.o-portrait) .pillbar .bpill,
    :where(body.o-portrait) .pillbar .objhold { flex: 0 0 auto; height: var(--pillh, 34px); }
     /* uniform height (JS setPillH); spread across the row width */
    :where(body.o-portrait) .pillbar .bpill > img,
    :where(body.o-portrait) .pillbar .objhold > img { height: 100%; width: auto; }
  
    :where(body.o-portrait) .pillbar .foechip { flex: 0 0 auto; }
  
    :where(body.o-portrait) .powplate { height: var(--pillh, 34px); }
     /* row-2 power gauge matches the pill height */
  
  .bpill .bpv .gtext { height: 100%; }
  .bpill.numA .bpv .gtext { filter: brightness(.30) saturate(1.5) drop-shadow(0 1px 0 rgba(255,236,190,.4)); }   /* engraved gold */
  .bpill.numC .bpv .gtext { filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }                                     /* bronze */
  .bpill .bpv .mn { display: inline-flex; align-items: center; height: 100%; }                                   /* silver metal */
  .bpill .bpv .mn img.md { height: 100%; width: auto; display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
  .bpill .bpv .mn img.msl { height: 80%; width: auto; align-self: center; filter: grayscale(1) brightness(1.55) contrast(1.05); }
  .bpill.danger { filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .bpill.danger::before {
    content: ''; position: absolute; inset: 8% 4%; z-index: -1; pointer-events: none; border-radius: 8px;
    box-shadow: 0 0 6px 2px rgba(215,70,60,.92), 0 0 12px 4px rgba(215,70,60,.45);
    animation: pulse 1.3s infinite; }
  .bpill.full { filter: drop-shadow(0 0 5px rgba(230,190,80,.75)) drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  /* settings: battle-number style picker — each chip is an ornate plaque showcasing a sample in its style */
  .nspick { position: relative; flex: 1 1 0; padding: 0; border: none; background: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); transition: filter .15s, transform .1s; }
  .nspick img.nsbg { width: 100%; height: auto; display: block; }
  .nspick.on { filter: drop-shadow(0 0 7px rgba(230,190,80,.9)) drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .nspick:active { transform: scale(.97); }
  .nspick .nsval { position: absolute; top: 47%; left: 50%; transform: translate(-50%,-50%); height: 34%;
    display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .nspick .nsval .gtext { height: 100%; }
  .nspick.a .nsval .gtext { filter: brightness(.30) saturate(1.5) drop-shadow(0 1px 0 rgba(255,236,190,.4)); }
  .nspick.b .nsval .gtext { filter: grayscale(1) brightness(1.55) contrast(1.05) drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
  .nspick.c .nsval .gtext { filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
  .nspick .nslbl { position: absolute; bottom: 7%; right: 9%; font: 700 9px sans-serif; color: #2e2008; }

  /* board — a printed tactical map on a felt table */
  /* touch-action: none so a one-finger drag reaches touchmove as a PAN. Without it the browser may
     claim the gesture for its own scroll/overscroll handling and the board never sees the move —
     `overflow: hidden` stops the container scrolling but does not stop the browser trying. */
  #boardwrap { flex: 1; overflow: hidden; padding: 0; position: relative; touch-action: none;   /* positioning context for the floating medal overlay */
    background: #17130d;   /* dark backstop only; the table image lives on #board so there is no double-image seam */
    display: flex; justify-content: safe center; align-items: safe center;
    isolation: isolate; }   /* trap the board's inner z-indexes (storm/fog/tracer) so they can't paint over the floating hand */
  /* the board scrolls clear of the floating hand/controls that overlay its bottom */
  /* hand clearance is baked into #board's own padding in JS (renderBoard/HAND_CLEAR) so the table
     spans the whole wrap edge-to-edge with no scroll at min zoom — no wrap padding to double-count. */
  /* the FULL table image lives on #board (padded to fill the viewport at min zoom, so the whole
     table shows edge-to-edge fully zoomed out) and scales up with the grid as you zoom in.
     100% 100% no-repeat = one un-tiled image → no seam. */
  #board { display: grid; gap: 0; position: relative; background: url(assets/board/table.jpg) center/cover no-repeat;
    /* Composite the board onto its own GPU layer. The wood table stays exactly as-is, but now it (and the
       cells) rasterize into tiles: a unit move re-rasterizes only the tiles it touched instead of repainting
       the whole surface on the main thread, and a scroll/pan is a pure compositor shift — that main-thread
       full-surface repaint is what produced the horizontal tearing. Paired with the per-cell content-visibility
       culling, only near-viewport tiles stay live, so this doesn't balloon memory on big maps.

       `will-change` states the promotion outright instead of implying it. The translateZ(0) below was the
       only hint until the camera landed, and applyCam() then began writing an INLINE transform over it —
       inline beats the stylesheet, so the hint was gone and the tearing came back. Relying on the shape
       of a transform is fragile in both directions: `translate3d(x,y,0) scale(z)` is a 3D function whose
       result is still a 2D matrix, so it reads back from getComputedStyle as `matrix(...)` and cannot be
       checked that way either. will-change does not care what applyCam writes. */
    will-change: transform; transform: translateZ(0); backface-visibility: hidden; }
  /* combat tracer — a brief streak from an attacker's tile to the unit it hit, so a ranged/unseen shot
     reveals where it came from. Source end gets a pulse ring even if the shooter sits in fog. */
  #boardwrap.panning { cursor: grabbing; }

  /* portrait: use a vertically-oriented table image so the wood isn't stretched sideways */

       is the big win — it caps paint area AND decoded-texture memory to what's actually visible, which
       is what caused the horizontal tearing + the long-session glitch. Intrinsic size = exact cell box,
       so there is zero layout shift; near-viewport cells still render, so fog feather at the edge holds. */

     The flat colour stays: it costs nothing next to an image draw, and it is the fallback if the cloud
     texture ever fails to load. Applied from a predicate, not from the presence of a `.fog.fill` —
     remembered tiles carry one too, veiled at .62 opacity, and their terrain must read through it. */

  .cell.storm { box-shadow: inset 0 0 9px 2px rgba(190,205,255,.55); }
  /* storm wall overlay — a translucent storm icon ON TOP of whatever's on the tile (terrain + unit).
     It BLINK-FLASHES like lightning; each wall cell is offset (negative delay) so the ring flickers. */
  /* THE STORM. Same principle as the pulsing glows, at fifty times the scale — this is the single most
     expensive effect in the game and the only one that is always on screen.
     It used to be ONE element per storm tile, each animating opacity AND `filter: brightness()`, wrapped
     around an <img> carrying a static `drop-shadow`. Animating a filter forces the browser to re-derive
     that blur from the rasterised content every frame; doing it on up to fifty tiles at once, forever,
     is a permanent tax for as long as a storm is visible.
     Now NOTHING animates a filter. The icon keeps its original opacity beat — surging to full and
     falling back, which was always most of the effect — and opacity is one of the two properties the
     compositor can animate without touching the element again, so the drop-shadow inside is rasterised
     once into the layer and simply composited from then on. The brightness step is replaced by a
     separate pane of light over the tile, also opacity-only. That is what lightning is anyway: not the
     ground growing brighter, but light arriving on top of it.
     A first attempt held the icon still and used only the light pane; it lost the surge and read as a
     much weaker effect, which the side-by-side showed immediately.
     The per-tile stagger that ripples the flash across the wall rides on a custom property, because
     animation-delay does not inherit to a pseudo-element but a variable does. */
  .stormfx { position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: .58;
    animation: stormbeat 1.5s ease-in-out infinite; animation-delay: var(--sd, 0s); }
  .stormfx img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 3px rgba(150,180,255,.55)); }
  .stormfx::after {

     cheap per-pixel pass and the opacity spikes carry the lightning read on their own. */
  /* The icon's original beat, with the two `filter: brightness` steps simply deleted — the opacity
     numbers are untouched, so the rhythm is identical. */
  @keyframes stormbeat {
    0%, 66%, 100% { opacity: .5; }
    72% { opacity: 1; }
    78% { opacity: .62; }
    84% { opacity: .95; }

  /* The light, on the same beat — this is what the brightness steps used to do. */
  @keyframes stormflash {
    0%, 66%, 100% { opacity: 0; }
    72% { opacity: .8; }
    78% { opacity: .12; }
    84% { opacity: .45; }
    91% { opacity: 0; }

  /* every action spent this turn — done, not broken. Deliberately lighter than .disabled below and
     with no dashed outline, so a used-up trooper never reads as EMP-bricked. Keeps a faint friendly

  .counter.spent { filter: grayscale(.8) brightness(.6) drop-shadow(0 0 2.5px rgba(79,143,224,.5)); }

  /* legal move/target tile — marker shape is user-selectable (see #board[data-ts]) */

    border: 1px solid #4f6f8a; border-radius: 5px; background: rgba(20,34,44,.7); color: #9cd0ee; }
  .uitoggle:active { transform: scale(.94); }
  /* z-index 6, not 3. The fog layer is 4 and the lifting-fog animation is 5, so a legal-move marker on a
     tile with fog spilling in from an unexplored neighbour was drawn UNDERNEATH that spill — exactly the
     tiles at the edge of your vision, which is where you most need to see how far you can go. */
  #board[data-ts] .legal::after { content: ''; position: absolute; pointer-events: none; z-index: 6; animation: pulse 1s infinite; }
  #board[data-ts="A"] .legal::after { inset: 7%; border: 2.5px solid var(--ts); border-radius: 4px;
    box-shadow: 0 0 6px var(--ts), inset 0 0 6px var(--tsf); }
  #board[data-ts="B"] .legal::after { inset: 12%; border: 3px solid var(--ts); border-radius: 3px; filter: drop-shadow(0 0 2px var(--ts));
    -webkit-mask: linear-gradient(#000 0 0) top left/32% 32% no-repeat, linear-gradient(#000 0 0) top right/32% 32% no-repeat, linear-gradient(#000 0 0) bottom left/32% 32% no-repeat, linear-gradient(#000 0 0) bottom right/32% 32% no-repeat;
            mask: linear-gradient(#000 0 0) top left/32% 32% no-repeat, linear-gradient(#000 0 0) top right/32% 32% no-repeat, linear-gradient(#000 0 0) bottom left/32% 32% no-repeat, linear-gradient(#000 0 0) bottom right/32% 32% no-repeat; }
  #board[data-ts="C"] .legal::after { top: 50%; left: 50%; width: 34%; height: 34%; transform: translate(-50%,-50%) rotate(45deg);
    border: 3px solid var(--ts); box-shadow: 0 0 7px var(--ts), inset 0 0 5px var(--tsf); }
  #board[data-ts="D"] .legal::after { inset: 16%; border: 3px solid var(--ts); border-radius: 50%; box-shadow: 0 0 6px var(--ts); }
  #board[data-ts="E"] .legal::after { inset: 30%; border-radius: 50%; background: radial-gradient(circle, var(--ts), var(--tsf)); box-shadow: 0 0 8px var(--ts); }
  #board[data-ts="F"] .legal::after { inset: 0; box-shadow: inset 0 0 0 3px var(--ts), inset 0 0 14px 2px var(--tsf); }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.5;} }
  .fade { filter: grayscale(.9) brightness(.5); }   /* targeting: mute non-target tiles to grey, stay opaque (no see-through) */
  /* action replay + intent telegraphs */
  .fx-hit .counter { animation: fxhit .4s; } .fx-move .counter { animation: fxmove .4s; }
  .fx-spawn .counter { animation: fxspawn .5s; }
  .fx-heal .counter { animation: fxheal .5s; }
  @keyframes fxheal { 0%,100%{ filter: var(--dep); } 50%{ filter: var(--dep) drop-shadow(0 0 7px #7fe08a) brightness(1.25); } }
  /* Fires on EVERY damaged unit, and a Barrage now catches twenty at once -- twenty simultaneous blurs
     is a hitch on a phone. The shake is transform-only (compositor) and brightness is a cheap per-pixel
     pass; the drop-shadow blur was the whole cost and reads as little more than a warmer flash. */
  @keyframes fxhit { 0%,100%{ transform:none; } 30%{ transform: translate(2px,-1px) rotate(-4deg); filter: brightness(1.75); } 60%{ transform: translate(-2px,1px) rotate(3deg);} }
  /* `filter: none` here also threw away --dep, so the piece lost its drop shadow and flattened
     against the tile at each end of the hop. Animate FROM the resting filter, not from nothing. */
  @keyframes fxmove { 0%,100%{ filter: var(--dep); } 50%{ filter: var(--dep) drop-shadow(0 0 6px #9fd0ff); } }
  @keyframes fxspawn { 0%{ transform:scale(.3) rotate(-20deg); opacity:0; } 100%{ transform:scale(1) rotate(0); opacity:1; } }
  @keyframes shake { 0%,100%{transform:translate(0,0);} 20%{transform:translate(-4px,2px);} 40%{transform:translate(4px,-2px);} 60%{transform:translate(-3px,-2px);} 80%{transform:translate(3px,2px);} }

  /* A tip fired ON a decision — a card draft, an outpost, the hand you are about to discard — lifts off
     the bottom edge into the middle of the screen over its own veil. Bottom-pinned it would lie across

  #coachveil { position: fixed; inset: 0; z-index: 44; display: none; background: rgba(10,9,8,.6);

  @keyframes achspin { from { transform: rotate(-25deg) scale(.4); } to { transform: rotate(0) scale(1); } }
  /* an attacker revealed by striking you from the fog — pulsing red ring so you can't miss it */
  .cell.spotted { outline: 2px solid #ff5a3b; outline-offset: -2px; box-shadow: inset 0 0 10px 2px rgba(255,90,55,.55); animation: pulse 1s infinite; }
  .intent-attack { outline: 2px solid #ff5a3b; outline-offset:-2px; }
  .intent-advance { outline: 2px solid rgba(255,170,60,.6); outline-offset:-2px; }
  /* ── intent telegraph ─────────────────────────────────────────────────────────────────────────
     Where each enemy is about to stand and what it is about to shoot. It is a PROJECTION (see
     forecast_intents() in game.ts for exactly what it cannot know), so it is drawn as something
     deliberately insubstantial — a bleached, breathing copy of the piece, never a solid counter that
     could be misread as a unit already standing there. */
  .ghost { position: absolute; inset: 0; pointer-events: none; z-index: 3;
    filter: grayscale(1) brightness(2.4) drop-shadow(0 0 3px rgba(255,255,255,.5));
    animation: ghostbob 2.6s ease-in-out infinite; }
  .ghost .counter { animation: none; }
  @keyframes ghostbob { 0%,100% { opacity: .28; } 50% { opacity: .5; } }
  .cell.ghosted { outline: 1px dashed rgba(255,255,255,.35); outline-offset: -2px; }
  /* Lives INSIDE #board in board-local pixels, so panning and zooming carry it with the grid — unlike
     the replay's viewport-fixed #fxlayer, which can be fixed because its arrows last 400ms. */
  #intentfx { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 6; overflow: visible; }
  #intentfx .imove { stroke: rgba(255,206,120,.6); fill: none; stroke-linecap: round; stroke-dasharray: 4 5; }
  #intentfx .imovehead { fill: rgba(255,206,120,.75); }
  #intentfx .iatk { stroke: rgba(255,74,52,.9); fill: none; stroke-linecap: round;
    filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.8)); }
  #intentfx .iatkhead { fill: rgba(255,74,52,.95); filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.8)); }
  /* the conditional follow-up — dashed and dimmer, because it only lands if the first target dies */
  #intentfx .iatk.inext { stroke: rgba(255,74,52,.55); stroke-dasharray: 5 4; }
  #intentfx .iatkhead.inext { fill: rgba(255,74,52,.6); }
  /* A raider robbing your HQ costs you salvage, not hit points — so it gets the coin colour rather than
     the blood one, and no damage badge (its projected damage is genuinely zero). */
  #intentfx .isteal { stroke: rgba(232,198,90,.95); fill: none; stroke-linecap: round; stroke-dasharray: 7 4;
    filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.8)); }
  #intentfx .istealhead { fill: rgba(232,198,90,1); filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.8)); }
  /* Incoming damage, summed over every enemy aiming at this piece — the mirror of .dmgprev, which is what
     YOUR selected unit would deal. It sits BOTTOM-RIGHT because every other corner of a counter is already
     spoken for: attack value top-left, rank stars top-right, .dmgprev just outside the top-right, hp bar
     across the bottom middle and loot bottom-left. Unlike .dmgprev this is on screen unprompted and is the
     number the turn actually turns on, so it scales with the cell instead of staying 11px at every zoom. */
  .incdmg { position:absolute; bottom:-2px; right:-1px; z-index:4; pointer-events:none;

  /* framed "object card" — composited on the fly: art window + frame PNG + name/cost/desc overlays */
  .fcard { position:relative; margin:0 auto; user-select:none; filter:drop-shadow(0 4px 10px rgba(0,0,0,.55)); }
  .upgwrap .fcard { filter:drop-shadow(0 0 11px rgba(240,200,60,.8)) drop-shadow(0 4px 10px rgba(0,0,0,.45)); }
  /* .fcbox scopes the framed-card layers so BOTH the big .fcard views and the hand's .card.framed share them */
  /* translateZ(0): same clipped-box-inside-a-zoomed-overlay repaint fix as .plaque .pc-av — see the
     note there. This one matters most, because the card view is opened constantly during a run.
     `contain: paint` rides alongside it and does the same clip containment WITHOUT forcing a layer,
     which matters for the exemption directly below. */
  .fcbox .fc-art { position:absolute; z-index:1; overflow:hidden; border-radius:7px; transform:translateZ(0); contain:paint;
    background:radial-gradient(120% 90% at 50% 12%, color-mix(in srgb, var(--cat) 60%, #0b0d08), #090b07 78%);
    display:flex; align-items:center; justify-content:center; box-shadow:inset 0 0 22px rgba(0,0,0,.55); }
  /* WebKit paints a composited descendant OUTSIDE an ancestor's filter — so on any card that is being
     GREYED, the art window kept its full colour and the card did not read as unplayable at all. This
     is macOS/iOS only; Chromium filters the layer correctly, which is why it never showed on Windows.
     Reproduced in Safari with the five cases below and the same markup: with translateZ(0) the greyed
     card stays orange, with it removed (or replaced by contain:paint alone) it greys.
     So: drop the layer exactly where a filter sits above it. `contain: paint` above still gives these
     the clip containment the momentum-scroll fix was for, and a greyed card is inert anyway. */
  .card.unaff .fc-art, .gridcard.seen .fc-art, .gridcard.disabled .fc-art,
  .collcard.seen .fc-art, .removedcard .fc-art { transform: none; }
  .fcbox .fc-art .fc-glyph { display:block; width:40%; height:40%; color:color-mix(in srgb, var(--cat) 72%, #f2ecd0); opacity:.9; filter:drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
  .fcbox .fc-art .fc-glyph svg { width:100%; height:100%; display:block; }
  .fcbox .fc-art img { width:100%; height:100%; object-fit:cover; }
  .fcbox .fc-face { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  .fcbox .fc-framecost { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  .fcbox .fc-name { position:absolute; z-index:3; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 4%; overflow:hidden;
    font-family:var(--f-head); font-weight:800; letter-spacing:.2px; line-height:1.02; }
  .fcbox .fc-desc { position:absolute; z-index:3; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:5% 7%; overflow:hidden; font-weight:600; line-height:1.2; }
  /* framed card in the HAND fan: square, the frame provides border/bg; card state shown via overlays */

  /* raw text buttons: our gunmetal button style (same as .setbtn) — NOT a frame; ornate actions use
     the image buttons (.ibtn / .pbtn) instead. No button uses a frame kit. */
  button { font: 700 13px var(--f-head); letter-spacing: .4px; color: #ecdfae; text-transform: uppercase;
    text-shadow: 0 1px 2px #000; cursor: pointer; padding: 9px 15px; border-radius: 6px; border: 1px solid #5a5763;
    background: linear-gradient(#3b3b44, #23232b);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 2px 4px rgba(0,0,0,.45); transition: filter .12s, transform .1s; }
  /* ── ONE hover treatment for every control ──────────────────────────────────────────────────────
     There used to be four behaviours: `.plaque` ANIMATED (it alone declared a transition), `.gcard`
     jumped the same distance with no transition, the image buttons got only this brightness filter,
     and on the menu tiles that was faint enough to read as no response at all. Hovering a commander
     also made History and Achievements FLICKER: a hover that introduces `filter` or `transform`
     CREATES a stacking context, and building one up and tearing it down forces the neighbours to
     repaint.
     So the hover no longer introduces anything. `translateZ(0)` is declared in the BASE state, so the
     stacking context exists at all times and hovering only changes a value the compositor can animate
     on its own — no repaint, no flicker, and cheaper than the brightness filter this replaces.
     One distance, one duration, everywhere. Gated on `hover: hover` so touch devices get none of it
     and pay for none of it. */
  button:active { transform: scale(0.97); }
  /* (moved to the end of this stylesheet — see "ONE hover treatment", part 2) */
  button:disabled { filter: grayscale(.65) brightness(.62); opacity: .7; cursor: not-allowed; }

    box-shadow: inset 0 0 0 2px rgba(255,222,96,.85), 0 0 10px rgba(240,200,60,.5); }

                           /* portrait: fill the container width */

  /* overlays */
  /* No backdrop-filter here. It was a fullscreen grayscale+brightness composite sitting behind a
     background that is 97.5% opaque — measured at max 4/255 and mean 0.58/255 across the frame, i.e.
     invisible — and #ovGeneral covers itself with an opaque image anyway. Overlays open constantly
     during play (card view, node, inspect, deck), and a full-viewport filtered composite is one of the
     more expensive things a webview can be asked for, especially on integrated graphics. Paying that
     every time a panel opens, for a difference nobody can see, is the wrong trade.
     #coachveil keeps ITS blur: at .6/.3 alpha that one is genuinely visible. */
  .overlay { position: fixed; inset: 0; background: rgba(15,15,13,.975); display: none;
    flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top)); overflow-y: auto; z-index: 10; }
  /* NOTE: was `justify-content: safe center` — the `safe` keyword is unsupported on Safari < 15.4
     (old iPad), where it degrades to plain `center` and clips/strands the overflowing top of long
     menus (achievements/how-to-play/generals/settings). flex-start always scrolls from the top. */
  .overlay.show { display: flex; }
  /* the trailing close/done button on long scrolling menus sticks to the bottom of the screen,
     so you can leave from anywhere without scrolling all the way down */
  .overlay > button:last-child { position: sticky; bottom: 10px; z-index: 6; flex: 0 0 auto;
    box-shadow: 0 5px 16px rgba(0,0,0,.7); }
  .overlay > .ovclose { position: sticky; bottom: 10px; z-index: 6; flex: 0 0 auto; text-align: center;
    margin-top: 12px; filter: drop-shadow(0 5px 14px rgba(0,0,0,.7)); }

  /* `touch-action: none` is what makes a trackpad drag work. Without it the browser is free to read a

  /* translateZ(0) is a WebKit repaint fix, not styling — it moves nothing. Reported on macOS: the menu

  /* `translateZ(0)` on the two CLIPPED boxes below is a WebKit repaint fix, not styling — it moves
     nothing. Reported on macOS: scroll the Generals list away and back with a trackpad and the
     portrait and the doctrine line both vanish, while the frame image and the name plate stay. The

    transform: translateZ(0); }

  .plaque .pc-plq { position: relative; z-index: 2; display: block; width: 100%; }

    font: 800 clamp(15px,4.3cqw,22px) var(--f-head); letter-spacing: 1.4px; text-transform: uppercase;
    color: #f4e8c2; text-shadow: 0 1px 2px #000, 0 0 6px rgba(0,0,0,.55); pointer-events: none; }
  .plaque .pc-desc { position: absolute; z-index: 3; display: flex; align-items: center; overflow: hidden;
    font-size: clamp(8px,2.35cqw,11px); line-height: 1.28; color: #e2d6b0; text-transform: none;
    text-shadow: 0 1px 1px #000; pointer-events: none; transform: translateZ(0); }
  .plaque .pc-badge { position: absolute; top: 6px; right: 9px; z-index: 4; font: 800 10px var(--f-head);
    letter-spacing: 1px; color: #1a1608; background: linear-gradient(180deg,#e9c752,#b9922f);
    border-radius: 5px; padding: 1px 7px; box-shadow: 0 1px 2px rgba(0,0,0,.5); pointer-events: none; }
  .cell.stale { opacity: .5; }   /* remembered enemy base, currently in fog */
  /* auto-update banner (top, above everything) */
  #updateBanner { position: fixed; top: 0; left: 0; right: 0; z-index: 60; display: none;
    justify-content: center; padding: max(6px, env(safe-area-inset-top)) 10px 8px;
    background: linear-gradient(#1c3322, #16261a); border-bottom: 1px solid #3e7a4e;
    box-shadow: 0 3px 14px rgba(0,0,0,.5); }
  #updateBanner.show { display: flex; }
  #updateBanner .ub-in { width: min(560px, 100%); color: #dce9d6; font-size: 13px; }
  #updateBanner .ub-in b { color: #9fe08a; }
  #updateBanner .ub-log { color: #b7c4b0; font-size: 12px; line-height: 1.4; margin: 4px 0 8px; max-height: 4.4em; overflow: auto; }
  #updateBanner .ub-btns { display: flex; gap: 8px; }
  #updateBanner .ub-dl { background: #2f6a3a; border: 1px solid #4f8f56; color: #eafbe6; font-weight: 700; padding: 6px 14px; border-radius: 6px; }
  #updateBanner .ub-x { background: #2a2c20; border: 1px solid #454838; color: #cdc6ac; padding: 6px 12px; border-radius: 6px; }
  .cell.danger { box-shadow: inset 0 0 0 2px rgba(255,60,60,.55); }
  /* A tile an enemy can step onto AND fire from. Deeper and denser than plain danger so the two read as
     tiers of one thing rather than two different markings — same hue, more of it. */
  .cell.dangerfire { box-shadow: inset 0 0 0 2px rgba(190,20,20,.8); }
  /* flag objective — gold tile, white flag when empty, white glow on the unit holding it */
  .cell.holdpoint { background-image: url(assets/board/node.png); color: #fff; }
  .cell.holdpoint .counter { filter: var(--dep) drop-shadow(0 0 3px #fff) drop-shadow(0 0 3px #fff); }
  /* the objective ring (and its flag) is an overlay ABOVE the unit token AND the fog (z-index beats both)
     so the whole marker stays visible while a unit stands on it — and shows THROUGH the fog when you can't */
  .cell.holdpoint .holdring { position: absolute; inset: 1px; border-radius: 4px; pointer-events: none; z-index: 7;
    box-shadow: inset 0 0 0 3px rgba(255,206,84,.95), 0 0 7px rgba(255,206,84,.55); animation: pulse 1.4s infinite;
    display: flex; align-items: center; justify-content: center; }
  .cell.holdpoint .holdring > * { filter: drop-shadow(0 0 3px rgba(0,0,0,.9)); }   /* keep the flag legible over fog */
  /* A multi-tile creature is drawn ONCE as a single token stretched over its whole footprint — it reads as
     one animal, not a mosaic. The core sits at the top-left of the body, so growing right and down covers
     it exactly. The other tiles carry no art at all: one creature, one token, one health bar. */
  /* `.counter` pins all four edges with `inset: 7%`, so width alone does nothing — release the right and
     bottom edges and size it explicitly: N cells wide minus the same 7% inset at each outer edge. */
  .counter.bodycore { right: auto; bottom: auto; z-index: 6; overflow: visible;
    width: calc(var(--bsz) * 100% - 14%); height: calc(var(--bsz) * 100% - 14%); }
  .counter.bodylimb { visibility: hidden; }
  .cell.bigunit { content-visibility: visible; contain: none; overflow: visible; z-index: 6; }
  /* A travelling piece is a child of the tile it is moving TO, translated back onto the tile it came
     FROM, so for most of its flight it is drawn well outside its own cell box. `content-visibility` on
     .cell brings paint containment with it, which CLIPS a cell's contents to that box — so the piece was
     erased for the whole journey and only wiped into view as it re-entered its destination tile. It read
     as the unit sinking behind the board and sliding back out at the target.
     Nothing about z-index could have fixed it: containment clips before stacking is ever consulted.
     Same exemption bigunit needs above, for exactly the same reason, applied for the hop's duration
     only — every other tile keeps its culling, which is what caps paint area on a big map. */
  .cell.travelling { content-visibility: visible; contain: none; overflow: visible; }
  /* The token spills across the creature's whole footprint, so a tap on the far half would otherwise
     land on the CORE cell (the token's owner) rather than the limb under the finger — and the core can
     be two tiles from you, so the game answered "out of range" while you were touching the thing.
     Let the art be click-through: the cell under the finger takes the tap. */
  .cell.bigunit > * { pointer-events: none; }
  /* Cell-sized markers (the spotted outline, selection ring, danger hatch) are drawn on ONE square and
     read as a stray bracket against a creature that covers four. The token itself is unmistakable. */
  .cell.bigunit { outline: none !important; box-shadow: none !important; }
  .cell.bigunit::after { content: none !important; }
  /* a huge (2x2) monster — its token swells past its tile and glows */
  .counter.huge { transform: scale(1.9); z-index: 6; overflow: visible;
    filter: drop-shadow(0 0 5px rgba(190,130,225,.85)) drop-shadow(0 0 10px rgba(120,80,160,.6)); }
  .cell.danger::after { content:''; position:absolute; inset:0;
    background: repeating-linear-gradient(45deg, transparent 0 5px, rgba(255,40,40,.16) 5px 8px);
    pointer-events:none; }
  .cell.dangerfire::after { content:''; position:absolute; inset:0;
    background: repeating-linear-gradient(45deg, rgba(120,0,0,.22) 0 5px, rgba(190,15,15,.42) 5px 8px);
    pointer-events:none; }
  /* ornate 3-slice toast bar: bronze rivet caps + a tiled riveted body (like our frame containers) */
  #toast { position: fixed; left: 50%; bottom: 210px; transform: translateX(-50%);
    color: #f4eed8; font: 700 12.5px var(--f-head); letter-spacing: .2px; text-align: center;
    text-shadow: 0 1px 2px rgba(0,0,0,.75); opacity: 0; transition: opacity .2s; pointer-events: none;
    max-width: 92%; z-index: 20; box-sizing: border-box;
    display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 6px 46px;
    background:
      url(assets/ui/toast/toast_l.png) left center / auto 100% no-repeat,
      url(assets/ui/toast/toast_r.png) right center / auto 100% no-repeat,
      url(assets/ui/toast/toast_m.png) center center / auto 100% repeat-x;
    filter: drop-shadow(0 4px 11px rgba(0,0,0,.55)); }
  #toast.show { opacity: 1; }
  /* landscape: the hand sits at the very bottom and the board is short — drop the toast down
     to the hand so it doesn't float over the middle of the board */
   :where(body.o-landscape) #toast { bottom: 30px; }

  /* NOTE: this block lives at the END of the stylesheet on purpose. Media queries add no
     specificity, so when it sat higher up, later base rules like `.achv { max-width: 500px }`
     silently beat the desktop max-widths — the panel measured 750px (500 x 1.5 zoom) instead of
     the intended width. Keep new desktop rules down here.

  /* NOTE: every desktop rule below is gated on (pointer: fine) as well as width. Width ALONE is not a
     desktop test — a phone held in landscape is 2340px wide, so the whole of this block was firing on
     mobile: the daily plate's type overflowed its plate, the battle HUD was zoomed until Break Camp was
     clipped off the bar, and a Fullscreen toggle appeared on a device that is already fullscreen.
     Phones report a coarse pointer; mice and trackpads report a fine one. */
  /* ── DESKTOP PASS ──────────────────────────────────────────────────────────────────────────────
     At 1920x1080 every overlay was a ~404px column pinned to the top of the screen: about a quarter
     of the width in use, rows running under the sticky close button, and type sized for a phone.
     Three levers, in the order they matter:
       1. the frame's max-width now GROWS with the viewport instead of sitting at 404px;
       2. list content flows into columns once there is room, which also cuts the vertical overflow
          that was hiding rows behind the close button;
       3. zoom still carries type size, because it scales a whole block together — but it is applied
          to the overlay's content wrapper generally, not only to `.oframe`. Achievements and the
          deploy plaque are not oframes, which is exactly why they stayed phone-sized.
     Effective width = max-width x zoom. Everything here is behind a min-width gate; portrait and
     mobile are untouched. */
  @media (min-width: 820px) and (pointer: fine) {
    .overlay > *:not(.ovclose):not(.menu) { zoom: 1.22; }
    /* True centring. `.overlay` keeps justify-content:flex-start because `safe center` is broken on
       old Safari and plain `center` clips the top of a menu taller than the screen. Auto block
       margins do the same job safely — they centre when there is room and collapse to 0 when there
       is not, so a long menu still scrolls from its top rather than losing its head. */
    .overlay > *:not(.ovclose) { margin-block: auto; }
    .overlay .oframe:not(.menu) { max-width: 520px; }
  }
  @media (min-width: 1100px) and (pointer: fine) {
    .overlay > *:not(.ovclose):not(.menu) { zoom: 1.38; }
    .overlay .oframe:not(.menu) { max-width: 640px; }
  }
  @media (min-width: 1500px) and (pointer: fine) {
    .overlay > *:not(.ovclose):not(.menu) { zoom: 1.5; }
    .overlay .oframe:not(.menu) { max-width: 760px; }
  }
  @media (min-width: 2000px) and (pointer: fine) {
    .overlay > *:not(.ovclose):not(.menu) { zoom: 1.65; }
    .overlay .oframe:not(.menu) { max-width: 820px; }
  }

  /* Achievements: the plaque header spans a two-column list, so two achievements sit beneath it and
     the wide screen is actually used. `break-inside: avoid` keeps a row from being split down the
     middle by the column break. */
  @media (min-width: 1100px) and (pointer: fine) {
    .achv { max-width: 820px; }
    .achv-hdr { width: min(100%, 600px); }
    /* GRID, not columns. CSS columns flow by height, so the two sides ended up with different row
       heights and the text reflowed to fit whatever width was left — rows visibly "smushed" against
       each other. A grid gives every cell the same width, and stretching the row to the cell makes
       the pair on each line match. */
    .achv-content { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 22px; align-items: stretch; }
    .achv-content > * { min-width: 0; }
    /* SCOPED to the achievements list. Unscoped, `.achrow` also matched #ovProg's unlock rows, which
       stripped their max-width and stretched them across the whole widened frame. */
    .achv-content .achrow, .achv-content .unlbar { max-width: none; width: 100%; height: 100%; margin: 0; box-sizing: border-box; }
    .achv-content .ach-div { grid-column: 1 / -1; }
  }
  @media (min-width: 1500px) and (pointer: fine) { .achv { max-width: 980px; } .achv-hdr { width: min(100%, 680px); } }
  @media (min-width: 2000px) and (pointer: fine) { .achv { max-width: 1080px; } }
  /* How to Play and Settings are the same shape of problem — a tall stack of `.choice` blocks. */
  @media (min-width: 1100px) and (pointer: fine) {
    /* `.helpcols > .choice`, not `.oframe > .choice`. The topics live inside the .helpcols wrapper,
       so the child combinator never matched a single one of them and `break-inside` stayed `auto` —
       which let the column break land in the MIDDLE of a topic. The tail half then started the right
       column with its top border cropped off: the reported "cuts the top off of a container that gets
       put at the top of the right column". */
    #ovHelp .helpcols > .choice, #ovSettings .oframe > .choice { break-inside: avoid; }
    #ovHelp .helpcols { column-count: 2; column-gap: 24px; }
    /* A block that starts a column must not inherit the 7px top margin the flow gave it, or the two
       columns start at different heights. */
    #ovHelp .helpcols > .choice:first-child { margin-top: 0; }
    /* The keyboard table is the widest thing in here and does not want to be a 900px-wide slab, and
       Replay the tutorial reads as a footer action — it belongs under the keys, not above them. */
    #ovHelp .keyblock { max-width: 620px; margin-inline: auto; }
    /* Two up. NOT `column-count` — `.keytable` is a flex container, and multi-column has no effect on
       one, so the keys stayed in a single tall stack with half the panel empty beside them. */
    #ovHelp .keyblock .keytable { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 22px; }
    /* Replay the tutorial is a footer action, not a headline: at the desktop zoom the shipped 340px
       plate rendered over 500px wide and dwarfed everything above it. */
    #ovHelp .helpfoot { max-width: 210px; }
    /* Settings as a command panel: a fixed two-column grid of equal cells rather than a reflowing
       list, with the wide blocks (campaign switch, debug) spanning the full width. */
    #ovSettings .setcols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; align-items: start; }
    #ovSettings .setcols > .choice { margin: 0; height: 100%; box-sizing: border-box; }
    #ovSettings .setcols > *:last-child { grid-column: 1 / -1; }
  }


  /* ── Battle HUD, map view and the smaller overlays ──────────────────────────────────────────────
     Same complaint throughout: sized for a phone and pinned to the top of a 1080px screen. All gated
     on width so portrait is untouched. */
  @media (min-width: 820px) and (pointer: fine) {
    /* the hand was the worst offender — roughly a fifth of the width, unreadable at a glance */
    #app { --hand-h: 190px; }
    #hand .handfan { zoom: 1.7; }
    /* The top bar is sized by --pillh alone — NO zoom. Same reasoning as #maphud below: zoom divides
       the row's available width, so at 1.35 a 1000px window gave the bar 741px of layout to fit the
       pills, the power plate AND the Legend/Menu buttons. setPillH() then bottomed out at its 20px
       floor and the row still overflowed into overflow:hidden, slicing "Rally the Horde" in half and
       leaving Legend sitting on top of it. Measured broken bands were 900-1100 and 1500-1600 — each
       one just above a zoom step-up, which is the tell. */
    #unitinfo { zoom: 1.5; width: min(300px, 40vw); }
    #unitinfo.hasaim { width: min(360px, 46vw); }
    /* toasts and coach marks were phone-sized and bottom-pinned */
    #toast { zoom: 1.6; bottom: 250px; }
    #coach { zoom: 1.5; width: min(80%, 460px); }
    /* map view: bars, buttons and the legend all scale with the window */
    #maplegend { zoom: var(--legzoom, 1.35); }
    /* the deploy screen was hard-capped at 320px regardless of viewport */
    #ovDeploy .deploy-plaque { max-width: 520px; }
  }
  @media (min-width: 1500px) and (pointer: fine) {
    #app { --hand-h: 230px; }
    #hand .handfan { zoom: 2.1; }
    /* no #hud zoom here either — see the note at the 820px breakpoint */
    #unitinfo { zoom: 1.8; width: min(320px, 34vw); }
    #unitinfo.hasaim { width: min(380px, 40vw); }
    #prompt { zoom: 1.7; }
    #toast { zoom: 1.9; bottom: 300px; }
    #coach { zoom: 1.8; }
    #maplegend { zoom: var(--legzoom, 1.5); }
    #ovDeploy .deploy-plaque { max-width: 620px; }
  }
  /* Landscape deploy had its own 320/340 caps that beat the rule above on source order. */
  @media (min-width: 820px) and (pointer: fine) {
    :where(body.o-landscape) #ovDeploy .deploybox[data-view="pre"] .deploy-plaque,
    :where(body.o-landscape) #ovDeploy .deploy-plaque { max-width: 560px; }
  }


  /* Army roster: a single stacked column left most of a widescreen empty and pushed the list under
     the close button. Grid it. */
  @media (min-width: 1100px) and (pointer: fine) {
    #ovRoster .oframe > .choice { margin: 0; }
    #ovRoster .rostergrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; align-items: stretch; }
  }
  @media (min-width: 1700px) and (pointer: fine) { #ovRoster .rostergrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  /* Card viewer: was pinned to the top of the overlay; centre it on both axes and let it grow. */


  /* ── desktop pass, round two ────────────────────────────────────────────────────────────────── */
  /* Battle scrollbars: the board pans by drag, so the bars are pure visual noise over the table. */
  #boardwrap { scrollbar-width: none; -ms-overflow-style: none; }
  #boardwrap::-webkit-scrollbar { width: 0; height: 0; display: none; }
  #mapscroll { scrollbar-width: none; }
  #mapscroll::-webkit-scrollbar { width: 0; height: 0; display: none; }

  @media (min-width: 820px) and (pointer: fine) {
    /* Toasts were floating mid-screen over the board. Park them just under the top bar, which is
       where the eye already is for CP/HQ/objective changes. --medaltop is set by setPillH() to the
       real measured height of the HUD, so this tracks the bar even when it wraps. */
    #toast { top: calc(var(--medaltop, 64px) + 14px); bottom: auto; }
    /* Scale these with ZOOM, not transform. transform: scale() grows the pixels but leaves the layout
       box at its old size, so the unit panel never grew to fit its own buttons — the name clipped to
       "Riflema" and Cancel/Rest spilled outside the frame. zoom scales the layout too. */
    #prompt { zoom: 1.45; }
    /* tile / node inspect: doubled, and centred rather than pinned to the top */
    #ovInspect > .choice { zoom: 1.9; }
  }
  @media (min-width: 1500px) and (pointer: fine) {
    #ovInspect > .choice { zoom: 2.2; }
  }
  /* Deck view fills the screen instead of sitting in a narrow column. */
  @media (min-width: 1100px) and (pointer: fine) {
    #ovDeck .oframe:not(.menu) { max-width: min(1500px, 92vw); }
    #ovDeck .cardgrid, #ovDeck .deckgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  }


  /* Card view actions on ONE row. They were split across two (keep above, play/return below) because
     the panel used to be phone-narrow; with the widened desktop panel there is room for all three side
     by side. Still wraps, so a genuinely narrow screen stacks them as before. */
  .cardfullbtns { display: flex; gap: 10px; justify-content: center; align-items: center;
    flex-wrap: wrap; margin-top: 12px; }


  /* Generals progression: each commander's unlocks get their own grid rather than one centred column. */
  @media (min-width: 1100px) and (pointer: fine) {
    #ovProg .proggrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px;
      align-items: stretch; }
    #ovProg .proggrid > .achrow.prog { width: 100%; max-width: none; margin: 0; }
    /* Name on its own line inside a grid cell. Sharing one row with the kind and gate chips squeezed it
       until it ellipsised to "B.." — the unlock name is the part you actually need to read. */
    #ovProg .proggrid .pgtop { flex-wrap: wrap; row-gap: 2px; }
    #ovProg .proggrid .pgtop .an { flex: 1 1 100%; min-width: 0; overflow: visible; text-overflow: clip; white-space: normal; }
  }


  .bihold { margin-top: 4px; font: 700 12px var(--f-head); letter-spacing: .3px; color: #cbbf98; }
  .bihold.you { color: #74b4d8; } .bihold.enemy { color: #d76b5d; }


  /* Map top bar: the stats were flat CSS chips (#2a2c1f with a 1px border) sitting on an ornate
     screen — the only UI in the game not on a real plate. nsplaque is the general-purpose plate the
     drive meter already uses; the battle bar's .bpill needs per-pill art, so this is the container
     that actually generalises. Desktop only. */
  @media (min-width: 820px) and (pointer: fine) {
    #maphud .maprow { gap: 6px 12px; }
    #maphud .maprow .pill {
      background: url(assets/ui/nsplaque.png) center / 100% 100% no-repeat;
      border: none; border-radius: 0; box-shadow: none;
      padding: 7px 18px; line-height: 1.15;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.5));
    }
  }


  /* Map node popup: it inherits the overlay zoom, but the node art and its choice blocks were still
     drawn at handset scale on a 1080p screen. Roughly double it. */
  @media (min-width: 820px) and (pointer: fine)  { #ovNode > *:not(.ovclose) { zoom: 1.5; } }
  @media (min-width: 1500px) and (pointer: fine) { #ovNode > *:not(.ovclose) { zoom: 1.85; } }


  /* Daily plate type: bigger only where there is a mouse. Raising the shared landscape clamp pushed the
     text past the plate on a landscape PHONE, which uses the same rule — Daily Commission wrapped onto
     two lines and the blurb ran under the PLAY button. */
  @media (min-width: 1100px) and (pointer: fine) {
    :where(body.o-landscape) .oframe.menu .menutop > .choice { font-size: clamp(11px, calc(var(--mw, 940px) * 0.0168), 28px); }
  }


  /* The key: Counters is the legend FOR the other blocks, so it reads across the top; everything it
     explains sits below it in two columns. Desktop only — one column is right on a phone. */
  @media (min-width: 1100px) and (pointer: fine) {
    #ovLegend .keycols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 20px; align-items: start; }
    #ovLegend .keycols > .choice { margin: 0; }
    /* spans both columns, and CENTRED within that span — .choice carries a max-width, so without the
       auto margins it just sat at the left edge of the row it was spanning */
    #ovLegend .keycols > .keycounters { grid-column: 1 / -1; text-align: center;
      margin-left: auto; margin-right: auto; }
    #ovLegend .keycols > .keycounters .d { max-width: 62ch; margin-left: auto; margin-right: auto; }
  }


  /* several cards can change in one choice — lay them out side by side, wrapping if there are many */
  .forgecards { display: flex; gap: 16px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
  /* .forgecard is width:100% for the single-card case; inside the flex row that made each card claim
     the whole width and stack. Size to content when there is more than one. */
  .forgecards > .forgecard { width: auto; flex: 0 0 auto; }
  /* the wrapper is sized for ONE card (max-width 340px), so a second card wrapped underneath instead of
     sitting beside it — widen it to fit the cards it is actually carrying */
  .forgewrap:has(.forgecard + .forgecard) { max-width: 720px; }
  @media (min-width: 1100px) and (pointer: fine) {
    .forgewrap { max-width: 420px; }
    .forgewrap:has(.forgecard + .forgecard) { max-width: 880px; }
  }


  /* .ovclose is excluded from the overlay zoom so `position: sticky` keeps working — but that left the
     close/confirm button at its phone size inside a panel scaled up around it. Scale the image to the
     same factor by hand at each step so it reads as one of the buttons rather than a leftover. */
  @media (min-width: 820px)  and (pointer: fine) { .overlay > .ovclose .ibtn img { height: 56px; } }
  @media (min-width: 1100px) and (pointer: fine) { .overlay > .ovclose .ibtn img { height: 63px; } }
  @media (min-width: 1500px) and (pointer: fine) { .overlay > .ovclose .ibtn img { height: 69px; } }
  @media (min-width: 2000px) and (pointer: fine) { .overlay > .ovclose .ibtn img { height: 76px; } }


  /* Map bar: the battle plates need a height, and --pillh is only set while a battle is on screen. */
  #maphud { --pillh: 34px; }
  #maphud .maprow { gap: 4px 7px; }
  /* Desktop packs 14 plates across one row; the last two only fit at the full 66px pill height
     once the gaps come in. Scoped to pointer:fine so phones keep their roomier spacing. */
  @media (pointer: fine) { #maphud .maprow { gap: 4px 5px; } }
  #maphud .mapseed { position: relative; display: inline-block; height: var(--pillh, 34px); flex: 0 0 auto;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  #maphud .mapseed > img { height: 100%; width: auto; display: block; }
  #maphud .mapseed .mapseedval { position: absolute; top: 50%; right: 6%; width: 42%; height: 42%;
