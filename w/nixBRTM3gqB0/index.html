<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Field notes</title>
<style>
  /* The table at night: bronze on near-black, the game's own palette. Single deliberate dark theme. */
  :root { color-scheme: dark; --ground: #14120d; --panel: #1c1912; --panel2: #231f16; --rule: #3a3324; --ink: #ece3c8;
    --muted: #a79d80; --brass: #d7aa4a; --bad: #e07a52; --paid: #7fb3d9; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  #lock { max-width: 460px; margin: 18vh auto; padding: 0 16px; text-align: center; color: var(--muted); }
  #app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .top { grid-column: 1 / -1; position: sticky; top: 0; z-index: 3; background: var(--ground); border-bottom: 1px solid var(--rule);
    padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
  h1 { font: 700 20px/1.2 Georgia, serif; color: var(--brass); margin: 0; letter-spacing: .02em; }
  h2 { font: 700 22px/1.2 Georgia, serif; color: var(--brass); margin: 0 0 12px; }
  h3 { font-size: 16px; margin: 18px 0 6px; }
  .dim { color: var(--muted); font-weight: 400; font-size: 13px; margin: 0; }
  #q { margin-left: auto; min-width: 220px; flex: 0 1 320px; background: var(--panel2); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 4px; padding: 7px 10px; font: inherit; }
  #q:focus { outline: 2px solid var(--brass); outline-offset: 1px; }
  nav { position: sticky; top: 58px; align-self: start; max-height: calc(100vh - 58px); overflow-y: auto; padding: 12px 8px 24px 16px;
    display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--rule); }
  nav a { color: var(--ink); text-decoration: none; padding: 5px 8px; border-radius: 3px; font-size: 14px; }
  nav a:hover, nav a.on { background: var(--panel2); color: var(--brass); }
  main { padding: 16px 20px 80px; min-width: 0; }
  section { margin-bottom: 36px; scroll-margin-top: 70px; }
  .tw { overflow-x: auto; border: 1px solid var(--rule); border-radius: 4px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th { text-align: left; background: var(--panel2); color: var(--brass); font-weight: 600; position: sticky; top: 0; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  tr:nth-child(even) td { background: #18150f; }
  td:first-child { white-space: nowrap; }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 3px; border: 1px solid var(--rule); color: var(--muted);
    white-space: nowrap; margin: 1px 0; }
  .tag.paid { color: var(--paid); border-color: #33506a; }
  .tag.bad { color: var(--bad); border-color: #6b3524; }
  .card-row { background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 4px 14px 10px; margin-bottom: 12px; }
  .tele { color: var(--muted); font-style: italic; margin: 0 0 6px; }
  dl.kv { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 4px 14px; margin: 0; }
  .kvr { display: contents; }
  .kvr.hid { display: none; }
  dt { color: var(--muted); } dd { margin: 0; }
  .rk { color: var(--brass); font-size: 12px; }
  .rs { display: grid; grid-template-columns: repeat(2, max-content); gap: 0 10px; font-size: 12.5px; }
  .rs span { white-space: nowrap; color: var(--muted); }
  .rs span.up { color: #9fd18a; font-weight: 600; }   /* changed since rank 1 */
  .opt { padding: 2px 0; } .opt + .opt { border-top: 1px dashed var(--rule); }
  .hid { display: none; }
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; }
    .top { padding: 10px 16px; } #q { margin-left: 0; flex: 1 1 100%; }
    nav { position: sticky; top: 0; flex-direction: row; overflow-x: auto; max-height: none; border-right: 0; border-bottom: 1px solid var(--rule);
      padding: 6px 16px; background: var(--ground); z-index: 2; }
    nav a { white-space: nowrap; }
    main { padding: 14px 16px 60px; }
    .top { position: static; }
    /* Phone: each row becomes a small card, one labelled line per column, instead of a table too wide to read. */
    .tw { border: 0; overflow: visible; }
    table, tbody, tr, td { display: block; width: 100%; }
    thead { display: none; }
    tr { border: 1px solid var(--rule); border-radius: 4px; margin-bottom: 8px; padding: 6px 10px; background: var(--panel); }
    tr:nth-child(even) td { background: none; }
    td { border: 0; padding: 2px 0; display: grid; grid-template-columns: 84px 1fr; gap: 8px; white-space: normal; }
    td::before { content: attr(data-l); color: var(--muted); font-size: 12px; }
    td:first-child { grid-template-columns: 1fr; font-size: 16px; padding-bottom: 4px; white-space: normal; }
    td:first-child::before { display: none; }
    td:empty { display: none; }
    dl.kv { grid-template-columns: 1fr; gap: 0 0; } dd { margin-bottom: 6px; }
  }
</style>
</head>

    e.preventDefault(); document.querySelector(a.getAttribute('href'))?.scrollIntoView({ behavior: 'smooth' });
  }));
  const links = [...document.querySelectorAll('nav a')];
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) links.forEach(l => l.classList.toggle('on', l.getAttribute('href') === '#' + en.target.id)); }), { rootMargin: '-40% 0px -55% 0px' });
  document.querySelectorAll('section').forEach(s => io.observe(s));
  // One box filters every table row and every card block, and hides sections left empty.
  const q = document.getElementById('q');
  q.addEventListener('input', () => {
    const t = q.value.trim().toLowerCase();
    // Filterable items: table rows, card blocks, and rule lines that are not inside a card block.
    const items = el => [...el.querySelectorAll('tbody tr, .card-row, .kvr')].filter(r => !(r.classList.contains('kvr') && r.closest('.card-row')));
    items(document).forEach(r => r.classList.toggle('hid', !!t && !r.textContent.toLowerCase().includes(t)));
    document.querySelectorAll('.kvg').forEach(g => g.classList.toggle('hid', !!t && items(g).every(r => r.classList.contains('hid'))));
    document.querySelectorAll('section').forEach(s => {
      const its = items(s);
      s.classList.toggle('hid', !!t && (its.length === 0 || its.every(r => r.classList.contains('hid'))));
    });
  });
