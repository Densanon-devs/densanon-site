  renderBoard(); renderPrompt();

  if (r.msg) toast(r.msg);

  await afterAction(r);

// Portrait: pick ONE height for every battle pill so the row-1 pills (+ objective) span the
// width and share a uniform height. Wide screens cap at 34px and space-between spreads them.
// battles with no enemy base to raze: a boss fight (the boss pill stands in) or an objective that
// deletes the base entirely (escape / escort / bastion / hunt / spire). Hide the BASES pill for these.
const _NO_BASE_OBJ = new Set(['escape', 'escort', 'bastion', 'hunt', 'spire']);
function _noBaseBattle() { return !!(typeof S !== 'undefined' && S && (S.boss || (S.objective && _NO_BASE_OBJ.has(S.objective.kind)))); }
const _PILL_ASP = { cp:2.19, hq:2.14, bases:2.23, troops:1.97, survive:2.18, hold:2.56, waves:2.47 };   // compact _p plates (portrait)
const _PILL_ASP_L = { cp:3.47, hq:3.43, bases:3.35, troops:3.34, survive:3.49, hold:3.66, waves:2.84 };  // wide labeled plates (landscape)
function setPillH() {
  const el = document.documentElement;
  const mm = window.matchMedia;
  if (!S || !S.board || !mm) { el.style.removeProperty('--pillh'); return; }
  const hw = document.getElementById('hudwrap');   // pin the floating medal overlay right under the real top-bar height (varies when it wraps)
  if (hw) el.style.setProperty('--medaltop', hw.offsetHeight + 'px');
  const ok = S.objective && S.objective.kind;
  if (_isPortrait()) {
    // portrait: the 4 stat pills (+ objective) alone on one row — height that spans the full width.
    let sum = _PILL_ASP.cp + _PILL_ASP.hq + _PILL_ASP.troops, n = 3;
    if (!_noBaseBattle()) { sum += _PILL_ASP.bases; n++; }   // BASES pill is hidden when there's no base to pursue
    if (ok === 'survive') { sum += _PILL_ASP.survive; n++; }
    else if (ok === 'hold') { sum += _PILL_ASP.hold; n++; }
    else if (ok === 'bastion') { sum += _PILL_ASP.waves; n++; }
    const avail = Math.max(240, window.innerWidth) - 54 - (n - 1) * 4;   // minus side padding (incl. gear) + inter-pill gaps
    el.style.setProperty('--pillh', Math.max(24, Math.min(40, avail / sum)).toFixed(1) + 'px');
    return;
  }
  // landscape: the pills + power gauge share ONE bar with the Legend/Menu buttons and the gear, and
  // the statline clips (overflow:hidden) if it's too wide. Rather than GUESS the button widths (they
  // are wide labeled image buttons), MEASURE the real fixed elements after render and give the leftover
  // width to the scaling plates so nothing — especially the power gauge — ever gets cut off.
  const hud = document.getElementById('hud');
  if (!hud) { el.style.removeProperty('--pillh'); return; }
  const scalers = [...hud.querySelectorAll('.bpill, .objhold, .powplate')];   // plates whose width = aspect × --pillh
  if (!scalers.length) { el.style.removeProperty('--pillh'); return; }
  let aspSum = 0;
  for (const s of scalers) {
    const img = s.querySelector('img.pl-l') || s.querySelector('img');
    aspSum += (img && img.naturalWidth > 0 && img.naturalHeight > 0) ? img.naturalWidth / img.naturalHeight : 3.5;
  }
  const cs = getComputedStyle(hud);
  const padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);   // includes gear + notch insets
  let fixed = 0;
  const hb = hud.querySelector('.hudbtns');
  fixed += hb ? (hb.getBoundingClientRect().width || 290) : 290;     // Legend + Menu labeled buttons (measured)
  for (const c of hud.querySelectorAll('.foechip, .statline > .stat')) fixed += c.getBoundingClientRect().width || 0;   // boss/objective text chips + A# tag (don't scale)
  fixed += 8 * (scalers.length + 2);                                // inter-item + surrounding gaps
  const avail = hud.clientWidth - padX - fixed;
  el.style.setProperty('--pillh', Math.max(20, Math.min(34, avail / aspSum)).toFixed(1) + 'px');
}

function showPillInfo(key) {

// ── board + table layout (shared by renderBoard AND live pinch-zoom so the table always scales with
// the grid — pieces printed on the table). Sizes #board padding + the table background from cellPx. ──
function layoutBoard() {
  const b = S && S.board; if (!b) return;
  const board = $('#board'), wrap = $('#boardwrap'); if (!board || !wrap) return;
  // Everything this function writes (grid size, --cell, #board padding, the wood-table background size
  // + position) is a pure function of the grid dims, the zoom (cellPx/minCellPx) and the viewport. NONE
  // of those change when a unit merely moves — so on a large, fully-revealed map, re-setting the giant
  // table backgroundSize/Position every single action forced a full background re-rasterize each move,
  // which is what glitched the screen. Skip the DOM writes entirely when the inputs are unchanged.
  const sig = b.width + 'x' + b.height + '@' + cellPx + '/' + minCellPx + ':' + wrap.clientWidth + 'x' + wrap.clientHeight;
  if (layoutBoard._sig === sig) return;
  layoutBoard._sig = sig;
  board.style.gridTemplateColumns = `repeat(${b.width}, var(--cell))`;
  document.documentElement.style.setProperty('--cell', cellPx + 'px');
  // pad #board so the wood fills the viewport at min zoom (table edge = screen edge) and grows past it
  // when zoomed in (pan). At min zoom the grid fits (fitCell), so padding centres it and fills the edges.
  const gridW = b.width * cellPx, gridH = b.height * cellPx;   // grid gap is 0 → this is the exact rectangle
  const m = Math.round(cellPx * 1.2);
  const cw = wrap.clientWidth, ch = wrap.clientHeight;
  const availH = ch - HAND_CLEAR;   // board area above the hand fan
  // ── table locked to the pieces (PURE lockstep) ──────────────────────────────────────────────
  // The table is STRICTLY proportional to the grid: table = (min-zoom cover) × (cellPx / minCellPx).
  // Both the grid (cols·cellPx) and the table are linear in cellPx, so their ratio is constant at every
  // zoom — the wood and the pieces magnify at the exact same rate, as if the pieces sit ON the table.
  const zoomF = cellPx / (minCellPx || cellPx);
  const tblAR = 1200 / 900;   // table image is horizontal (w/h) in BOTH orientations — a wide table covers the portrait viewport edge-to-edge
  const covW = cw, covH = ch + HAND_CLEAR;   // min-zoom table covers the viewport (a hand taller so no gap by the cards)
  let vW, vH;
  if (covW / covH > tblAR) { vW = covW; vH = covW / tblAR; } else { vH = covH; vW = covH * tblAR; }
  // Table = the lockstep viewport-cover, but NEVER smaller than the grid plus a full wood border. A tall
  // map (grid nearly as tall as the viewport) used to leave only HAND_CLEAR/2 of wood, which the padding
  // math then spent entirely on hand-clearance — padTop fell to 0 and the grid's top row sat flush on the
  // table edge, so scrolling up broke the board free of the wood. Forcing tblH ≥ gridH + 2·m + HAND_CLEAR
  // (and tblW ≥ gridW + 2·m) guarantees woodY ≥ m + HAND_CLEAR/2, so there's always an m-wide wood frame
  // on every side and the box can never exceed the table.
  const tblW = Math.max(vW * zoomF, gridW + 2 * m);
  const tblH = Math.max(vH * zoomF, gridH + 2 * m + HAND_CLEAR);
  // #board padding: centre the grid on the table (so it sits in the wood with an even border), and CAP
  // the pan margin to that wood border so you can never scroll past the table edge — no dark surround,
  // without inflating the table (which would break lockstep). Bias the grid up by the hand's height so
  // it clears the cards at min zoom.
  const woodX = Math.max(0, (tblW - gridW) / 2);            // wood border on each side of the grid
  const woodY = Math.max(0, (tblH - gridH) / 2);

  if (gridH >= availH) { padTop = Math.min(m, Math.max(0, woodY - HAND_CLEAR / 2)); padBot = Math.min(m + HAND_CLEAR, woodY + HAND_CLEAR / 2); }
  else { padTop = Math.round((availH - gridH) / 2); padBot = Math.max(HAND_CLEAR, ch - gridH - padTop); }
  board.style.padding = padTop + 'px ' + padX + 'px ' + padBot + 'px';
  // centre the table on the #board box so it always covers the scrollable area (grid + its capped
  // padding). Box ≤ table by construction, so the table fully backs every pannable position.
  const cx = (gridW + 2 * padX) / 2, cy = (gridH + padTop + padBot) / 2;

        const pv = cmdOpts.preview && cmdOpts.preview[c.u.id];   // show what this attack would do
        if (pv) glyph += `<span class="dmgprev${pv.lethal?' kill':''}">${pv.lethal?'✕':'−'+pv.dmg}</span>`;
      }
    } else if (legal) {
      if (legal.kind === 'tiles' && legal.set.has(c.x + ',' + c.y)) hl = ' legal';
      else if ((legal.kind === 'units' || legal.kind === 'enemies') && c.u && legal.set.has(c.u.id))
        hl = ' legal' + (legal.kind === 'enemies' ? ' foe' : '');
      else if (sel !== null) cls += ' fade';
    }
    clsArr.push(cls + hl);
    innerArr.push(`${glyph}${stormfx}${fogFor(c)}${objring}`);
  }
  // incremental paint: rebuild the whole board only when the grid itself changes (new battle / resize);
  // otherwise mutate ONLY the cells whose class or contents actually changed. On a ~900-tile act-2 map
  // this turns a full 900-node reparse+relayout every action into a handful of touched cells — the
  // single biggest render cost, and the main source of big-map jank. data-x/y + onclick never change for
  // a given cell index (serialize emits cells in a fixed y,x order), so only class + innerHTML are updated.
  const sig = b.width + 'x' + b.height + ':' + b.cells.length;
  const cache = renderBoard._cache, els = renderBoard._els;
  if (!cache || cache.sig !== sig || !els || els.length !== b.cells.length || (els[0] && els[0].parentElement !== board)) {
    board.innerHTML = b.cells.map((c, i) => `<div class="${clsArr[i]}" data-x="${c.x}" data-y="${c.y}" onclick="tapCell(${c.x},${c.y})">${innerArr[i]}</div>`).join('');
    renderBoard._els = [...board.querySelectorAll('.cell')];
  } else {
    const oc = cache.cls, oi = cache.inner;
    for (let i = 0; i < b.cells.length; i++) {
      const el = els[i]; if (!el) continue;
      if (clsArr[i] !== oc[i]) el.className = clsArr[i];
      if (innerArr[i] !== oi[i]) el.innerHTML = innerArr[i];
    }
  }
  renderBoard._cache = { sig, cls: clsArr, inner: innerArr };
  // Only touch scroll when it actually shifted. A bare `scrollLeft = x` still forces a synchronous
  // scroll + repaint even when the value is unchanged — a needless per-move paint (and tearing trigger).
  if (wrap.scrollLeft !== sx) wrap.scrollLeft = sx;
  if (wrap.scrollTop !== sy) wrap.scrollTop = sy;
}

const NEED_LBL = {own_unit:'your unit', enemy:'an enemy', any_unit:'any unit', tile:'a tile'};
function cardMarkup(c, extra) {

    ${framedInner(c, HAND_CARD_W)}

const HAND_STEP = 44;                 // px between neighbouring cards in the fan
const HAND_CARD_W = 120;              // display width of a framed hand card (for in-frame font sizing)
let handFocus = 0, handDrag = 0, _handSig = '';
let _cardFullAt = 0;   // guard: ignore the ghost-click that follows the tap which opened the full-card view
function renderHand() {
  const cards = S.hand || [];
  const n = cards.length;
  const sig = cards.map(c => c.i).join(',');
  if (sig !== _handSig) { _handSig = sig; handFocus = n ? Math.floor((n - 1) / 2) : 0; }  // recenter on a fresh hand
  handFocus = Math.max(0, Math.min(handFocus, Math.max(0, n - 1)));
  handDrag = 0;
  const fan = cards.map(c => cardMarkup(c, '')).join('');
  $('#hand').innerHTML = n ? `<div class="handfan">${fan}</div>` : '<div class="dim" style="padding:8px">no cards in hand</div>';
  layoutHand();
}
// coalesce rapid pointermove layout calls into one per animation frame
let _layoutRAF = 0;
function scheduleLayout() {
  if (_layoutRAF) return;
  _layoutRAF = requestAnimationFrame(() => { _layoutRAF = 0; layoutHand(); });
}
// Position every card relative to the focused one: the centre card is straight up &
// on top; the rest tilt down and overlap outward like a fanned pyramid.
function layoutHand() {
  const wrap = $('#hand'), els = wrap ? [...wrap.querySelectorAll('.card')] : [];
  const n = els.length; if (!n) return;
  handFocus = Math.max(0, Math.min(handFocus, n - 1));
  const f = handFocus + handDrag;
  els.forEach((el, idx) => {
    if (el.classList.contains('lift')) return;            // mid-swipe: leave it under finger control
    const d = idx - f, ad = Math.abs(d), centre = ad < 0.5;
    const tx = d * HAND_STEP;
    const ty = ad * 15;                                   // neighbours droop down; the centre is the apex
    const rot = Math.max(-40, Math.min(40, d * 7));       // tilt grows with distance
    el.style.transform = `translateX(calc(-50% + ${tx}px)) translateY(${ty}px) rotate(${rot}deg) scale(${centre ? 1.05 : 1})`;

}
function handLowered() {

}
// transient "peek" — drops the hand to a sliver while you pick a target on the board

// Tap a card to bring it to centre (tap the centred one for its full view). Swipe a card
// UP to play it. Drag left/right to rotate the whole fan (like feeding cards in from the side).
let _cardGesture = null;
function cardDown(e, i) {
  const el = e.currentTarget;
  const pos = [...el.parentNode.children].indexOf(el);
  _cardGesture = { i, el, pos, pid: e.pointerId, x: e.clientX, y: e.clientY,
                   axis: null, dx: 0, dy: 0, focus0: handFocus, min: handLowered() };
  const g = _cardGesture;
  g.lpTimer = setTimeout(() => {                          // hold still → open the big card
    if (_cardGesture === g && !g.axis && !g.min) { g.longPressed = true; showCardFull(i); }
  }, 420);
}
function cardMove(e, i) {
  const g = _cardGesture;
  if (!g || g.i !== i || g.min) return;

  if (!g.axis) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;     // wait for a clear direction
    clearTimeout(g.lpTimer);                              // a drag cancels the long-press
    g.axis = Math.abs(dy) > Math.abs(dx) ? 'y' : 'x';
    try { g.el.setPointerCapture(g.pid); } catch (_) {}   // keep events as the finger leaves the card
    if (g.axis === 'y') { $('#hand').classList.add('lifting'); g.el.classList.add('lift'); }

    g.dx = dx;
    handDrag = -dx / HAND_STEP;
    scheduleLayout();                                     // coalesce to one layout per frame
    return;
  }
  g.dy = dy;                                              // pull the card up off the deck
  const up = Math.max(0, -dy), lift = Math.min(up, 170);
  const baseTx = (g.pos - handFocus) * HAND_STEP;
  g.el.style.transform = `translateX(calc(-50% + ${baseTx}px)) translateY(${-lift}px) scale(${1 + lift / 700})`;

function cardUp(e, i) {

  g.el.classList.remove('lift'); g.el.style.opacity = '';

  if (g.min) { handDrag = 0; layoutHand(); return; }      // mid-target peek: ignore
  if (g.axis === 'x') {                                   // snap the fan to the nearest card
    const n = (S.hand || []).length;
    handFocus = Math.max(0, Math.min(g.focus0 + Math.round(-g.dx / HAND_STEP), n - 1));
    handDrag = 0; layoutHand();
    if (handFocus !== g.focus0) Sfx.play('tap');

  }
  if (g.axis === 'y') {                                   // pulled up far enough → play it
    const up = g.y - e.clientY;
    if (up > 55) {

function showCardFull(i) {

// ── interaction: play cards (CP) OR command your units (free, AP) ──
function isMine(u) { return u && (u.side === 'you' || u.side === 'hq_you'); }
function unitById(id) { const c = S.board.cells.find(c => c.u && c.u.id === id); return c ? c.u : null; }

async function tapCard(i) {
  disarmEnd();
  deselectCmd();
  const card = S.hand[i];
  if (card.curse) { toast('Curse — unplayable. Scrap it at a Workshop.'); return; }
  if (!card.aff) { handDrag = 0; layoutHand(); return; }   // unaffordable — snap back silently (already greyed)
  sel = i; picked = []; legal = null;
  if (card.needs.length === 0) { await play(); return; }
  await fetchLegal();
  setHandPeek(true);           // lower the hand so the battlefield is clear to pick a target
  renderBoard(); renderHand(); renderPrompt();
}

async function fetchLegal() {
  const r = await api('/api/legal', {hand_index: sel, picked});
  if (r.kind === 'tiles') legal = {kind:'tiles', set:new Set(r.tiles.map(t=>t[0]+','+t[1]))};
  else if (r.kind === 'units' || r.kind === 'enemies') legal = {kind:r.kind, set:new Set(r.ids)};
  else legal = null;
}

async function tapCell(x, y) {
  const cell = S.board.cells.find(c => c.x===x && c.y===y);
  if (!cell || cell.t === 'void') return;   // off-battlefield void is inert
  // (0) a POWER is armed → fire it on the chosen own-unit, else cancel
  if (powerArm) {
    if (cell.u && legal && legal.set.has(cell.u.id)) { await firePower(cell.u.id); return; }
    powerArm = false; legal = null; renderBoard(); renderPrompt();
    toast('power cancelled'); return;
  }
  // (1) a CARD is selected → card targeting
  if (sel !== null) {
    if (!legal) return;
    const card = S.hand[sel];
    const step = card.needs[picked.length];
    let val = null;
    if (step === 'tile') { if (!legal.set.has(x+','+y)) return; val = [x, y]; }
    else { if (!cell.u || !legal.set.has(cell.u.id)) return; val = cell.u.id; }
    picked.push(val);
    if (picked.length === card.needs.length) { await play(); return; }
    await fetchLegal(); renderBoard(); renderPrompt();
    return;
  }
  // (2) a UNIT is selected → move / attack / switch to another own unit; anything else cancels
  if (cmd !== null) {
    if (cmdOpts.moves.has(x+','+y)) { await doMove(x, y); return; }
    if (cell.u && cmdOpts.attacks.has(cell.u.id)) { await doAttack(cell.u.id); return; }
    if (isMine(cell.u)) { await selectUnit(cell.u.id); return; }   // tap another own unit → switch
    deselectCmd(); renderBoard(); renderPrompt();
    return;
  }
  // (3) nothing selected → tap your unit to command, else inspect
  if (isMine(cell.u)) { await selectUnit(cell.u.id); return; }
  if (cell.st) { showStormInfo(cell); return; }   // storm tile → describe the storm AND what's under it
  if (cell.u) showInspect(cell.u); else if (cell.t) showTerrain(cell.t);
}
// interactable tokens sit ON open ground — they are NOT a terrain type
const ONGROUND = { crate:'a supply crate', workshop:'a workshop', node:'a command node', escape:'the exit' };
function showStormInfo(c) {
  const under = [];
  under.push(ONGROUND[c.t] ? `${ONGROUND[c.t]} on <b>open ground</b>`
    : (c.t && c.t !== 'plain' && c.t !== 'void') ? `terrain is <b>${TERR_NAME[c.t] || c.t}</b>`
    : `<b>open ground</b>`);
  if (c.u) under.push(`${isMine(c.u) ? 'your' : 'an enemy'} <b>${(CLASS_INFO[c.u.cls] || { n: c.u.cls }).n}</b> stands here`);
  _infoPopup(`${si('storm', 15)} Storm`, `A drifting storm. Its <b>wall batters any unit</b> caught in it each round — but the <b>eye at the centre is calm</b>, so shelter there. It rolls over <b>anything</b>, even rock, and shifts every turn. Under this tile: ${under.join(', ')}.`);
}

async function selectUnit(id, center = true) {
  disarmEnd();
  const o = await api('/api/unit_options', {unit_id: id});
  if ((o.ap || 0) <= 0) { const u = unitById(id); deselectCmd(); if (u) showInspect(u); return; }
  cmd = id;
  cmdOpts = {moves:new Set(o.moves.map(t=>t[0]+','+t[1])), attacks:new Set(o.attacks), ap:o.ap, preview:o.preview||{}};
  sel = null; legal = null;
  setHandPeek(true);           // clear the hand out of the way while commanding this unit
  renderBoard(); renderHand(); renderPrompt();
  // Only lift the unit clear of the bottom band on a DELIBERATE tap. After a move/attack we keep the
  // unit selected for its remaining actions but must NOT yank the camera — the player has already
  // scrolled the map where they want it, and centerCell would pop the view back to the unit.
  if (center) { const cc = S.board.cells.find(c => c.u && c.u.id === id); if (cc) centerCell(cc.x, cc.y); }
}
function deselectCmd() { cmd = null; cmdOpts = {moves:new Set(), attacks:new Set(), ap:0}; setHandPeek(false); }
// drop a live unit selection when navigating away (menu / end turn / opening an overlay)
function _dropCmd() { if (cmd !== null) { deselectCmd(); renderBoard(); renderPrompt(); } }
// scroll a board cell up into the clear area if it's hidden under the bottom UI band
function centerCell(x, y) {
  const wrap = $('#boardwrap');
  const cell = wrap && wrap.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`);
  if (!cell) return;
  const wr = wrap.getBoundingClientRect(), cr = cell.getBoundingClientRect();
  const band = 160;                                   // prompt + peeked hand at the bottom
  if (cr.bottom < wr.bottom - band && cr.top > wr.top + 44) return;   // already clearly visible
  const mid = (cr.top + cr.bottom) / 2 - wr.top + wrap.scrollTop;
  const aim = Math.max(70, (wrap.clientHeight - band) / 2);
  wrap.scrollTo({ top: Math.max(0, mid - aim), behavior: 'smooth' });

async function doMove(x, y) {
  disarmEnd();

  disarmEnd();
  const id = cmd;
  const r = await api('/api/command_dump_ap', {unit_id: id});
  if (!r.ok) { toast(r.msg); return; }
  if (r.msg) toast(r.msg);

async function reselect(id) {
  if (S.result) { deselectCmd(); return; }

async function play() {
  const hi = sel;

  else {
    Sfx.play('card');
    // the played card left the hand → shift the kept-★ indices so the star stays on the same card
    retain = new Set([...retain].filter(x => x !== hi).map(x => x > hi ? x - 1 : x));
  }

  await afterAction(r);   // renders, plays events, then any popup + win/defeat

// Replay granular move/attack events on the board so you SEE what happened.
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function drawArrow(a, b, opt) {

async function animateEvents(events, finalR) {
  if (!events || !events.length) return;
  const my = ++animGen;          // invalidate any prior in-flight replay
  const arrowDwell = events.length > 16 ? 130 : 210;
  const fs = finalR && (finalR.state || finalR);
  const fb = fs && fs.board;
  const cellAt = (x, y) => S.board && S.board.cells.find(c => c.x === x && c.y === y);
  const findUnit = (id) => (S.board && S.board.cells.find(c => c.u && c.u.id === id)) || null;
  const finalUnit = (id) => { const fc = fb && fb.cells.find(c => c.u && c.u.id === id); return fc ? {...fc.u} : null; };
  // events are already fog-filtered to what YOU can see: play them slow enough to
  // follow — ~0.5s each. Only speed up if there's a big visible pile-up.
  const per = events.length > 16 ? Math.max(500, Math.floor(9000 / events.length)) : 500;
  for (const ev of events) {
    if (animGen !== my) return;
    if (ev.t === 'say') { await showBossSay(ev); continue; }        // boss talks
    if (ev.t === 'enemy_card') {                                    // an enemy played a card
      Sfx.play('alarm'); haptic(20);
      if (ev.first && ev.card && localStorage.getItem('dc_reveal_enemy') !== '0') {
        await showEnemyReveal(ev.card);                             // first time seeing it → reveal, click to continue
      } else {
        toast(`⚔ Enemy plays ${ev.name || 'a card'}`);
        await sleep(780);
      }
      continue;
    }
    if (ev.t === 'shot') { playShot(ev); await sleep(arrowDwell); continue; }        // attacker → target
    if (ev.t === 'blast') { await playBlast(ev); await sleep(arrowDwell + 120); continue; }  // impact + fan-out
    const p = ev.to || ev.at;
    if (!p) continue;
    if (ev.t === 'reveal') {                 // Recon / crate Intel — show WHERE it scouted
      const cell = document.querySelector(`.cell[data-x="${p[0]}"][data-y="${p[1]}"]`);
      if (cell) {
        cell.scrollIntoView({behavior: 'smooth', block: 'center', inline: 'center'});
        cell.classList.add('reveal-ping'); setTimeout(() => cell.classList.remove('reveal-ping'), 900);
      }
      Sfx.play('cp'); toast('◎ Intel — area scouted');
      await sleep(650);
      continue;

    if (ev.t === 'move' && ev.id != null) {
      const src = findUnit(ev.id), dst = cellAt(p[0], p[1]);
      if (dst) { const unit = src ? src.u : finalUnit(ev.id); if (src) src.u = null; if (unit) dst.u = unit; }
    } else if (ev.t === 'hit') {
      const tc = (ev.tgt && findUnit(ev.tgt)) || cellAt(p[0], p[1]);
      if (tc && tc.u) { tc.u.hp = Math.max(0, (tc.u.hp || 0) - (ev.dmg || 0)); if (ev.dead) tc.u = null; }
    } else if (ev.t === 'spawn') {
      const c = cellAt(p[0], p[1]);
      if (c) c.u = finalUnit(ev.id) || {id: ev.id, cls: 'rifleman', side: ev.side === 'you' ? 'you' : 'enemy', hp: 1, max: 1};
    } else if (ev.t === 'heal') {
      const c = (ev.id && findUnit(ev.id)) || cellAt(p[0], p[1]);
      if (c && c.u) c.u.hp = Math.min(c.u.max || c.u.hp || 0, (c.u.hp || 0) + (ev.amt || 0));
    }
    renderBoard();
    const cell = document.querySelector(`.cell[data-x="${p[0]}"][data-y="${p[1]}"]`);
    if (cell) {
      const cls = ev.t === 'hit' ? 'fx-hit' : ev.t === 'spawn' ? 'fx-spawn' : ev.t === 'heal' ? 'fx-heal' : 'fx-move';
      cell.classList.add(cls);
      setTimeout(() => cell.classList.remove(cls), per + 200);
      if (ev.t === 'hit') {
        floatDmg(cell, ev.dmg, ev.dead);
        // a ranged hit on YOUR unit → streak from the attacker's tile so you can see where it came from
        // (even an unseen shooter in the fog), since it wouldn't otherwise telegraph with an intent arrow
        if (ev.tgt_you && ev.from && Math.max(Math.abs(ev.from[0] - p[0]), Math.abs(ev.from[1] - p[1])) >= 2) showTracer(ev.from, [p[0], p[1]]);
        if (ev.dead) { Sfx.play('boom'); screenShake(); haptic(55); }
        else { Sfx.play('hit'); haptic(ev.tgt_you ? 35 : 15); }
      } else if (ev.t === 'heal') { floatHeal(cell, ev.amt); Sfx.play('cp'); }
      else if (ev.t === 'spawn' && ev.side === 'you') Sfx.play('deploy');
      else if (ev.t === 'move' && ev.side === 'you') Sfx.play('move');
      else if (ev.t === 'capture' || ev.t === 'steal') Sfx.play('alarm');
      // follow the action — pan the KILL to centre (so a death is never missed,
      // even when it rolls fog back over the tile), and linger a beat longer on it
      cell.scrollIntoView(ev.dead ? {behavior: 'smooth', block: 'center', inline: 'center'}

  const hits    = ev.filter(e => e.t==='hit'   && e.tgt_you);

    kills ? [`Destroyed <b class="red">${kills}</b> of your unit${kills>1?'s':''}`] : [],
    caps  ? [`Captured <b class="red">${caps}</b> outpost${caps>1?'s':''}`] : [],

        ${rows}

        ${fogRows?`${divider('Fog of War styles','var(--gold)')}${fogRows}`:''}

function showInspect(u) {
  Sfx.play('tap');
  const info = CLASS_INFO[u.cls] || {n:u.cls, r:""};
  const rng = u.atk > 0 ? `${u.rmin}-${u.rmax}` : "—";
  const mine = (u.side === 'you' || u.side === 'hq_you');
  const ic = u.boss ? '#c0453a' : mine ? '#4f8fe0'
    : u.side === 'tribe' ? '#b78fd0'
    : (u.side === 'enemy' || u.side === 'hq_enemy') ? '#e0574a' : '#b7b08f';
  const cc = (S.board && S.board.cells) ? S.board.cells.find(c => c.u && c.u.id === u.id) : null;
  const terr = (cc && cc.t) ? cc.t : null;
  const name = u.boss ? u.boss : (u.name ? `${u.rank||''} ${u.name}`.trim() : info.n);
  const sub = u.boss ? 'Act Boss' : (SIDE_LABEL[u.side] || u.side);
  const subname = (u.name && !u.boss) ? `<div class="bisub" style="color:#9a9575;margin-top:2px">${info.n}</div>` : '';
  const chips = [
    `<span class="bichip">${siEm('hp')}<b>${u.hp}/${u.max}</b></span>`,
    `<span class="bichip">ATK <b>${u.atk}</b></span>`,
    `<span class="bichip">RNG <b>${rng}</b></span>`,
    `<span class="bichip">MOVE <b>${u.mv}</b></span>`,
    `<span class="bichip">DEF <b>${u.df}</b></span>`];
  if ((u.apmax||0) > 0) chips.push(`<span class="bichip">Actions <b>${u.ap}/${u.apmax}</b></span>`);
  // rank + XP: show for any unit that can rank — including your fresh rank-1 troops (was gated to lvl>1).
  // Structures (HQ, turrets…) don't rank, so they get nothing. Your units show XP progress toward the
  // next rank; a ranked enemy just shows its rank (enemies don't earn XP you can track).
  const ranks = !(u.tags||[]).includes('structure') && !(u.tags||[]).includes('hq');
  if ((mine && ranks) || (u.lvl||1) > 1) {
    const xpTxt = (mine && ranks)
      ? (u.xp_next!=null ? ` · ${u.xp||0}/${u.xp_next} XP` : ` · max rank`)
      : (u.xp ? ` · ${u.xp} XP` : '');
    chips.push(`<span class="bichip gold">&#9733; Rank <b>${u.lvl||1}/5</b>${xpTxt}</span>`);
  }
  const it = {attack:`${siEm('skirmish')} will attack`, advance:'→ advancing', hold:'· holding',
    steal:`${siEm('coin')} heading for your HQ to rob salvage`, flee:`${siEm('nomad')} fleeing to the edge with your salvage`}[u.intent];
  const intent = u.intent ? `<div class="binote red">Intent: ${it}</div>` : '';
  const flank = (u.flanked === true)
    ? (mine ? `<div class="binote red">△ Flanked — enemy attacks on it hit +2. Pull back or clear one.</div>`
            : `<div class="binote grn">⚔ Flanked — your attacks on it hit +2 (you have it surrounded).</div>`)
    : '';
  const desc = u.boss ? 'A named enemy commander — raze it to win the act. It has a signature mechanic; tap the boss banner up top for its intel.' : info.r;
  const tags = (u.tags||[]).length ? `<div class="bidesc" style="color:#9a9575;font-size:11.5px;margin-top:8px">${(u.tags||[]).join(' · ')}</div>` : '';
  const terrPanel = terr ? `
       <div class="biterr">
         <div class="cell t-${terr} biswatch">${tileInner(terr)}</div>
         <div class="bitx"><b>On ${TERR_NAME[terr]||terr}</b><div class="d">${TERRAIN_INFO[terr]||''}</div></div>
       </div>` : '';
  $('#ovInspect').innerHTML =
    `<div class="biginspect" style="--ic:${ic}">
       <div class="cell ${terr?('t-'+terr):''} bihero">${counterHTML(u)}</div>
       <div class="biname">${name}</div>
       <div class="bisub">${sub}</div>${subname}
       <div class="bistats">${chips.join('')}</div>
       ${desc?`<div class="bidesc">${desc}</div>`:''}
       ${intent}${flank}${tags}${terrPanel}
     </div>
     <div class="ovclose"><button class="ibtn" onclick="closeOv('ovInspect')" aria-label="Close"><img src="assets/ui/btn/close.png" alt="Close"></button></div>`;
  $('#ovInspect').classList.add('show');
}

function showMedals() {
  _dropCmd();

  const coll = (S && S.collection) ? S.collection : [];
  const row = (m, op) => `<div class="choice" onclick="showBigMedal('${m.id}')" style="cursor:pointer;display:flex;align-items:center;gap:12px${op!=null?';opacity:'+op:''}">
    ${medalIcon(m.id, 46)}<div style="flex:1"><b class="gold">${m.name}</b>${m.n>1?` <span class="gold">×${m.n}</span>`:''}
      <div class="d">${m.desc}</div>${m.lifetime?`<div class="d" style="margin-top:2px;color:#8c8770">${siEm('medal')} awarded ${m.lifetime}× all-time</div>`:''}</div><span class="d" style="align-self:center;color:#6f7159">▸</span></div>`;
  // group a list of medals: tier pools 1-3, then Special, then Curses isolated at the bottom
  const grouped = (list, opFn) => {
    if (!list.length) return '';
    const hdr = (label, col) => `<div class="d" style="margin:12px 0 2px;letter-spacing:.5px;color:${col}"><b>${label}</b></div>`;
    const rowsFor = g => g.map(m => row(m, opFn ? opFn(m) : undefined)).join('');

      if (g.length) out += hdr(`LEVEL ${p} POOL`, '#b7b08f') + rowsFor(g);
    }
    const special = list.filter(m => m.special && !m.cursed);      // Field Compass etc.
    if (special.length) out += hdr('SPECIAL', '#7fbfff') + rowsFor(special);
    const curses = list.filter(m => m.cursed);                     // isolated at the bottom
    if (curses.length) out += `<div style="margin-top:6px;border-top:1px solid #5a2c2c;padding-top:2px"></div>`
      + hdr(`CURSES`, '#d76b5d') + rowsFor(curses);

  };
  const activeIds = new Set(active.map(m => m.id));
  $('#ovMedals').innerHTML = oframe(`

      ? ocap('Active this run — run-long modifiers')

  $('#ovMedals').classList.add('show');
}

// ── layout ──
// full zoom-out = the whole map/fog rectangle scaled to fit the screen with a thin wood border.
// This is the zoom-OUT floor (minCellPx): you can't pinch out past the rectangle, only a hair of
// table shows around it. Big battle maps (up to ~36x26) therefore scale DOWN to fit a phone; there
// is no fixed minimum cell size (the old Math.max(16,..) clamp was why large maps overflowed).
// The zoom-OUT FLOOR *is* the board-FILLS-the-table view — that's the most-zoomed-out state, and it's
// where the table is scaled from. You can only zoom IN from here (never out to a tiny whole-map view).
// Cover the viewport: fill the tighter dimension exactly, let the other overflow (pan/zoom in to explore).
function computeMinCell() {
  const w = S.board.width, h = S.board.height;
  const wrap = $('#boardwrap');
  const margin = 6;
  const availW = wrap.clientWidth - margin * 2;
  const availH = wrap.clientHeight - HAND_CLEAR - margin * 2;
  const fill = Math.round(Math.max(availW / w, availH / h));
  minCellPx = Math.max(5, Math.min(150, fill || 22));
  return minCellPx;
}
function fitCell() {                 // open a battle at the floor (board fills the table); zoom IN only
  computeMinCell();
  cellPx = minCellPx;
  document.documentElement.style.setProperty('--cell', cellPx + 'px');
}
// scroll the battlefield so the player camp (your HQ) sits in the middle of the area above the hand fan.
// The board is sized to COVER the viewport (computeMinCell uses max), so it overflows and pans — without
// this a fresh battle opens on the top-left (enemy) corner. Called once per battle on entry.
function centerOnHQ() {
  const wrap = $('#boardwrap'), board = $('#board');
  if (!wrap || !board || !S || !S.board) return;
  let tx, ty;
  const hq = S.board.cells.find(c => c.u && c.u.side === 'hq_you');
  if (hq) { tx = hq.x; ty = hq.y; }
  else {   // no HQ (some modes) → centroid of your units, else board centre-bottom (where you deploy)
    const mine = S.board.cells.filter(c => c.u && (c.u.side === 'you' || c.u.side === 'hq_you'));
    if (mine.length) { tx = mine.reduce((s, c) => s + c.x, 0) / mine.length; ty = mine.reduce((s, c) => s + c.y, 0) / mine.length; }
    else { tx = S.board.width / 2; ty = S.board.height - 1; }
  }
  const cellEl = board.querySelector(`[data-x="${Math.round(tx)}"][data-y="${Math.round(ty)}"]`);
  let cx, cy;
  if (cellEl) { cx = cellEl.offsetLeft + cellEl.offsetWidth / 2; cy = cellEl.offsetTop + cellEl.offsetHeight / 2; }
  else {   // fallback: derive from #board padding + cell size
    const cs = getComputedStyle(board);
    cx = (parseFloat(cs.paddingLeft) || 0) + (tx + 0.5) * cellPx;
    cy = (parseFloat(cs.paddingTop) || 0) + (ty + 0.5) * cellPx;
  }
  const maxL = Math.max(0, board.scrollWidth - wrap.clientWidth);
  const maxT = Math.max(0, board.scrollHeight - wrap.clientHeight);
  wrap.scrollLeft = Math.max(0, Math.min(cx - wrap.clientWidth / 2, maxL));
  wrap.scrollTop = Math.max(0, Math.min(cy - (wrap.clientHeight - HAND_CLEAR) / 2, maxT));
}

  const el = $('#boardwrap') && $('#boardwrap').querySelector(`.cell[data-x="${c.x}"][data-y="${c.y}"]`);
  if (el) { el.classList.remove('locate-ping'); void el.offsetWidth; el.classList.add('locate-ping'); setTimeout(() => el.classList.remove('locate-ping'), 1600); }

        <div class="d armystats"><span class="${u.hp < u.max * 0.35 ? 'red' : 'grn'}">HP ${u.hp}/${u.max}</span><span>AP ${u.ap}/${u.apmax}</span><span class="cyan">ATK ${u.atk}</span><span>DEF ${u.df}</span></div>

     <div class="armylist">${body}</div>`, 'army')
    + `<div class="ovclose"><button class="ibtn" onclick="closeOv('ovArmy')" aria-label="Back"><img src="assets/ui/btn/return.png" alt="Back"></button></div>`;

async function toggleRetain(id) {
  const r = await api('/api/retain', { unit_id: id });
  render(r);
  if (r && r.ok === false && r.msg) toast(r.msg);   // e.g. "you can only retain 6 — release one first"
  showArmy();   // reopen with the updated flags

function setCellPx(px) {
  const wrap = $('#boardwrap'), board = $('#board');
  const cw = wrap ? wrap.clientWidth : 0, ch = wrap ? wrap.clientHeight : 0;
  // anchor the zoom to the viewport centre: remember the content point there (as a fraction of the
  // scrollable size), zoom, then put it back — so pinching grows the table+grid around the middle.
  let fx = 0.5, fy = 0.5;
  if (wrap && board && board.scrollWidth) { fx = (wrap.scrollLeft + cw / 2) / board.scrollWidth; fy = (wrap.scrollTop + (ch - HAND_CLEAR) / 2) / board.scrollHeight; }
  cellPx = Math.max(minCellPx, Math.min(minCellPx * 3, Math.round(px)));   // floor = the board-fills-the-table view; zoom IN up to 3×
  layoutBoard();   // re-size the grid AND the table together (the table scales with every zoom step)
  if (wrap && board && board.scrollWidth) { wrap.scrollLeft = fx * board.scrollWidth - cw / 2; wrap.scrollTop = fy * board.scrollHeight - (ch - HAND_CLEAR) / 2; }
}
function zoom(d) { setCellPx(cellPx + d); }   // desktop / programmatic; layoutBoard handles the table + grid
// pinch-to-zoom the battlefield (two fingers). Single-finger panning still scrolls the board.
function initPinch() {
  const wrap = $('#boardwrap');
  if (!wrap || wrap._pinch) return;
  wrap._pinch = true;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  let base = null;
  wrap.addEventListener('touchstart', e => {
    if (e.touches.length === 2) base = { d: dist(e.touches) || 1, cell: cellPx };
  }, { passive: true });
  wrap.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && base) {
      e.preventDefault();                       // we own the two-finger gesture
      setCellPx(base.cell * (dist(e.touches) / base.d));
    }
  }, { passive: false });
  const clear = e => { if (!e.touches || e.touches.length < 2) base = null; };
  wrap.addEventListener('touchend', clear);
  wrap.addEventListener('touchcancel', clear);
}

$('#end').onclick = endTurn;
initPinch();
window.__boot = () => { _applyOrient(); const p = refresh(); setTimeout(checkForUpdate, 2500); return p; };   // src/main.ts wires the local API, then calls this; returns the refresh promise so callers/tests can await first paint; update check runs once, non-blocking
