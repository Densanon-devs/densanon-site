<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#23271b">
<title>War Table</title>
<style>
  /* ── native app feel (desktop Tauri + mobile Capacitor) ── */
  html, body {
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
    touch-action: manipulation; position: fixed; inset: 0; overflow: hidden;
  }
  /* honor notches / rounded corners — edge-to-edge but keep UI clear of cutouts */
  /* top bars keep clear of the status bar AND a landscape notch (iOS/Android edge-to-edge) */
  #ctrl, #mapctrl { padding-bottom: max(4px, env(safe-area-inset-bottom)); }
  #setBtn { top: max(6px, env(safe-area-inset-top)); right: max(6px, env(safe-area-inset-right)); }
  input, textarea { user-select: text; -webkit-user-select: text; }
  :root {
    --cell: 22px;
    --felt: #23271b;          /* table surround (dark olive) */
    --panel: #1c1f16;         /* HUD / control panels */
    --edge: #46422e;          /* sepia panel borders */
    --ink: #241d10;           /* map grid ink */
    --paper: #d9d3bf;         /* parchment text */
    --f-you: #5f8bc0;         /* faction counter fills */
    --f-enemy: #c0503f;
    --f-tribe: #83924a;
    --f-neutral: #928c7e;
    --gold: #cda94e;
    --f-ui: system-ui, "Segoe UI", Roboto, sans-serif;
    --f-head: "Arial Narrow", "Roboto Condensed", "Oswald Local", system-ui, sans-serif;
    --f-num: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--felt); color: var(--paper);
    font-family: var(--f-ui); overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; position: relative; --hand-h: 120px; }
  #fxlayer { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9; overflow: visible; }

  /* HUD */
  /* the whole HUD is ONE horizontal bar (scrolls if it can't fit); medals live below it */
  /* battle top wrapper — same menu-container bar treatment as the map (rust texture + barbed-wire edge) */
  #hudwrap { position: relative; padding-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.5);
    background: url(assets/ui/ornate/hbarB.png) center bottom/auto 18px repeat-x,
                url(assets/ui/ornate/p05_mirror.png) center/300px 290px repeat; }
  #hud { padding: max(4px, env(safe-area-inset-top)) calc(42px + max(8px, env(safe-area-inset-right))) 4px max(8px, env(safe-area-inset-left));
    background: none; border-bottom: none; font-size: 12px;
    display: flex; flex-wrap: nowrap; align-items: center; gap: 6px; overflow: hidden; }   /* one bar, never scrolls */
  #hud .statline { flex: 1 1 auto; min-width: 0; flex-wrap: nowrap; overflow: hidden; gap: 1px 7px; }
  /* the run label (general · act · node · turn) is the least critical bit — it shrinks
     and ellipsises first so the resources, gauge and ⋯ menu always stay visible */
  .hudmeta { flex: 1 1 auto; min-width: 16px; overflow: hidden; text-overflow: ellipsis; }
  #hud .statline > *:not(.hudmeta) { flex: 0 0 auto; }   /* resources / gauge / chips keep their size */
  /* relics — earned medals in their own row just UNDER the top bar (StS-style), acquisition order */
  /* medals float as a fully transparent overlay over the TOP of the board (no felt band, no row of
     its own) — pinned just under the top bar via --medaltop (measured = hudwrap height). */
  #medalbar { position: absolute; left: 0; right: 0; top: var(--medaltop, 44px); z-index: 6;
    display: flex; flex-wrap: wrap; gap: 3px; margin: 0; pointer-events: none;
    padding: 3px max(8px, env(safe-area-inset-right)) 3px max(8px, env(safe-area-inset-left));
    background: none; border: none; }
  #medalbar:empty { display: none; }
  /* Army tab */
  .armylist { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .armyrow { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border: 1px solid #3d3a29;
    border-radius: 5px; background: rgba(30,34,22,.5); cursor: pointer; }
  .armyrow:hover { border-color: var(--gold); }
  .retbtn { flex: 0 0 auto; width: 34px; height: 34px; border: 1px solid #4a4630; border-radius: 5px;
    background: rgba(0,0,0,.3); color: #8c8770; font-size: 18px; line-height: 1; cursor: pointer; }
  .retbtn.on { color: var(--gold); border-color: var(--gold); background: rgba(216,180,90,.12); }
  .armystats { font-family: var(--f-num); font-size: 12px; margin-top: 2px; display: flex; flex-wrap: wrap; gap: 2px 8px; }
  .medalpip { cursor: pointer; line-height: 0; display: inline-flex; position: relative; pointer-events: auto; }
  .medalpip:active { transform: scale(.9); }
  /* portrait: let the top bar wrap to a second line instead of squishing everything onto one */
  
    /* two rows: pills fill row 1, then power (left) + menu buttons (right) share row 2.
       flattening the statline lets its children + the .hudbtns wrap together in #hud. */
    :where(body.o-portrait) #hud { flex-wrap: wrap; overflow: visible; row-gap: 4px; align-items: center; }
     /* --pillh set in JS (setPillH) so row-1 pills + objective always fit one line */
    :where(body.o-portrait) #hud .statline { display: contents; }
  .medalx { position: absolute; right: -3px; bottom: -2px; font: 700 9px var(--f-num); color: #f1ead2;
    background: rgba(0,0,0,.75); border-radius: 4px; padding: 0 2px; line-height: 1.25; }
  /* menu icons live on the top bar — each opens its own panel */
  .hudbtns { flex: 0 0 auto; display: flex; flex-wrap: nowrap; gap: 3px; margin-left: auto; }   /* pushed to the right of the bar */
  .hbtn { padding: 3px 6px; font-size: 15px; line-height: 1; border-radius: 6px; text-transform: none;
    border: 1px solid #3a3a29; background: rgba(30,34,22,.7); color: #ddd6bf; }
  .hbtn:active { transform: scale(.94); }
  #hud .row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .pill { background: #2a2c1f; border: 1px solid #4a4630; border-radius: 4px;
    padding: 1px 7px; letter-spacing: .2px; box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
  .pill b { color: #f2ecd6; font-family: var(--f-num); }
  .cyan { color: #74b4d8; } .red { color: #d76b5d; } .gold { color: var(--gold); }
  .mag { color: #b78fd0; } .grn { color: #96ba6c; } .dim { color: #8c8770; }
  /* compact StS-style single stat line — no boxes, just icons + values */
  .statline { display: flex; flex-wrap: wrap; gap: 2px 11px; align-items: center; line-height: 1.35; }
  .statline .stat { white-space: nowrap; }
  .statline .stat b { color: #f2ecd6; font-family: var(--f-num); }
  .statline .info { cursor: pointer; width: 16px; height: 16px; border: 1px solid #4a4630; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: #b8b299; }
  .foechip { font-size: 11px; padding: 1px 7px; border-radius: 4px; cursor: pointer; white-space: nowrap;
    background: rgba(200,150,60,.14); border: 1px solid rgba(200,150,60,.4); color: var(--gold); }
  /* boss name rides in a mini TOAST pill (the ornate bronze-riveted bar) */
  .foechip.boss { border: none; border-radius: 0; color: #f4eed8; font-weight: 700; letter-spacing: .3px;
    padding: 3px 34px; min-height: 30px; display: inline-flex; align-items: center; gap: 4px;
    background:
      url(assets/ui/toast/toast_l.png) left center / auto 100% no-repeat,
      url(assets/ui/toast/toast_r.png) right center / auto 100% no-repeat,
      url(assets/ui/toast/toast_m.png) center center / auto 100% repeat-x;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,.5)); }
  .foechip.obj { background: rgba(120,150,90,.14); border-color: rgba(120,150,90,.4); color: #a9c98a; }
  /* HOLD objective — ornate plate with the X/Y progress in gold-glyph characters on the plaque */
  .objhold { position: relative; display: inline-block; height: var(--pillh, 34px); flex: 0 0 auto; cursor: pointer;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .objhold > img { height: 100%; width: auto; display: block; }
  .objhold .pl-p { display: none; }
  .objhold .objval { position: absolute; top: 50%; right: 9%; width: 36%; height: 44%; transform: translateY(-50%);
    display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .objhold .objval .gtext { height: 100%; }
  /* Engineer's Overcharge power — ornate plate; gauge value in gold glyphs, glows when ready */
  .powplate { position: relative; display: inline-block; height: var(--pillh, 34px); flex: 0 0 auto; cursor: pointer; padding: 0;
    background: none; border: none; -webkit-tap-highlight-color: transparent;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); transition: filter .15s, transform .1s; }
  .powplate > img { height: 100%; width: auto; display: block; }
  .powplate .pl-p { display: none; }
  .powplate .powval { position: absolute; top: 50%; right: 8%; width: 30%; height: 44%; transform: translateY(-50%);
    display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .powplate .powval .gtext { height: 100%; }
  .powplate:active { transform: scale(.97); }
  .powplate.ready { filter: drop-shadow(0 0 7px rgba(240,201,63,.9)) drop-shadow(0 0 3px rgba(240,201,63,.6)); animation: pulse 1.2s infinite; }
  /* portrait: swap the power/hold plates to their compact label-less versions + widen the value plaque */
  
    :where(body.o-portrait) .objhold .pl-l,
    :where(body.o-portrait) .powplate .pl-l { display: none; }
  
    :where(body.o-portrait) .objhold .pl-p,
    :where(body.o-portrait) .powplate .pl-p { display: block; }
  
    :where(body.o-portrait) .objhold .objval,
    :where(body.o-portrait) .powplate .powval { top: 50%; right: 12%; width: 40%; height: 47%; }
  .powchip { display: inline-flex; align-items: center; gap: 5px; font: 700 11px var(--f-head); letter-spacing: .3px;
    padding: 2px 9px; border-radius: 12px; background: #2a2c1f; border: 1px solid #4a4630; color: #d8d2b8; cursor: pointer; }
  .powchip b { font-family: var(--f-num); color: #efe7cf; }
  .powchip.ready { background: linear-gradient(#4a3d18, #3a2f10); border-color: var(--gold); color: var(--gold);
    box-shadow: 0 0 9px rgba(205,169,78,.55); animation: pulse 1.4s infinite; }
  .powchip .pgtrack { width: 30px; height: 5px; background: #14160d; border-radius: 3px; overflow: hidden; display: inline-block; }
  .powchip .pgtrack i { display: block; height: 100%; background: var(--gold); }
  /* battle stat nameplates — HQ / BASES / TROOPS; value engraved on the right plaque in dark gold-glyphs */
  .bpill { position: relative; display: inline-block; height: var(--pillh, 34px); flex: 0 0 auto; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .bpill > img { height: 100%; width: auto; display: block; }
  .bpill .pl-p { display: none; }                          /* landscape: wide labeled plate */
  .bpill .bpv { position: absolute; top: 47%; right: 12.5%; width: 25%; height: 44%; transform: translateY(-50%);
    display: flex; align-items: center; justify-content: center; pointer-events: none; }
                           /* portrait: compact icon-only plate + wider plaque */
    :where(body.o-portrait) .bpill .pl-l { display: none; }
  
    :where(body.o-portrait) .bpill .pl-p { display: block; }
  
    :where(body.o-portrait) .bpill .bpv { top: 50%; right: 12%; width: 40%; height: 47%; }
  .pillbar { display: contents; }                          /* landscape: the 4 stat pills flow inline in the statline */
                           /* portrait: all 4 pills alone on one line, uniform 34px height (height-driven so differing aspects stay the same height) */
    :where(body.o-portrait) #hud .statline > .pillbar { display: flex; flex: 1 1 100%; flex-wrap: nowrap; gap: 4px; min-width: 0; justify-content: flex-start; align-items: center; }
  
    :where(body.o-portrait) .pillbar .bpill,
    :where(body.o-portrait) .pillbar .objhold { flex: 0 0 auto; height: var(--pillh, 34px); }
     /* uniform height (JS setPillH); spread across the row width */
    :where(body.o-portrait) .pillbar .bpill > img,
    :where(body.o-portrait) .pillbar .objhold > img { height: 100%; width: auto; }
  
    :where(body.o-portrait) .pillbar .foechip { flex: 0 0 auto; }
  
    :where(body.o-portrait) .powplate { height: var(--pillh, 34px); }
     /* row-2 power gauge matches the pill height */
  
  .bpill .bpv .gtext { height: 100%; }
  .bpill.numA .bpv .gtext { filter: brightness(.30) saturate(1.5) drop-shadow(0 1px 0 rgba(255,236,190,.4)); }   /* engraved gold */
  .bpill.numC .bpv .gtext { filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }                                     /* bronze */
  .bpill .bpv .mn { display: inline-flex; align-items: center; height: 100%; }                                   /* silver metal */
  .bpill .bpv .mn img.md { height: 100%; width: auto; display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
  .bpill .bpv .mn img.msl { height: 80%; width: auto; align-self: center; filter: grayscale(1) brightness(1.55) contrast(1.05); }
  .bpill.danger { filter: drop-shadow(0 0 5px rgba(215,70,60,.9)) drop-shadow(0 1px 2px rgba(0,0,0,.5)); animation: pulse 1.3s infinite; }
  .bpill.full { filter: drop-shadow(0 0 5px rgba(230,190,80,.75)) drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  /* settings: battle-number style picker — each chip is an ornate plaque showcasing a sample in its style */
  .nspick { position: relative; flex: 1 1 0; padding: 0; border: none; background: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); transition: filter .15s, transform .1s; }
  .nspick img.nsbg { width: 100%; height: auto; display: block; }
  .nspick.on { filter: drop-shadow(0 0 7px rgba(230,190,80,.9)) drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .nspick:active { transform: scale(.97); }
  .nspick .nsval { position: absolute; top: 47%; left: 50%; transform: translate(-50%,-50%); height: 34%;
    display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .nspick .nsval .gtext { height: 100%; }
  .nspick.a .nsval .gtext { filter: brightness(.30) saturate(1.5) drop-shadow(0 1px 0 rgba(255,236,190,.4)); }
  .nspick.b .nsval .gtext { filter: grayscale(1) brightness(1.55) contrast(1.05) drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
  .nspick.c .nsval .gtext { filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
  .nspick .nslbl { position: absolute; bottom: 7%; right: 9%; font: 700 9px sans-serif; color: #2e2008; }

  /* board — a printed tactical map on a felt table */
  #boardwrap { flex: 1; overflow: auto; padding: 0; position: relative;   /* positioning context for the floating medal overlay */
    background: #17130d;   /* dark backstop only; the table image lives on #board so there is no double-image seam */
    display: flex; justify-content: safe center; align-items: safe center;
    isolation: isolate; }   /* trap the board's inner z-indexes (storm/fog/tracer) so they can't paint over the floating hand */
  /* the board scrolls clear of the floating hand/controls that overlay its bottom */
  /* hand clearance is baked into #board's own padding in JS (renderBoard/HAND_CLEAR) so the table
     spans the whole wrap edge-to-edge with no scroll at min zoom — no wrap padding to double-count. */
  /* the FULL table image lives on #board (padded to fill the viewport at min zoom, so the whole
     table shows edge-to-edge fully zoomed out) and scales up with the grid as you zoom in.
     100% 100% no-repeat = one un-tiled image → no seam. */
  #board { display: grid; gap: 0; position: relative; background: url(assets/board/table.jpg) center/cover no-repeat;
    /* Composite the board onto its own GPU layer. The wood table stays exactly as-is, but now it (and the
       cells) rasterize into tiles: a unit move re-rasterizes only the tiles it touched instead of repainting
       the whole surface on the main thread, and a scroll/pan is a pure compositor shift — that main-thread
       full-surface repaint is what produced the horizontal tearing. Paired with the per-cell content-visibility
       culling, only near-viewport tiles stay live, so this doesn't balloon memory on big maps. */
    transform: translateZ(0); backface-visibility: hidden; }
  /* combat tracer — a brief streak from an attacker's tile to the unit it hit, so a ranged/unseen shot
     reveals where it came from. Source end gets a pulse ring even if the shooter sits in fog. */
  .tracer { position: absolute; height: 3px; transform-origin: 0 50%; z-index: 7; pointer-events: none; border-radius: 2px;
    background: linear-gradient(90deg, rgba(255,90,55,0), #ff5a3b 45%, #ffd48a); box-shadow: 0 0 7px 1px rgba(255,90,55,.85);
    animation: tracerfade .8s ease-out forwards; }
  .tracer-src { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; z-index: 7; pointer-events: none;
    border-radius: 50%; border: 2px solid #ff5a3b; box-shadow: 0 0 9px 2px rgba(255,90,55,.7); animation: tracersrc .8s ease-out forwards; }
  @keyframes tracerfade { 0% { opacity: 0; } 14% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes tracersrc { 0% { opacity: 0; transform: scale(.5); } 20% { opacity: 1; } 100% { opacity: 0; transform: scale(1.5); } }
  @media (prefers-reduced-motion: reduce) { .tracer, .tracer-src { animation-duration: .01s; } }
  /* portrait: use a vertically-oriented table image so the wood isn't stretched sideways */
  /* portrait uses the horizontal table too — a wide table fills the portrait battle viewport edge-to-edge */
  .cell { width: var(--cell); height: var(--cell); display: flex;
    align-items: center; justify-content: center; position: relative;
    font-size: calc(var(--cell) * 0.62); font-weight: 700;
    background: #b3a682 center/cover no-repeat; user-select: none;
    /* viewport culling: the browser skips rendering cells that are off-screen (only the ~viewport's
       worth of tiles paint each frame instead of the whole map). On a large, fully-revealed map this
       is the big win — it caps paint area AND decoded-texture memory to what's actually visible, which
       is what caused the horizontal tearing + the long-session glitch. Intrinsic size = exact cell box,
       so there is zero layout shift; near-viewport cells still render, so fog feather at the edge holds. */
    content-visibility: auto; contain-intrinsic-size: var(--cell) var(--cell); }
  /* wood-tile board: base tile + per-terrain colour-tinted tile (grain kept) */
  .cell    { background-image: url(assets/board/base.png); }
  .t-plain  { background-image: url(assets/board/base.png); }
  .t-forest { background-image: url(assets/board/forest.png); }
  .t-hill   { background-image: url(assets/board/hill.png); }
  .t-water  { background-image: url(assets/board/water.png); }
  .t-rock   { background-image: url(assets/board/rock.png); }
  .t-mire   { background-image: url(assets/board/mire.png); }
  .t-none   { background: transparent; }             /* unexplored — always under fog; transparent so the feathered fog edge reveals the table, not a dark backdrop */
  .t-void   { background: transparent; box-shadow: none; pointer-events: none; }   /* off-battlefield — just the table shows, nothing rendered */
  /* board pieces sit raised on the table */
  .cell:not(.t-void):not(.t-none) { box-shadow: 0 2px 4px rgba(0,0,0,.45); }
  /* fog of war — autotiled ember-fog mass: solid fill on unexplored cells, feathered edge/corner
     pieces spilling into the seen cells at the boundary (assets/ui/fogedge/). */
  .fog { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
  /* each fogged cell shows one of 4 seamless tiles (a-d), picked at random per cell */
  .fog.fill { background-position: center; background-size: cover; background-repeat: no-repeat; }
  /* macro-texture windowing: 4×4 sheet, each cell a 1/4 window → continuous across neighbours */
  .fog.fill.win { background-size: 400% 400%; }
  /* runtime-baked feathered edge: the section's windowed texture masked through the feather shape */
  .fpw { position: absolute; inset: 0; background-size: 400% 400%; background-repeat: no-repeat;
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; pointer-events: none; }
  .fog .fp { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* fog-of-war style picker (Settings) — a swatch of each set's fill tile */
  .fogpick { position: relative; padding: 0; border: 2px solid rgba(150,132,82,.3); border-radius: 7px; overflow: hidden; cursor: pointer; background: #1a1712; aspect-ratio: 1/1; }
  .fogpick img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fogpick span { position: absolute; left: 0; right: 0; bottom: 0; font: 700 9px var(--f-ui); text-align: center; background: rgba(0,0,0,.62); color: #d8c99a; padding: 1px 0; letter-spacing: .3px; }
  .fogpick.on { border-color: #d8b23a; box-shadow: 0 0 0 2px rgba(216,178,58,.35); }
  .fogpick.flocked { cursor: default; }
  .fogpick.flocked img { filter: grayscale(1) brightness(.32); }
  .fogpick.flocked span { background: rgba(0,0,0,.72); color: #9a927a; }
  /* locked move/target marker button */
  .pbtn.flocked { position: relative; cursor: default; }
  .pbtn.flocked img { filter: grayscale(1) brightness(.34); }
  .pbtn .mlock { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); opacity: .9; pointer-events: none; }
  .pbtn .mlock svg { height: 17px; width: auto; }
  /* first-time unlock modal */
  .oframe.ulk { max-width: 380px; text-align: center; }
  .ulk .ulk-top { font: 900 28px var(--f-head); letter-spacing: 3px; color: var(--gold); text-shadow: 0 2px 5px rgba(0,0,0,.65); margin: 2px 0 3px; }
  .ulk .ulk-top svg { height: 22px; width: auto; vertical-align: -3px; margin-right: 4px; }
  .ulk .ulk-kind { font: 700 12px var(--f-head); letter-spacing: 1.2px; text-transform: uppercase; color: #cabf9a; margin: 2px 0 10px; }
  .ulk .ulk-art { margin: 4px auto 12px; display: flex; justify-content: center; }
  .ulk .ulk-art img.ulk-swatch { width: 122px; height: 122px; object-fit: cover; border-radius: 12px;
    border: 2px solid rgba(216,178,58,.65); box-shadow: 0 0 20px rgba(216,178,58,.28); }
  .ulk .ulk-name { font: 800 23px var(--f-head); color: #f2e6bd; letter-spacing: .5px; margin: 2px 0 8px; }
  .ulk .ulk-hint { font: 500 13px var(--f-ui); color: #cabf9a; line-height: 1.55; margin: 0 14px; }
  /* remembered tile — solid fog fill greyed at heavy alpha so the dimmed terrain shows through */
  .fog.veil { filter: grayscale(.92) brightness(.5); opacity: .62; }
  /* card collection — a grid of little trading cards */
  .collgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 7px; margin: 4px 0 8px; }
  /* cache / reward card options — centered in the container */
  .nodecards { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 10px 0 8px; }
  .nodecards .gridcard { flex: 1 1 78px; max-width: 150px; }   /* grow to share the space; 2 cards bigger, 3 still fit a row */
  /* cache: tap a tile to select, then Confirm (no per-card inspect view) */

  /* reusable container (frame5 9-slice — our standard frame) — use this, never a plain CSS box */
  .gunframe { border: none; border-radius: 0; --bt: 9px; --cn: 22px;

      url(assets/ui/frame5/tl.png) top left/var(--cn) var(--cn) no-repeat,
      url(assets/ui/frame5/tr.png) top right/var(--cn) var(--cn) no-repeat,
      url(assets/ui/frame5/bl.png) bottom left/var(--cn) var(--cn) no-repeat,
      url(assets/ui/frame5/br.png) bottom right/var(--cn) var(--cn) no-repeat,
      url(assets/ui/frame5/t.png) center 0/auto var(--bt) repeat-x,
      url(assets/ui/frame5/b.png) center 100%/auto var(--bt) repeat-x,
      url(assets/ui/frame5/l.png) 0 center/var(--bt) auto repeat-y,
      url(assets/ui/frame5/r.png) 100% center/var(--bt) auto repeat-y,
      url(assets/ui/frame5/cs.png) center/150px 150px repeat; }
  .cache-salv { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; }
  .cache-salv .csv { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 19px; text-align: center; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
  .ibtn:disabled { opacity: .38; filter: grayscale(1); pointer-events: none; }
  /* shop — card offer with a salvage-cost tag top-right; no nested container */
  .shopcard { position: relative; flex: 1 1 78px; max-width: 140px; cursor: pointer; aspect-ratio: 1/1;
    filter: drop-shadow(1px 2px 3px rgba(0,0,0,.5)); }
  .shopcard img { width: 100%; height: 100%; display: block; }
  .shopcard.poor { filter: grayscale(.55) brightness(.55); }
  .shopcard .shopcost { position: absolute; top: 3px; right: 3px; z-index: 2; font: 700 11px var(--f-num); color: #f1ead2;
    background: rgba(0,0,0,.74); border: 1px solid rgba(216,178,58,.65); border-radius: 5px; padding: 0 5px;
    display: inline-flex; align-items: center; gap: 2px; }
  /* shop — medal / relic rows sit directly in the section (no inner box) */
  .shopmedal { display: flex; align-items: center; gap: 10px; padding: 7px 4px; cursor: pointer;
    border-top: 1px solid rgba(150,132,82,.18); }
  .shopmedal:first-of-type { border-top: none; }
  .shopmedal.poor { opacity: .5; }
  /* vintage price tag — salvage cost printed on parchment (replaces the generic price badge) */
  .pricetag { position: relative; display: inline-block; height: 50px; flex: 0 0 auto; filter: drop-shadow(1px 2px 2px rgba(0,0,0,.55)); }
  .pricetag img { height: 100%; width: auto; display: block; }
  .pricetag .ptval { position: absolute; top: 56%; left: 50%; transform: translate(-50%,-50%); font-size: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 1px; white-space: nowrap; }
  .pricetag .ptval .gtext { filter: drop-shadow(0 1px 1px rgba(0,0,0,.55)); }
  .shopcard .pricetag { position: absolute; top: -5px; right: 3px; z-index: 3; height: 47px; }
  /* framed card as a grid tile (collection / deck / shop grids) */
  .gridcard { position: relative; aspect-ratio: 1/1; cursor: pointer; user-select: none; filter: drop-shadow(1px 2px 3px rgba(0,0,0,.5)); }
  .gridcard.seen { opacity: .6; filter: grayscale(.45); }
  .gridcard.disabled { opacity: .35; filter: grayscale(.5); pointer-events: none; }
  .gridcard .fc-badges { position: absolute; top: 2px; right: 4px; z-index: 4; }
  .gridcard .fc-badges .temp { color:#f1ead2; background:rgba(0,0,0,.62); font:700 9px var(--f-num); padding:0 4px; border-radius:3px; }
  .gridcard .fc-up { position: absolute; top: 1px; left: 5px; z-index: 4; color: var(--gold); font: 700 14px var(--f-head); text-shadow: 0 1px 2px #000, 0 0 4px #000; }
  .collcard { position: relative; border: 1px solid #423d2b; border-left: 3px solid var(--cat, #7a7458);
    border-radius: 7px; overflow: hidden; background: linear-gradient(#252820, #171a12);
    box-shadow: 0 2px 4px rgba(0,0,0,.45); aspect-ratio: 5 / 7; display: flex; flex-direction: column; }
  .collcard .cart { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; font-size: 30px;
    background: linear-gradient(135deg, var(--cat, #3a3a29), #12140d); border-bottom: 1px solid rgba(0,0,0,.45); }
  .collcard .cnm { font: 700 9px var(--f-head); text-transform: uppercase; letter-spacing: .2px; color: #f1ead2;
    padding: 4px 5px 0; line-height: 1.12; flex: 0 0 auto; }
  .collcard .crar { font-size: 8px; padding: 1px 5px 4px; color: #8c8770; text-transform: capitalize; flex: 0 0 auto; }
  .collcard .ccost { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; z-index: 2;
    border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6a86a8, #2e496b); border: 1px solid #86a6c8;
    color: #eef4ff; font: 700 10px var(--f-num); display: flex; align-items: center; justify-content: center; }
  .collcard .ccount { position: absolute; top: 3px; right: 3px; z-index: 2; font: 700 10px var(--f-num); color: #f1ead2;
    background: rgba(0,0,0,.6); border-radius: 4px; padding: 0 4px; }
  .collcard.seen { opacity: .62; filter: grayscale(.4); }   /* seen an enemy play it, but not owned */
  .collcard.seen .crar { color: #8c8770; }
  .collcard.locked { opacity: .9; }
  .collcard.locked .cart { padding: 0; }
  .collcard.locked .cnm { color: #b7ad86; }
  .collcard.locked .cart { background: #14160d; color: #6f6a58; font-size: 15px; }
  .collcard.locked .cnm { color: #6f6a58; }
  /* crate / workshop / emp sit on normal ground — the marker is a token on top; escape is deliberately plain */
  .t-crate, .t-workshop, .t-emp, .t-escape { background-image: url(assets/board/base.png); }
  .t-inferno { background-image: url(assets/board/inferno.png); }   /* instant burn */
  .t-toxic   { background-image: url(assets/board/toxic.png); }     /* slow rot */
  /* smoke = translucent concealment cloud over the ground */
  .t-smoke { background-image: linear-gradient(rgba(198,203,208,.5), rgba(176,182,192,.55)), url(assets/board/base.png); }
  .cell.storm { box-shadow: inset 0 0 9px 2px rgba(190,205,255,.55); }
  /* storm wall overlay — a translucent storm icon ON TOP of whatever's on the tile (terrain + unit).
     It BLINK-FLASHES like lightning; each wall cell is offset (negative delay) so the ring flickers. */
  .stormfx { position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: .58; animation: stormflash 1.5s ease-in-out infinite; }
  .stormfx img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 3px rgba(150,180,255,.55)); }
  @keyframes stormflash {
    0%, 66%, 100% { opacity: .5; }
    72% { opacity: 1; filter: brightness(1.7) drop-shadow(0 0 6px rgba(170,195,255,.95)); }
    78% { opacity: .62; }
    84% { opacity: .95; filter: brightness(1.4); }
  }
  @media (prefers-reduced-motion: reduce) { .stormfx { animation: none; opacity: .62; } }
  .cell.reveal-ping { box-shadow: inset 0 0 0 2px #8fd0ff, 0 0 12px 3px rgba(120,190,255,.7); animation: pulse .45s infinite; }
  /* Army tab: locate a unit — a bright gold ring that pulses a few times, then clears */
  .cell.locate-ping { position: relative; z-index: 5;
    box-shadow: inset 0 0 0 3px var(--gold), 0 0 18px 6px rgba(216,180,90,.85); animation: pulse .5s ease-in-out 3; }
  @media (prefers-reduced-motion: reduce) { .cell.locate-ping { animation: none; } }
  .shopbtn { padding: 3px 8px; font: 700 10px var(--f-head); border-radius: 5px;
    border: 1px solid #4a4636; background: #23261b; color: #cdc6ac; cursor: pointer; white-space: nowrap; }

  /* interactable tokens (crate / workshop / EMP) — the neutral wood counter tile + icon + glow */
  .token { position: absolute; inset: 7%; --dep: drop-shadow(0 2px 2px rgba(0,0,0,.55));

     — counter the parent .dark filter on the fog pieces (composes to ~1x). */

  /* ── cardboard unit counters ─────────────────────────────── */

  .counter { position: absolute; inset: 7%; --dep: drop-shadow(0 2px 2px rgba(0,0,0,.55));

    background: url(assets/board/unit.png) center/contain no-repeat; filter: var(--dep); }

  .counter.enemy, .counter.hq_enemy, .counter.tribe, .counter.neutral, .counter.raider, .counter.gator, .counter.bossunit { background-image: var(--chip-enemy, url(assets/board/unit.png)); }

  .counter.you     { filter: var(--dep) drop-shadow(0 0 2.5px #4f8fe0); }

  .counter.tribe   { filter: var(--dep) drop-shadow(0 0 2.5px var(--f-tribe)); }
  .counter.neutral { filter: var(--dep) drop-shadow(0 0 2.5px var(--f-neutral)); }
  .counter.gator   { filter: var(--dep) drop-shadow(0 0 3px #5a7d2e) drop-shadow(0 0 2px #86b14a); }   /* swamp predator */

            mask: linear-gradient(#000 0 0) top left/32% 32% no-repeat, linear-gradient(#000 0 0) top right/32% 32% no-repeat, linear-gradient(#000 0 0) bottom left/32% 32% no-repeat, linear-gradient(#000 0 0) bottom right/32% 32% no-repeat; }

  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.5;} }
  .fade { filter: grayscale(.9) brightness(.5); }   /* targeting: mute non-target tiles to grey, stay opaque (no see-through) */
  /* action replay + intent telegraphs */

  .fx-spawn .counter { animation: fxspawn .5s; }
  .fx-heal .counter { animation: fxheal .5s; }

  @keyframes fxmove { 0%,100%{ filter:none; } 50%{ filter: drop-shadow(0 0 6px #9fd0ff); } }

  @keyframes shake { 0%,100%{transform:translate(0,0);} 20%{transform:translate(-4px,2px);} 40%{transform:translate(4px,-2px);} 60%{transform:translate(-3px,-2px);} 80%{transform:translate(3px,2px);} }

  /* bottom controls */
  /* the hand + controls FLOAT over the battlefield (no panel/container) */

    display: flex; flex-direction: column; background: none; pointer-events: none; }
  /* aim prompt — snug gunmetal box (frame3 9-slice) hugging just the hint text + cancel button */
  #prompt { align-self: center; max-width: 92%; margin-bottom: 6px; padding: 6px 13px; font-size: 11.5px;
    color: var(--gold); text-align: left; line-height: 1.35; pointer-events: none;
    display: flex; align-items: center; gap: 10px;
    --bt: 11px; --cn: 22px; border-radius: 0; filter: drop-shadow(0 3px 9px rgba(0,0,0,.6));
    background:
      url(assets/ui/frame5/tl.png) top left/var(--cn) var(--cn) no-repeat,
      url(assets/ui/frame5/tr.png) top right/var(--cn) var(--cn) no-repeat,
      url(assets/ui/frame5/bl.png) bottom left/var(--cn) var(--cn) no-repeat,
      url(assets/ui/frame5/br.png) bottom right/var(--cn) var(--cn) no-repeat,
      url(assets/ui/frame5/t.png) center 0/auto var(--bt) repeat-x,
      url(assets/ui/frame5/b.png) center 100%/auto var(--bt) repeat-x,
      url(assets/ui/frame5/l.png) 0 center/var(--bt) auto repeat-y,
      url(assets/ui/frame5/r.png) 100% center/var(--bt) auto repeat-y,
      url(assets/ui/frame5/cs.png) center/150px 150px repeat; }
  #prompt:empty { display: none; }
  #app.hand-peek #prompt { margin-bottom: 60px; }   /* while targeting, sit above the Deck/End-Turn edge buttons so the cancel shows */
  /* text hugs its content on one line when it fits (landscape / short hints); only wraps
     when the box hits max-width (portrait + a long hint), and the cancel stays centered at right */
  #prompt .ptext { flex: 0 1 auto; min-width: 0; }
  #prompt button, #prompt .ibtn { pointer-events: auto; vertical-align: middle; flex: 0 0 auto; }
  /* the hand is a clipping pocket at the very bottom edge — card bottoms run off-screen.
     while you pick a target it drops to a peeking sliver so the battlefield is clear. */
  /* the hand is a focus-carousel: the centered card stands straight up on top, the
     others fan down and overlap like pyramid blocks. Swipe L/R rotates the fan. */
  #hand { overflow: hidden; pointer-events: none;
    padding: 6px 0 max(3px, env(safe-area-inset-bottom));
    height: var(--hand-h, 120px); transition: height .28s cubic-bezier(.22,.61,.36,1); }
  #hand .handfan { position: relative; width: 100%; height: 100%; pointer-events: none; }
  #hand .card { pointer-events: auto; }
  #hand .dim { pointer-events: auto; }
  #app.hand-peek #hand { height: 42px; }                               /* mid-target: only card tops poke up */
  #hand.lifting { overflow: visible; }                                 /* let a swiped card rise clear */
  #hand.dragging .card { transition: none; }                           /* fan follows the finger while dragging */
  .card.lift { transition: none !important; z-index: 400 !important; } /* follows the finger on a swipe */
  /* the centred card reads as "in focus" from its position alone (straight, on top) —
     the gold highlight is reserved for a card that's actually been selected (.sel). */
  /* floating edge buttons — End Turn (right) / Deck (left), sitting above the hand */
  .edgebtn { position: absolute; z-index: 8; pointer-events: auto; display: inline-flex; flex-direction: column;
    align-items: center; gap: 1px; line-height: 1; border-radius: 10px; padding: 9px 12px;
    bottom: calc(var(--hand-h, 120px) + 8px); box-shadow: 0 3px 10px rgba(0,0,0,.6); }
  .edgebtn span { font-size: 10px; opacity: .85; }
  .edgebtn.deck { left: max(8px, env(safe-area-inset-left)); font-size: 17px; padding: 8px 11px; }
  .edgebtn.end { right: max(8px, env(safe-area-inset-right)); font-weight: 700; font-size: 13px; }
  #app.hand-peek .edgebtn { bottom: 50px; }   /* follow the hand down while targeting */
  /* selected-unit card — sits just above the Deck button, out of the board's way */
  #unitinfo { position: absolute; left: max(8px, env(safe-area-inset-left)); bottom: 100px; z-index: 9;
    width: min(224px, 56vw); pointer-events: auto; padding: 13px 24px; font-size: 11px; color: #e9e3d1;
    --bt: 12px; --cn: 26px; border: none; border-radius: 0; filter: drop-shadow(0 3px 10px rgba(0,0,0,.6));
    background:
      url(assets/ui/frame5/tl.png) top left/var(--cn) var(--cn) no-repeat,
      url(assets/ui/frame5/tr.png) top right/var(--cn) var(--cn) no-repeat,
      url(assets/ui/frame5/bl.png) bottom left/var(--cn) var(--cn) no-repeat,
      url(assets/ui/frame5/br.png) bottom right/var(--cn) var(--cn) no-repeat,
      url(assets/ui/frame5/t.png) center 0/auto var(--bt) repeat-x,
      url(assets/ui/frame5/b.png) center 100%/auto var(--bt) repeat-x,
      url(assets/ui/frame5/l.png) 0 center/var(--bt) auto repeat-y,
      url(assets/ui/frame5/r.png) 100% center/var(--bt) auto repeat-y,
      url(assets/ui/frame5/cs.png) center/150px 150px repeat; }
  #unitinfo:empty { display: none; }
  /* the panel parks on the left by default but sits over the fight — the ‹ › edge arrows

  #unitinfo.right { left: auto; right: max(8px, env(safe-area-inset-right)); }
  #unitinfo .uiside { position: absolute; top: 0; bottom: 0; width: 22px; display: flex; align-items: center;

  #unitinfo .uist { color: #c3bda6; margin: 3px 0 5px; font: 10.5px/1.3 var(--f-num); }

  /* framed "object card" — composited on the fly: art window + frame PNG + name/cost/desc overlays */

  /* raw text buttons: our gunmetal button style (same as .setbtn) — NOT a frame; ornate actions use
     the image buttons (.ibtn / .pbtn) instead. No button uses a frame kit. */
  button { font: 700 13px var(--f-head); letter-spacing: .4px; color: #ecdfae; text-transform: uppercase;
    text-shadow: 0 1px 2px #000; cursor: pointer; padding: 9px 15px; border-radius: 6px; border: 1px solid #5a5763;
    background: linear-gradient(#3b3b44, #23232b);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 2px 4px rgba(0,0,0,.45); transition: filter .12s, transform .1s; }
  button:hover { filter: brightness(1.12); }
  button:active { transform: scale(0.97); }
  button:disabled { filter: grayscale(.65) brightness(.62); opacity: .7; cursor: not-allowed; }
  /* active/selected metal button — keeps the copper texture, adds a gold glow + engraved ring */
  button.act { color: #ffe789; text-shadow: 0 1px 2px #000, 0 0 4px rgba(0,0,0,.6);
    filter: saturate(1.25) brightness(1.06);
    box-shadow: inset 0 0 0 2px rgba(255,222,96,.85), 0 0 10px rgba(240,200,60,.5); }
  /* pre-made labeled image buttons (icon + text baked in) */
  .ibtn { background: none; border: none; border-radius: 0; padding: 0; margin: 0; cursor: pointer;

  .ibtn img { height: 46px; width: auto; display: block; pointer-events: none; }

  .ibtn:disabled { filter: grayscale(.65) brightness(.55); opacity: .65; cursor: not-allowed; }
  .ibtn.big img { height: 54px; }

  .ibtn.xs img { height: 26px; }    /* tiny inline board buttons (prompt cancel, unit-card ⓘ / Done) */
  .ibtn.ico img { height: 44px; }   /* icon-only (dots) */
  .ibtn.act img { filter: drop-shadow(0 0 6px rgba(232,198,90,.85)) brightness(1.05); }   /* active toggle (view-upgrade / kept) */
  .ibtnrow { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }

  .ibtnrow.wide { align-items: stretch; }
  .ibtnrow.wide .ibtn { justify-content: center; }   /* landscape: natural size (fill only in portrait) */
  /* labeled plate buttons (settings toggles / start-run) — full-width copper plates, icon+label baked in */
  .pbtn { background: none; border: none; padding: 0; margin: 0; cursor: pointer; display: block; width: 100%;

  .pbtn:active { transform: scale(.97); }

  /* labeled plate button with a recessed plaque that shows a dynamic gold value on the right */
  .platebtn { position: relative; display: block; width: 100%; background: none; border: none; padding: 0;

  .platebtn .plaqueval .gtext { height: 100%; }

  .platebtn.pb-heal .plaqueval { right: 7%; width: 25%; }
  .platebtn.pb-upg  .plaqueval { right: 6.5%; width: 26%; }
  .platebtn.pb-rem  .plaqueval { right: 6.5%; width: 29%; }

  /* menu plates: landscape has room, so cap them smaller + centered; they fill the container only in portrait */

    :where(body.o-portrait) .pbtn.h { max-width: none; }
                           /* portrait: fill the container width */
    :where(body.o-portrait) .ibtnrow.wide .ibtn { width: 100%; }
  
    :where(body.o-portrait) .ibtnrow.wide .ibtn img { width: 100%; height: auto; }
  /* round push-button toggle — glowing red = ON, dim = OFF */
  .tglbtn { background: none; border: none; padding: 0; margin: 0; cursor: pointer; flex: 0 0 auto;
    -webkit-tap-highlight-color: transparent; transition: transform .1s; filter: drop-shadow(0 1px 3px rgba(0,0,0,.55)); }
  .tglbtn img { width: 46px; height: 46px; display: block; }

  .pbtn:disabled { filter: grayscale(.6) brightness(.5); cursor: not-allowed; }
  /* card full-view Play row — the play plate swaps to its can't-play state image (curse / troops / CP) */
  .playrow { display: flex; gap: 8px; margin-top: 10px; justify-content: center; align-items: center; }

    filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); transition: transform .1s; }

  /* SEED input field — the plate holds a transparent input; typed digits mirror into gold glyphs on the plaque */

    background:
      url(assets/ui/frame5/tl.png) top left/var(--cn) var(--cn) no-repeat,

      url(assets/ui/frame5/bl.png) bottom left/var(--cn) var(--cn) no-repeat,
      url(assets/ui/frame5/br.png) bottom right/var(--cn) var(--cn) no-repeat,
      url(assets/ui/frame5/t.png) center 0/auto var(--bt) repeat-x,
      url(assets/ui/frame5/b.png) center 100%/auto var(--bt) repeat-x,
      url(assets/ui/frame5/l.png) 0 center/var(--bt) auto repeat-y,
      url(assets/ui/frame5/r.png) 100% center/var(--bt) auto repeat-y,
      url(assets/ui/frame5/cs.png) center/140px 140px repeat; }

  #maplegend { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-47%) scale(2.25); z-index: 14;
    width: min(132px, 48vw); max-height: 82vh; overflow-y: auto; opacity: 0; pointer-events: none;
    /* frayed canvas banner: top edge pinned, bottom edge pinned, burlap stretched between */

    background: url(assets/nodes/leg-top.webp) center top / 100% auto no-repeat,

  .legtitle { font: 700 13px var(--f-head); letter-spacing: 1px; text-transform: uppercase; color: #3a2810; padding: 2px 10px 8px; text-align: center; text-shadow: 0 1px 0 rgba(255,255,255,.22); }

  .overlay { position: fixed; inset: 0; background: rgba(15,15,13,.975); display: none;
    -webkit-backdrop-filter: grayscale(1) brightness(.4); backdrop-filter: grayscale(1) brightness(.4);
    flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top)); overflow-y: auto; z-index: 10; }
  /* NOTE: was `justify-content: safe center` — the `safe` keyword is unsupported on Safari < 15.4
     (old iPad), where it degrades to plain `center` and clips/strands the overflowing top of long
     menus (achievements/how-to-play/generals/settings). flex-start always scrolls from the top. */
  .overlay.show { display: flex; }

     so you can leave from anywhere without scrolling all the way down */
  .overlay > button:last-child { position: sticky; bottom: 10px; z-index: 6; flex: 0 0 auto;
    box-shadow: 0 5px 16px rgba(0,0,0,.7); }

  /* event scrapped a card — the card face with a slammed-down red REMOVED stamp */

  .removed-stamp { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) rotate(-16deg);

    border-radius: 6px; background: rgba(20,9,7,.4); text-shadow: 0 2px 6px rgba(0,0,0,.85);

<script>
const APP_VERSION = '0.0.16';  // bump on every release; the update check compares against this (keep in lockstep with android versionName + tauri.conf version)
let S = null;                 // latest state
let sel = null;               // selected hand index (card mode)
let picked = [];              // card targets chosen so far
let legal = null;             // {kind, set} card-target highlight
let cmd = null;               // selected unit id (command mode)
let powerArm = false;         // Command Power is armed, waiting for a target tap
let cmdOpts = {moves:new Set(), attacks:new Set(), ap:0};
let retain = new Set();       // hand indices marked to keep
let animGen = 0;              // bumped on every render — cancels stale replays
let lastBoardW = null;        // detect a new level to refit zoom + clear selection
let _lastBattleSig = null;    // per-battle identity (seed:level:dims) → refit zoom + recentre camera on entry
let _prevCpHold = null;       // last-seen control-point count → toast when it flips (capture/loss)
let _inBattlePrev = false;    // were we in a battle last render? → clean up battle/transient UI exactly on exit
let endArmed = false;         // two-stage End Turn (warn on unused AP first)
let idleWarn = new Set();     // unit ids with actions still unused
let turnBusy = false;         // true while the enemy turn animates — locks/hides End Turn
// Show End Turn only during OUR battle turn (in a live battle, enemy not currently acting).
function updateEndBtn() {
  const b = document.getElementById('end'); if (!b) return;
  const ourTurn = !!(S && S.board && !S.result && !turnBusy);
  b.style.display = ourTurn ? '' : 'none';
}
let dangerOn = true;          // danger overlay — on by default; toggle lives in the ⓘ run-info panel
let threatSet = new Set();    // "x,y" tiles enemies can hit next turn
let cellPx = 22;
let minCellPx = 22;   // dynamic zoom-out floor: the cell size at which the whole map/fog rectangle fits the screen
const HAND_CLEAR = 128;   // the hand fans up over the board's bottom edge — keep the whole grid clear of it

const $ = s => document.querySelector(s);
window.$ = $;   // so inline onclick handlers can use it
const TERR_GLYPH = {forest:'♣', hill:'▲', water:'≈', rock:'▓',
  inferno:'✷', toxic:'☣', mire:'≋', emp:'⌁', smoke:'°', escape:'·'};
async function api(path, body) {
  // Local, in-process dispatch (no server) — wired up by src/main.ts.
  return window.__localApi(path, body || null);
}
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); }

async function refresh() { render(await api('/api/state')); }

// ── auto-update (same pattern as DensAssistant): one anonymous GET of a static JSON on
//    densanon.com, compare to APP_VERSION, and on a newer build show a banner with a manual
//    download link. Nothing installs itself. Opt-out (default ON) lives in localStorage. ──
const UPDATE_URL_DESKTOP = 'https://densanon.com/war-table-version.json';
const UPDATE_URL_MOBILE  = 'https://densanon.com/war-table-mobile-version.json';
function _isTauri() { return !!(window.__TAURI__ || window.__TAURI_INTERNALS__); }
function _isAndroid() { try { return !!(window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android'); } catch (e) { return false; } }
// Orientation is driven by a body class (o-landscape / o-portrait), not raw viewport media queries,
// so the DESKTOP build can be pinned to landscape no matter the window shape. Mobile still follows
// the real (locked) device orientation. Every `@media (orientation:…)` rule became `:where(body.o-…)`.
function _forceLandscape() { return _isTauri(); }                 // PC = landscape-only
function _isPortrait() { return !_forceLandscape() && !!(window.matchMedia && window.matchMedia('(orientation: portrait)').matches); }
function _applyOrient() {
  if (!document.body) return;
  const port = _isPortrait();
  document.body.classList.toggle('o-portrait', port);
  document.body.classList.toggle('o-landscape', !port);
}
window.addEventListener('resize', _applyOrient);
window.addEventListener('orientationchange', _applyOrient);
try { if (window.matchMedia) window.matchMedia('(orientation: portrait)').addEventListener('change', _applyOrient); } catch (e) {}
function updateOptedOut() { try { return localStorage.getItem('dc_no_update') === '1'; } catch (e) { return false; } }
function setUpdateOptOut(off) { try { localStorage.setItem('dc_no_update', off ? '1' : '0'); } catch (e) {} }
// lenient semver: pull the numbers and compare tuples ('0.1.10' > '0.1.9')
function verNewer(remote, current) {
  const p = s => (String(s || '').match(/\d+/g) || ['0']).map(Number);
  const a = p(remote), b = p(current);
  for (let i = 0; i < Math.max(a.length, b.length); i++) { const d = (a[i] || 0) - (b[i] || 0); if (d) return d > 0; }
  return false;
}
async function openExternal(url) {
  try { const o = window.__TAURI__ && window.__TAURI__.opener; if (o && o.openUrl) { await o.openUrl(url); return; } } catch (e) {}
  try { const B = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser; if (B) { await B.open({ url }); return; } } catch (e) {}
  window.open(url, '_blank');
}
async function checkForUpdate() {
  if (updateOptedOut()) return;
  if (!_isTauri() && !_isAndroid()) return;            // only the packaged builds self-update
  const url = _isAndroid() ? UPDATE_URL_MOBILE : UPDATE_URL_DESKTOP;
  try {
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 5000);
    const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store' }); clearTimeout(t);
    if (!r.ok) return;
    const d = await r.json();
    if (d && d.version && verNewer(d.version, APP_VERSION)) showUpdateBanner(d);
  } catch (e) { /* best-effort — offline / blocked / bad JSON: stay silent */ }
}
function showUpdateBanner(d) {
  const el = document.getElementById('updateBanner'); if (!el) return;
  el.innerHTML = `<div class="ub-in">
      <b>Update available — v${d.version}</b>
      ${d.changelog ? `<div class="ub-log">${d.changelog}</div>` : ''}
      <div class="ub-btns">
        <button class="ub-dl" onclick="openExternal('${(d.downloadUrl||'').replace(/'/g,'')}')">Download ▸</button>
        <button class="ub-x" onclick="document.getElementById('updateBanner').classList.remove('show')">Later</button>
      </div></div>`;
  el.classList.add('show');
}

function setScreen(map) {   // toggle map view vs battle view
  $('#mapview').classList.toggle('show', map);
  $('#app').style.display = map ? 'none' : 'flex';
}
// ── sound + haptics (fully synthesized — no asset files, offline, ports to TS) ──
const Sfx = (() => {
  let ctx = null, sfxGain = null, musicGain = null, musicFilter = null;
  let muted = localStorage.getItem('dc_muted') === '1';
  const cl01 = (v, d) => (isFinite(v) ? Math.max(0, Math.min(1, v)) : d);
  let sfxVol = cl01(parseFloat(localStorage.getItem('dc_sfxvol')), 0.75);
  let musicVol = cl01(parseFloat(localStorage.getItem('dc_musicvol')), 0.5);
  let musicVoices = [], musicMode = null;
  function ensure() {
    if (ctx) return true;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      sfxGain = ctx.createGain(); sfxGain.connect(ctx.destination);
      musicFilter = ctx.createBiquadFilter(); musicFilter.type = 'lowpass'; musicFilter.frequency.value = 1100;
      musicGain = ctx.createGain(); musicFilter.connect(musicGain); musicGain.connect(ctx.destination);
      applyGains();
    } catch (e) { return false; }
    return true;
  }
  function applyGains() {
    if (!ctx) return;
    const t = ctx.currentTime;
    sfxGain.gain.setTargetAtTime(muted ? 0 : 0.34 * sfxVol, t, 0.04);
    musicGain.gain.setTargetAtTime(muted ? 0 : 0.16 * musicVol, t, 0.15);
  }
  function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }
  function tone(freq, dur, type, gain, slideTo, delay) {
    if (muted || !ensure()) return;
    const t0 = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || 0.3, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(sfxGain); o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noise(dur, gain, filterFreq, delay) {
    if (muted || !ensure()) return;
    const t0 = ctx.currentTime + (delay || 0);
    const n = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, n, ctx.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filterFreq || 1200;
    const g = ctx.createGain(); g.gain.value = gain || 0.3;
    src.connect(f); f.connect(g); g.connect(sfxGain); src.start(t0);
  }
  const bank = {
    tap:    () => tone(440, 0.05, 'square', 0.1),
    card:   () => tone(300, 0.09, 'triangle', 0.18, 540),
    move:   () => tone(210, 0.06, 'sine', 0.09, 270),
    hit:    () => { noise(0.12, 0.28, 1600); tone(160, 0.1, 'sawtooth', 0.12, 90); },
    boom:   () => { noise(0.36, 0.5, 800); tone(80, 0.4, 'sawtooth', 0.24, 40); },
    deploy: () => { tone(330, 0.09, 'square', 0.13, 550); tone(560, 0.08, 'square', 0.09, 680, 0.05); },
    build:  () => { tone(220, 0.12, 'square', 0.14); tone(300, 0.1, 'square', 0.1, null, 0.06); },
    forge:  () => { [0, 0.16, 0.34].forEach(d => { noise(0.06, 0.4, 2600, d); tone(180, 0.05, 'square', 0.16, 90, d); }); tone(900, 0.5, 'triangle', 0.08, 1500, 0.42); },
    power:  () => { tone(220, 0.55, 'sawtooth', 0.26, 900); noise(0.5, 0.18, 2200); },
    curse:  () => { tone(180, 0.32, 'sawtooth', 0.2, 120); tone(191, 0.32, 'square', 0.1); },
    turn:   () => { tone(120, 0.13, 'sine', 0.2, 90); noise(0.1, 0.14, 500); },
    reward: () => [523, 659, 784].forEach((f, i) => tone(f, 0.18, 'triangle', 0.18, null, i * 0.07)),
    error:  () => tone(150, 0.14, 'square', 0.16, 95),
    alarm:  () => { tone(880, 0.12, 'square', 0.2); tone(660, 0.12, 'square', 0.2, null, 0.14); },
    victory:() => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.35, 'triangle', 0.22, null, i * 0.12)),
    defeat: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.42, 'sawtooth', 0.2, null, i * 0.14)),
  };
  // ── atmosphere: sustained procedural drones per context (no asset files) ──
  const MODES = {
    menu:  { freqs: [110, 164.81, 220, 293.66], type: 'sine',     gain: 0.06, cut: 1200, trem: 0.09 },
    path:  { freqs: [110, 146.83, 220, 329.63], type: 'sine',     gain: 0.05, cut: 950,  trem: 0.07 },  // mysterious
    battle:{ freqs: [55, 82.41, 110, 164.81],   type: 'sawtooth', gain: 0.05, cut: 480,  trem: 0.16 },  // low rumble
    boss:  { freqs: [55, 110, 138.59, 207.65],  type: 'sawtooth', gain: 0.08, cut: 720,  trem: 0.22 },  // epic/ominous
    shop:  { freqs: [130.81, 196, 261.63, 392], type: 'triangle', gain: 0.05, cut: 1700, trem: 0.05 },  // light
  };
  function stopMusic() {
    if (!ctx) { musicVoices = []; return; }
    const t = ctx.currentTime;
    for (const v of musicVoices) {
      try { v.g.gain.cancelScheduledValues(t); v.g.gain.setTargetAtTime(0.0001, t, 0.5);
            v.o.stop(t + 1.8); if (v.lfo) v.lfo.stop(t + 1.8); } catch (e) {}
    }
    musicVoices = [];
  }
  function music(mode) {
    if (!ensure()) { musicMode = mode; return; }   // deferred until first gesture unlocks audio
    resume();
    if (musicMode === mode) return;
    musicMode = mode;
    stopMusic();
    const spec = MODES[mode]; if (!spec) return;
    musicFilter.frequency.setTargetAtTime(spec.cut, ctx.currentTime, 0.7);
    const t0 = ctx.currentTime;
    spec.freqs.forEach((f, i) => {
      const o = ctx.createOscillator(); o.type = spec.type; o.frequency.value = f;
      o.detune.value = (i % 2 ? 1 : -1) * (4 + i * 2);              // gentle chorus
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, spec.gain / (1 + i * 0.3)), t0 + 2.5 + i * 0.6);
      const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.05 + i * 0.02;
      const lg = ctx.createGain(); lg.gain.value = spec.gain * spec.trem;  // slow swell
      lfo.connect(lg); lg.connect(g.gain);
      o.connect(g); g.connect(musicFilter);
      o.start(t0); lfo.start(t0);
      musicVoices.push({ o, g, lfo });
    });
  }
  return {
    play(name) { if (muted) return; resume(); (bank[name] || (() => {}))(); },
    music(mode) { music(mode); },
    unlock() { ensure(); resume(); if (musicMode) { const m = musicMode; musicMode = null; music(m); } },
    setMuted(b) { muted = !!b; localStorage.setItem('dc_muted', muted ? '1' : '0'); applyGains(); if (!muted) resume(); return muted; },
    toggle() { return this.setMuted(!muted); },
    setSfx(v) { sfxVol = cl01(v, sfxVol); localStorage.setItem('dc_sfxvol', String(sfxVol)); applyGains(); if (!muted) bank.tap(); },
    setMusic(v) { musicVol = cl01(v, musicVol); localStorage.setItem('dc_musicvol', String(musicVol)); applyGains(); },
    get muted() { return muted; }, get sfxVol() { return sfxVol; }, get musicVol() { return musicVol; },
  };
})();
function haptic(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// ── contextual tutorial: one-time coach tips, fired the first time you hit a
//    concept. Persisted in localStorage so they never nag a returning player. ──
const COACH = {
  battle: {h:'How battles work', t:'Your units act on <b>Action Points</b> — tap a unit, then a highlighted tile to <b>move</b> or an enemy to <b>attack</b>, all free. Your <b>cards</b> (bottom) cost <b>Command Points</b> to reinforce and command your army. Tap <b>Danger</b> anytime to see where enemies can strike.'},
  map:    {h:'The Expedition', t:'Pick your path up the act — <b>skirmishes</b>, <b>elites</b>, <b>caches</b>, <b>camps</b>, <b>outposts</b>, and the <b>boss</b> at the top. Your army is <b>permadeath</b>: units that fall are gone for the run. Bank <b>salvage</b> at outposts to buy, upgrade, and thin your deck.'},
  power:  {h:'Command Power ready', t:'Your gauge is <b>full</b> — tap the glowing <b>Power</b> button to unleash your general\'s signature ability. It costs the whole gauge, so pick your moment.'},
  retain: {h:'Keep a card', t:'At end of turn your hand is discarded — but tap the <b>★</b> on a card to <b>keep</b> it for next turn. Save a key card for the right moment.'},
};
let _coachBusy = false;
function coach(id) {
  const c = COACH[id];
  if (!c || _coachBusy || localStorage.getItem('dc_c_' + id) || localStorage.getItem('dc_tut_off')) return;
  _coachBusy = true;
  localStorage.setItem('dc_c_' + id, '1');
  const el = $('#coach');
  el.innerHTML = `<div class="ch">${si('bulb',16)} ${c.h}</div><div class="ct">${c.t}</div>
    <div class="cbtn">${ibtn('continue','dismissCoach()')}</div>`;
  el.classList.add('show');
}
function dismissCoach() { $('#coach').classList.remove('show'); _coachBusy = false; }
function resetTutorial() {
  Object.keys(COACH).forEach(k => localStorage.removeItem('dc_c_' + k));
  localStorage.removeItem('dc_tut_off'); localStorage.removeItem('dc_seenHelp');
  toast('Tutorial tips reset — they\'ll show again as you play.');
}
function screenShake() { const a = $('#app'); if (a) { a.classList.remove('shaking'); void a.offsetWidth; a.classList.add('shaking'); } }
function orientPref() { return localStorage.getItem('dc_orient') || 'landscape'; }
function setOrient(mode) {
  localStorage.setItem('dc_orient', mode);
  if (window.__setOrientation) window.__setOrientation(mode);
  _applyOrient();
  Sfx.play('tap'); showSettings();
}
function toggleSettings() { _dropCmd(); const o = $('#ovSettings'); if (o && o.classList.contains('show')) closeOv('ovSettings'); else showSettings(); }

  if (!(await gameConfirm(`Retreat and end this run now? It's recorded as a <b class="red">defeat</b> — you keep all merit, stats and records, exactly like any other loss.`, 'Retreat'))) return;
  closeOv('ovSettings');
  render(await api('/api/retreat', {}));   // sets the run result to defeat → the run-result screen shows

// analog volume dial — fully tunable in-app (Settings → Debug → Gauge tuner); config persists.
const GAUGE_DEF = { fL:5, fT:22, fW:89.5, fH:74, pL:50, pT:86.5, nlPct:34, hbPct:3, rmin:-164, rmax:-19, nd:'needle_arrow', nz:'mid' };
function gaugeCfg(){ try { const v = localStorage.getItem('dc_gauge_cfg'); if (v) return Object.assign({}, GAUGE_DEF, JSON.parse(v)); } catch(e){} return Object.assign({}, GAUGE_DEF); }
function saveGaugeCfg(c){ try { localStorage.setItem('dc_gauge_cfg', JSON.stringify(c)); } catch(e){} }
function _gaugeAngle(v, c){ c = c || gaugeCfg(); return c.rmin + (c.rmax - c.rmin) * Math.max(0, Math.min(100, v)) / 100; }
let _dragGauge = null;
function volGauge(ch, pct, disabled){
  return `<div class="vgauge${disabled?' dis':''}" data-ch="${ch}" data-v="${pct}">
    <div class="vg-f"></div><img class="vg-b" src="assets/ui/gauge/bezel.png" alt="">
    <div class="vg-p"><img class="vg-n" alt=""></div></div>`;
}
function _gaugeDrag(e){
  const g = _dragGauge; if (!g) return;
  const c = gaugeCfg();
  const r = g.getBoundingClientRect();
  const px = r.left + r.width*(c.pL/100), py = r.top + r.height*(c.pT/100);
  const cx = e.touches?e.touches[0].clientX:e.clientX, cy = e.touches?e.touches[0].clientY:e.clientY;
  let a = Math.atan2(cy-py, cx-px) * 180/Math.PI;
  if (a > 150) a -= 360;

function render(state) {
  if (state.state) state = state.state;   // unwrap play/end responses
  animGen++;                              // invalidate any in-flight replay
  S = state;
  cacheEarnedAch();                       // refresh the earned-achievement cache from any state that carries it (battle state doesn't)
  if (S.new_achievements && S.new_achievements.length) {   // 🏆 earned this action
    S.new_achievements.forEach(a => _achQueue.push(a));
    _runAchQueue();
    const newAch = S.new_achievements.map(a => a.id);
    _checkFogUnlocks(newAch);      // a gating achievement may have unlocked a fog style
    _checkMarkerUnlocks(newAch);   // …or a battle move/target marker style
  }
  if (S.new_unlocks && S.new_unlocks.length) {   // general Merit/Ascension rewards
    S.new_unlocks.forEach(u => _achQueue.push({ _unlock: true, kind: u.kind, name: u.name, flavor: u.desc }));
    _runAchQueue();
    const u0 = S.new_unlocks[0];   // teach the progression-unlock system on the very first one; rest stay quick toasts
    queueUnlock({ kindLabel: u0.kind === 'medal' ? 'Permanent Unlock — Relic' : 'Permanent Unlock — Card', name: u0.name,
      seenKey: 'dc_ulk_progression',
      hint: 'You earned permanent content for this commander. Merit — your lifetime score — and Ascensions unlock more; track it all on the Generals screen.' });
  }
  _checkPlaqueUnlocks();   // a cleared Ascension may have raised a commander's plaque tier
  _checkAscUnlocks();      // …and may have opened a new Ascension difficulty tier
  const mode = S.mode || (S.started ? 'battle' : 'picker');
  if (mode !== 'battle') {
    // leaving a fight → tear down all battle-only + transient UI so nothing floats on the map/menu
    ['unitinfo', 'prompt'].forEach(id => { const el = $('#' + id); if (el) el.innerHTML = ''; });
    if (_inBattlePrev) { const t = $('#toast'); if (t) { clearTimeout(t._h); t.classList.remove('show'); } }   // kill any leftover battle toast — but only ON exit, so map toasts still show
    cmd = null; sel = null; legal = null; _prevCpHold = null;
  }
  _inBattlePrev = (mode === 'battle');
  // leaving the picker → tear down the run-setup overlays so the map/battle isn't hidden behind them
  // (START RUN from the Deploy popup used to leave #ovDeploy open, covering the map).
  if (mode !== 'picker') { closeOv('ovGeneral'); closeOv('ovDeploy'); }
  if (mode === 'picker') { Sfx.music('menu'); setScreen(false); $('#app').style.display='flex'; showGenerals(); return; }
  if (mode === 'map') { Sfx.music('path'); setScreen(true); renderMapScreen(); coach('map'); if (S.upgrade_fx) playForgeFx(S.upgrade_fx); else if (S.removed_fx) playRemovedFx(S.removed_fx); return; }
  // ── battle ──
  Sfx.music(S.boss ? 'boss' : 'battle');
  setScreen(false);
  $('#ovGeneral').classList.remove('show');
  if (!S.board) return;
  // fresh-battle signature (seed+level+dims) — more reliable than width alone (two same-width battles
  // in a row would otherwise skip the refit/recentre and inherit the previous battle's zoom + scroll)
  const bsig = S.seed + ':' + (S.level ? S.level.index : '?') + ':' + S.board.width + 'x' + S.board.height;
  const freshBattle = bsig !== _lastBattleSig;
  if (freshBattle) {   // new battle: refit zoom, drop stale selection, recentre on your camp
    _lastBattleSig = bsig;
    lastBoardW = S.board.width;
    cancelSelState();
    fitCell();
    _prevCpHold = null;                   // don't toast a control-point "change" on battle entry
  }
  // control-point feedback: holding a battlefield ◆ point grants +1 max CP — call it out when it flips.
  // Skip it entirely once the battle is decided (S.result) — you don't need a "point dropped" toast as the fight ends.
  if (S.cp_total > 0 && S.cp_hold != null && !S.result) {
    if (_prevCpHold != null && S.cp_hold !== _prevCpHold) {
      const d = S.cp_hold - _prevCpHold;
      toast(d > 0 ? `⚑ Control point held — +${d} max CP` : `⚑ Control point lost — ${d} max CP`);
    }
    _prevCpHold = S.cp_hold;
  }
  renderHud(); renderBoard(); renderHand(); renderPrompt();
  if (freshBattle) centerOnHQ();          // open the battle looking at the player camp, not the enemy corner
  updateEndBtn();                         // End Turn only shows on our turn (hidden during enemy play)
  if (dangerOn) refreshDanger();          // keep the danger overlay current
  if (S.result && !_deferResult) showBattleResult();   // held until enemy anim finishes
  else if (S.pending_workshop) showWorkshop();   // boss maps carry Workshops
  else { ['ovResult','ovUpgrade'].forEach(closeOv); maybeShowIntro(); coach('battle'); }
  if (S.power && S.power.ready) coach('power');   // teach the Command Power when it first charges
}

// Earned-achievement cache. The in-BATTLE serialize (serialize()) carries no `achievements` array —
// only the menu/meta view does. So unlock checks must NOT read S.achievements directly (they'd fail
// in battle, reverting every cosmetic to its default). We cache the earned ids from any state that
// carries them (menu/map/results) into localStorage, and gate against that persistent cache instead.
let _earnedAch = null;
function cacheEarnedAch(){
  if (typeof S !== 'undefined' && S && Array.isArray(S.achievements)) {
    _earnedAch = new Set(S.achievements.filter(a => a.earned).map(a => a.id));
    try { localStorage.setItem('dc_earned_ach', JSON.stringify([..._earnedAch])); } catch (e) {}
  }
}
function earnedAch(){
  if (_earnedAch) return _earnedAch;
  try { const v = localStorage.getItem('dc_earned_ach'); if (v) return (_earnedAch = new Set(JSON.parse(v))); } catch (e) {}
  return (_earnedAch = new Set());
}
function achName(id){ const a = (typeof S !== 'undefined' && S && S.achievements) ? S.achievements.find(x => x.id === id) : null;
  return (a && a.name && a.name !== '???') ? a.name : 'a secret feat'; }

function fogUnlocked(id){ const s = FOG_SETS.find(f => f.id === id); if (!s) return false; if (!s.req) return true; return earnedAch().has(s.req); }
function fogReqName(req){ return achName(req); }
function fogSet(){ try { const v = localStorage.getItem('dc_fogset'); return (v && FOG_SETS.some(f => f.id === v) && fogUnlocked(v)) ? v : 'billow'; } catch (e) { return 'billow'; } }
function fogWin(){ const s = FOG_SETS.find(f => f.id === fogSet()); return !!(s && s.win); }
function fogSuffix(){ const s = FOG_SETS.find(f => f.id === fogSet()); return s ? s.suf : ''; }
function fogCount(){ const s = FOG_SETS.find(f => f.id === fogSet()); return s ? s.n : 4; }   // # of whole-image fill tiles in the active set

function renderMapGraph() {
  const rows = S.rows, W = S.width || 4;
  const rowGap = 92, padY = 34;
  // spread columns to fill the width; landscape uses W+1 equal gaps so the edge margin
  // matches the inter-column gap (padX = colGap). Portrait stays compact.
  const scW = ($('#mapscroll') ? $('#mapscroll').clientWidth : 0) || window.innerWidth || 360;
  let colGap, padX;
  if (scW > 720) { colGap = Math.min(240, (scW - 8) / (W + 1)); padX = colGap; }
  else { colGap = Math.max(78, Math.min(240, (scW - 100) / Math.max(1, W - 1))); padX = 42; }
  const innerW = padX*2 + (W-1)*colGap, innerH = padY*2 + (rows-1)*rowGap;
  const el = $('#mapinner');
  el.style.width = innerW+'px'; el.style.height = innerH+'px';
  const byId = {}; S.nodes.forEach(n=>byId[n.id]=n);
  const pos = n => ({x: padX + n.col*colGap, y: innerH - padY - n.row*rowGap});  // row 0 at bottom
  let html = '';
  S.nodes.forEach(n=>{
    const a = pos(n);
    n.edges.forEach(eid=>{
      const m = byId[eid]; if(!m) return;
      const b = pos(m), dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy), ang=Math.atan2(dy,dx)*180/Math.PI;
      const open = (n.id===S.pos && m.avail);
      html += `<div class="medge ${open?'open':''}" style="left:${a.x}px;top:${a.y}px;width:${len}px;transform:rotate(${ang}deg)"></div>`;
    });
  });
  S.nodes.forEach(n=>{
    const p = pos(n);
    let cls = 'mnode';
    if (n.kind==='boss') cls+=' boss';
    if (n.id===S.pos) cls+=' here';
    else if (n.done) cls+=' done';
    else if (n.avail) cls+=' avail';
    if (n.jump) cls+=' jump';                 // Field Compass parallel-path target
    let tap;
    if (n.kind === 'boss' && !n.avail) tap = `onclick="showActBoss()"`;   // preview the act boss before you can reach it
    else if (n.avail) tap = n.jump ? `onclick="jumpTo('${n.id}')"` : `onclick="travelTo('${n.id}')"`;
    else tap = `onclick="showNodeInfo('${n.kind}')"`;   // not your next move → explain what this node is + what to expect
    if (_nodeFilter) cls += (n.kind === _nodeFilter) ? ' match' : ' nomatch';   // legend spotlight
    const icon = (n.kind === 'boss' && S.act_boss) ? bossFace(S.act_boss.id, 74) : nodeIconHTML(n.kind);
    html += `<div class="${cls}" data-kind="${n.kind}" style="left:${p.x}px;top:${p.y}px" ${tap}>${icon}</div>`;
  });
  el.innerHTML = html;
  const sc = $('#mapscroll');
  const focus = S.pos ? pos(byId[S.pos]) : {y: innerH};
  sc.scrollTop = Math.max(0, focus.y - sc.clientHeight/2);
}
// re-lay the map on rotate / resize so column spacing fills the new width
let _mapRelayout = 0;
window.addEventListener('resize', () => {
  clearTimeout(_mapRelayout);
  _mapRelayout = setTimeout(() => {
    const mv = document.getElementById('mapview');
    if (mv && mv.classList.contains('show') && typeof S !== 'undefined' && S && S.nodes) renderMapGraph();
  }, 150);
});

async function travelTo(nid) { render(await api('/api/travel', {node: nid})); }
async function jumpTo(nid) {
  if (!(await gameConfirm('Use a Field Compass charge to jump to this parallel path?', 'Jump'))) return;
  render(await api('/api/travel', {node: nid}));
}
// in-DOM confirm — native confirm() is blocked/inconsistent across WKWebView (iOS) and Tauri (macOS)
function gameConfirm(msg, okLabel) {
  return new Promise(res => {
    const o = $('#ovConfirm');
    o.innerHTML = `<div class="choice" style="max-width:340px">
        <div style="font-size:14px;line-height:1.5;margin-bottom:12px">${msg}</div>
        <div style="display:flex;gap:12px;justify-content:center">
          <button id="_cfok" class="ibtn" aria-label="${okLabel || 'Confirm'}"><img src="assets/ui/btn/confirm.png" alt="${okLabel || 'Confirm'}"></button>
          <button id="_cfno" class="ibtn" aria-label="Cancel"><img src="assets/ui/btn/cancel.png" alt="Cancel"></button>
        </div></div>`;
    o.classList.add('show');
    const done = v => { o.classList.remove('show'); res(v); };
    o.querySelector('#_cfok').onclick = () => done(true);
    o.querySelector('#_cfno').onclick = () => done(false);
    o.onclick = e => { if (e.target.id === 'ovConfirm') done(false); };
  });
}

// ornate container wrapper. `hdr` = a header-plaque key (assets/ui/hdr/<key>.png) OR plain text (fallback banner)
const HDR_KEYS = new Set(['act1','act2','act3','act4','army','battle_spoils','battle_won','cache','camp','cards','deck','defeat','event','generals','history','how_to_play','key','medal_earned','medals','menu','mission_complete','mission_failed','more','outpost','remove','settings','shop','tribe_salvage','upgrade','workshop']);

    ? `<div class="ofbanner ofhdr"><img src="assets/ui/hdr/${hdr}.png" alt=""></div>`
    : `<div class="ofbanner"><span>${hdr}</span></div>`;
}
function oframe(inner, hdr) {

}
// copper (frame2) caption panel — houses an overlay's white descriptive/empty-state text

// pre-made labeled image button (icon + text baked in). opts: {cls, dis, style}
function ibtn(name, onclick, opts) {

}
// main-menu tile: wide labeled plate (portrait) + square tile (landscape); CSS picks by orientation.
function mtile(name, onclick, label) {

// labeled plate button. opts.active: true=highlighted toggle, false=dimmed toggle, undefined=plain solo button.
function pbtn(name, onclick, opts) {

// vintage price tag — the salvage cost printed on the parchment tag
function priceTag(cost) { return `<span class="pricetag"><img src="assets/ui/pricetag.png" alt=""><span class="ptval">${si('salvage',13)}${goldText(String(cost))}</span></span>`; }
// battle stat nameplate (HQ / BASES / TROOPS) — value stamped on the right plaque.
// Number style is player-picked in Settings: A = engraved gold, B = silver metal, C = bronze.
function pillNumStyle(){ try { return localStorage.getItem('dc_pillnum') || 'B'; } catch (e) { return 'B'; } }
function setPillNumStyle(v){ try { localStorage.setItem('dc_pillnum', v); } catch (e) {} if (S && S.board) renderHud(); showSettings(); }
function pillVal(val) {
  const s = pillNumStyle();
  if (s === 'B')   // silver metal digits (assets/digits); slash borrowed from the gold glyph, desaturated to steel
    return `<span class="mn">` + String(val).split('').map(d => /[0-9]/.test(d)
      ? `<img class="md" src="assets/digits/${d}.png" alt="${d}">`
      : `<img class="msl" src="assets/ui/glyph/slash.png" alt="${d}">`).join('') + `</span>`;
  const dir = s === 'C' ? 'glyph_bronze' : 'glyph';   // A + C both use the glyph atlas (C = bronze variant)
  return `<span class="gtext">` + String(val).split('').map(ch => {
    const f = /[A-Za-z0-9]/.test(ch) ? ch.toLowerCase() : GLYPH_PUNCT[ch];
    return f ? `<img src="assets/ui/${dir}/${f}.png" alt="${ch}">` : '';
  }).join('') + `</span>`;
}
// landscape uses the wide labeled plate (pill/<name>.png); portrait swaps to the compact icon-only plate (pill/<name>_p.png) — CSS picks by orientation
function bpill(name, val, cls, onclick) { return `<span class="bpill ${cls||''} num${pillNumStyle()}"${onclick?` onclick="${onclick}" style="cursor:pointer"`:''}><img class="pl-l" src="assets/ui/pill/${name}.png" alt=""><img class="pl-p" src="assets/ui/pill/${name}_p.png" alt=""><span class="bpv">${pillVal(val)}</span></span>`; }
// gold bitmap text composed from the character-sheet glyph atlas (assets/ui/glyph). Digits/% scale cleanly.
const GLYPH_PUNCT = {'!':'excl','?':'ques','.':'dot',',':'comma',':':'colon',';':'semi',"'":'apos','"':'quot',
  '+':'plus','-':'minus','=':'eq','_':'under','/':'slash','\\':'bslash','|':'pipe','(':'lparen',')':'rparen',
  '[':'lbrack',']':'rbrack','{':'lbrace','}':'rbrace','<':'lt','>':'gt','*':'star','#':'hash','@':'at',
  '$':'dollar','%':'pct','&':'amp','^':'caret','~':'tilde'};
function glyphText(str, cls) {
  return `<span class="gtext${cls ? ' ' + cls : ''}">` + String(str).split('').map(ch => {
    if (ch === ' ') return '<span class="gsp"></span>';
    const f = /[A-Za-z0-9]/.test(ch) ? ch.toLowerCase() : GLYPH_PUNCT[ch];
    return f ? `<img src="assets/ui/glyph/${f}.png" alt="${ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch === '&' ? '&amp;' : ch}">` : '';
  }).join('') + `</span>`;
}
function goldText(str) { return glyphText(str); }              // gold foil
function steelText(str) { return glyphText(str, 'steel'); }    // desaturated steel
// live seed field: keep the numeric value, mirror it into gold glyphs on the plaque (dim "RANDOM" when empty).

}

  const pr=p.prices, sal=p.salvage, cost = mode==='upgrade'?pr.upgrade:pr.remove;
  const afford = sal>=cost, usable = c => mode==='upgrade' ? c.upgradeable : c.removable;
  const cards = (p.deck||[]).slice().sort((a,b)=>(RARITY_ORDER[a.rarity]-RARITY_ORDER[b.rarity])||a.name.localeCompare(b.name));
  const grid = cards.map(c=>{
    const ok = usable(c) && afford;
    return framedTile(c, `shopPick('${mode}','${c.id}')`, { count: c.n, up: c.up, dim: ok ? '' : 'disabled' });
  }).join('');
  const title = mode==='upgrade' ? '⬆ Upgrade a card' : '✕ Remove a card';
  const hint = mode==='upgrade' ? `Tap a card to upgrade it — ${siEm('salvage')}${cost} each.` : `Tap a card to scrap it and thin your deck — ${siEm('salvage')}${cost}.`;
  $('#ovDeck').innerHTML = oframe(`<p style="margin-top:10px">${hint}${afford?'':' <span class="red">— not enough salvage</span>'}</p>
    <div class="collgrid">${grid||'<div class="d">no eligible cards</div>'}</div>`, mode==='upgrade'?'upgrade':'remove')
    + `<div class="ovclose"><button class="ibtn" onclick="closeOv('ovDeck')" aria-label="Back"><img src="assets/ui/btn/return.png" alt="Back"></button></div>`;
  $('#ovDeck').classList.add('show');
}
function shopPick(mode,id){
  if (mode === 'upgrade') {   // preview the card AS UPGRADED; keep the deck list open UNDER the peek so Return goes back to it
    const c = (S.pending.deck||[]).find(x=>x.id===id); if(!c) return;
    const view = Object.assign({}, c, { upgraded:true, name: /\+$/.test(c.name)?c.name:c.name+'+',
      cost: c.up_cost!=null?c.up_cost:c.cost, text: c.up_text || c.text });
    peekCard(view, 'Upgrade this card', ()=>{ closeOv('ovDeck'); shopUpgrade(id); }, false, {noDetail:true});   // Confirm closes the list + applies; Return just closes the peek → back to the list
    return;
  }
  closeOv('ovDeck');
  shopUpgradeOrRemove(id);
}

async function usePower() {
  if (_powLong) { _powLong=false; return; }    // long-press showed info; don't fire
  const p = S.power;
  if (!p || !p.ready) { if (p) toast(`${p.gname} gauge not full`); return; }
  if (p.usable === false) { toast(p.why || "can't use that right now"); return; }   // e.g. Rally at troop cap — don't arm, don't drain
  // targetable power → arm it and let the player pick one of their units
  if (p.needs === 'own_unit') {
    if (!p.targets || !p.targets.length) { toast('no valid unit to target'); return; }
    disarmEnd();
    cancelSelState();
    powerArm = true;
    legal = { kind: 'units', set: new Set(p.targets) };
    Sfx.play('tap'); haptic(20);
    renderBoard(); renderHand(); renderPrompt();
    toast(`${p.name} — tap one of YOUR units`);   // toast is textContent-only; no icon markup here
    return;
  }
  await firePower(null);
}
async function firePower(target) {
